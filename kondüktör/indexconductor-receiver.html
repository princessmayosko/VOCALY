<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocaly — Konduktör</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607}
#scene{position:fixed;inset:0;background:#050607 center/cover no-repeat url('scene_reference.png')}
#handWrap{position:absolute;right:1.5vw;bottom:-2vh;width:min(42vw,650px);z-index:3;transform:translate3d(0,0,0);will-change:transform}
#handWrap img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.35))}
#status{position:absolute;right:24px;bottom:22px;z-index:8;padding:12px 15px;border:1px solid #334042;border-radius:12px;background:rgba(5,8,9,.88);color:#dce2e2;font:12px Arial;min-width:245px}
.ok{color:#8ee6b1}.wait{color:#e5c88e}.bad{color:#ff9b9b}
#code{font-size:10px;color:#a9b3b4;margin-top:5px;word-break:break-all}
#read{margin-top:7px;color:#b7c0c1;font-size:10px}
</style></head>
<body>
<div id="scene"></div>
<div id="handWrap"><img src="hand_baton.png"></div>
<div id="status"><span class="wait">● BAĞLANTI HAZIRLANIYOR…</span><div id="code"></div><div id="read"></div></div>
<script>
const peer=new Peer(), hand=document.getElementById('handWrap');
const status=document.getElementById('status'), code=document.getElementById('code'), read=document.getElementById('read');
let baseB=null,baseG=null,x=0,y=0,tx=0,ty=0,last=performance.now();

peer.on('open',id=>{
 code.textContent='Telefon kodu: '+id;
 status.innerHTML='<span class="ok">● HAZIR</span><div id="code">Telefon kodu: '+id+'</div><div id="read"></div>';
});
peer.on('connection',conn=>{
 status.innerHTML='<span class="wait">● TELEFON BAĞLANIYOR…</span>';
 conn.on('open',()=>{
   status.innerHTML='<span class="ok">● TELEFON BAĞLANDI</span><div id="code">Nötr pozisyonu telefon sayfasından kalibre et.</div><div id="read"></div>';
 });
 conn.on('data',d=>{
   if(!d)return;
   const b=Number(d.beta),g=Number(d.gamma);
   const r=document.getElementById('read');
   if(r) r.textContent=`β ${b.toFixed(1)}°  γ ${g.toFixed(1)}°`;
   if(!Number.isFinite(b)||!Number.isFinite(g))return;
   if(d.calibrate){
      baseB=b;baseG=g;tx=ty=x=y=0;return;
   }
   if(baseB===null){baseB=b;baseG=g}
   const db=b-baseB, dg=g-baseG;
   // Ayna mantığı: telefonda yukarı -> ekranda yukarı; sağ -> sağ.
   // Önceki sürümde eksen işareti ters olduğu için burada iki ekseni de tersliyoruz.
   tx=Math.max(-230,Math.min(230,-dg*7.0));
   ty=Math.max(-180,Math.min(180,-db*6.0));
 });
});
function loop(){
 const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
 const k=1-Math.exp(-dt*16);
 x+=(tx-x)*k;y+=(ty-y)*k;
 hand.style.transform=`translate3d(${x}px,${y}px,0)`;
 requestAnimationFrame(loop);
}
loop();
</script></body></html>
