<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vocaly Cetveli - Bloklu</title>

:root{
  --bg1:#06122d;
  --bg2:#091735;
  --text:#f8fafc;
  --panel-border:rgba(255,255,255,0.08);

  --do:#ff5a5f;
  --re:#ff9d2e;
  --mi:#ffd43b;
  --fa:#32d583;
  --sol:#4ea1ff;
  --la:#a970ff;
  --si:#ff5db1;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left, rgba(255,255,255,0.05), transparent 28%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  overflow:hidden;
}

.app{
  position:relative;
  width:100%;
  height:100%;
}

/* ÜST */
.topbar{
  position:absolute;
  top:10px;
  left:12px;
  right:12px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:20;
}
.iconBtn{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  color:#fff;
  background:rgba(255,255,255,0.08);
  box-shadow:0 8px 20px rgba(0,0,0,0.22);
  font-size:20px;
}
.brand{
  font-size:22px;
  font-weight:700;
  letter-spacing:.2px;
}

/* SOL AÇ/KAPA */
.railToggle{
  position:absolute;
  top:96px;
  left:10px;
  width:34px;
  height:120px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.05);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:25;
  backdrop-filter:blur(10px);
  box-shadow:0 10px 24px rgba(0,0,0,0.22);
  cursor:pointer;
}
.railToggle span{
  transform:rotate(90deg);
  display:block;
  font-size:18px;
}

.leftPanel{
  position:absolute;
  top:72px;
  bottom:24px;
  left:0;
  width:96px;
  transform:translateX(-76px);
  transition:transform .28s ease;
  z-index:15;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}
.leftPanel.open{
  transform:translateX(0);
}
