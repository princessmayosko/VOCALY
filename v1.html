<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VOCALY</title>
  <script src="https://unpkg.com/wavesurfer.js@6"></script>
  <style>
    :root{
      --bg:#08111f; --bg2:#0f1b2d; --panel:rgba(12,22,39,.94); --line:rgba(255,255,255,.10);
      --text:#eef4ff; --muted:#9fb0c9; --yellow:#facc15; --purple:#8b5cf6; --blue:#60a5fa;
      --green:#22c55e; --red:#ef4444; --shadow:0 12px 36px rgba(0,0,0,.32);
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:Arial,sans-serif}
    body{min-height:100vh} button,input,textarea,select{font:inherit} .hidden{display:none!important}
    .app{max-width:1200px;margin:0 auto;padding:14px 14px 42px} .topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(8,17,31,.96),rgba(8,17,31,.78));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .topbar-inner{max-width:1200px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;justify-content:center} .logoBtn{border:none;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .logoWord{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:14px;background:radial-gradient(circle at 30% 30%,#fde047 0,#facc15 42%,#ca8a04 100%);color:#111827;font-weight:900;letter-spacing:.8px;box-shadow:0 8px 24px rgba(250,204,21,.22)}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px;margin-top:16px;overflow:hidden}
    .sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px} .sectionTitle h2{margin:0;font-size:20px}
    .metaRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center} .smallBtn{padding:10px 12px;border:none;border-radius:12px;background:rgba(255,255,255,.08);color:var(--text);cursor:pointer}
    .smallBtn.primary{background:linear-gradient(135deg,var(--purple),#6d28d9)}
    .measureToolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .measureToolbarGroup{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:6px 8px}
    .measureIconBtn{width:42px;height:42px;border:none;border-radius:12px;background:rgba(255,255,255,.07);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;line-height:1;flex:0 0 auto}
    .measureIconBtn.primary{background:linear-gradient(135deg,var(--purple),#6d28d9)}
    .measureTolerance{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:14px;padding:0 10px;height:42px;color:var(--text)}
    .measureTolerance select{background:transparent;color:var(--text);border:none;outline:none;cursor:pointer;font:inherit}
    .measureTitleRow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
 .bigBtn{width:100%;min-height:66px;border:none;border-radius:18px;background:rgba(255,255,255,.08);color:var(--text);font-size:20px;font-weight:800;cursor:pointer}
    .pill{padding:8px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);display:inline-flex;width:max-content}
    .libraryList{display:flex;flex-direction:column;gap:10px} .libraryItem{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
    .miniBar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04);margin-bottom:10px}
    .iconBtn{width:34px;height:34px;border:none;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;padding:0;font-size:15px}
    .fileLabel{position:relative;overflow:hidden} .fileLabel input{position:absolute;inset:0;opacity:0;cursor:pointer} #zoom{flex:1;min-width:110px}
    .waveShell{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0c1528;width:100%} #waveform{height:300px;overflow-x:auto;overflow-y:hidden;width:100%}
    #overlayViewport{position:absolute;top:0;left:0;right:0;height:98px;overflow:hidden;z-index:8;pointer-events:none;background:linear-gradient(180deg,rgba(10,17,33,.97) 0%, rgba(10,17,33,.92) 70%, rgba(10,17,33,0) 100%)}
    #overlayContent{position:absolute;left:0;top:0;height:98px} #ruler{position:absolute;left:0;top:0;height:36px;border-bottom:1px solid #24355a;background:linear-gradient(180deg,rgba(13,22,44,.98) 0%, rgba(13,22,44,.92) 100%);pointer-events:auto}
    #segmentStrip{position:absolute;left:0;top:36px;height:50px;pointer-events:auto} #stripCursor{position:absolute;top:0;bottom:0;width:2px;background:var(--yellow);opacity:.95;pointer-events:none;z-index:20}
    .ruler-tick{position:absolute;bottom:0;width:1px;background:#4a5f8e} .ruler-tick.major{height:24px;background:#9fb0d8} .ruler-tick.medium{height:15px;background:#6f84b4} .ruler-tick.minor{height:8px;background:#43577f}
    .ruler-label{position:absolute;top:4px;transform:translateX(-50%);font-size:10px;color:#dce8ff;white-space:nowrap;font-weight:700}
    .strip-block{position:absolute;top:8px;height:32px;border-radius:10px;background:#1c2b52;border:1px solid #3c57a1;color:#eef4ff;min-width:34px;overflow:hidden;touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
    .strip-block.intro{background:#4b3a0d;border-color:#b38a17;color:#fde68a} .strip-block.active{box-shadow:0 0 0 3px rgba(139,92,246,.18);border-color:#c4b5fd}
    .strip-block .body{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
    .strip-block .handle{position:absolute;top:0;bottom:0;width:10px;z-index:2} .strip-block .handle.left{left:0;cursor:ew-resize} .strip-block .handle.right{right:0;cursor:ew-resize} .strip-block .drag{position:absolute;left:10px;right:10px;top:0;bottom:0;cursor:grab}
    .rowCompact{display:grid;grid-template-columns:2fr .8fr 1.2fr 1fr .8fr .8fr .7fr auto;gap:8px;align-items:center;margin-top:10px} .rowCompact>*{min-width:0}
    .rowCompact input{padding:10px 11px;border-radius:12px;border:1px solid #334267;background:#0f1830;color:#eef4ff}
    textarea{width:100%;margin-top:10px;min-height:110px;padding:12px;border-radius:14px;border:1px solid #334267;background:#0f1830;color:#eef4ff;resize:vertical;line-height:1.5}
    .statusPills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} #karaoke,#measureBoxes{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;padding:10px;border:1px dashed rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.03);min-height:96px;max-height:44vh;overflow:auto;scroll-behavior:smooth}
    .karaokeBox,.measureBox{position:relative;overflow:hidden;min-width:58px;padding:8px 10px;border-radius:12px;background:#192749;border:1px solid #31497e;font-weight:700;font-size:14px;cursor:pointer;user-select:none;transition:.15s ease;flex:0 0 auto;line-height:1.15}
    .karaokeBox .fill,.measureBox .fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:rgba(139,92,246,.18);pointer-events:none}
    .karaokeBox .label,.measureBox .label{position:relative;z-index:1;white-space:nowrap} .karaokeBox.active,.measureBox.active{border-color:#c4b5fd;box-shadow:0 0 0 4px rgba(139,92,246,.12);transform:scale(1.02)}
    .karaokeBox.intro,.measureBox.intro{background:#4b3a0d;border-color:#b38a17;color:#fde68a} .karaokeBox.selected,.measureBox.selected{box-shadow:0 0 0 4px rgba(96,165,250,.16);border-color:var(--blue)}
    .measureBox.ok{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.55)} .measureBox.bad{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.55)} .measureBox.neutral{background:rgba(148,163,184,.18);border-color:rgba(148,163,184,.5);color:#cbd5f5} .measureBox.neutral .label::after{content:" ♪";opacity:.8;font-size:.92em} .lineBreak{flex-basis:100%;height:0;width:0}
    #vocalyCetvelDrawer{position:fixed;left:0;top:0;bottom:0;width:11vw;min-width:82px;max-width:108px;background:linear-gradient(180deg,rgba(8,17,31,.97),rgba(12,22,39,.98));border-right:1px solid rgba(255,255,255,.08);transform:translateX(-100%);transition:transform .22s ease;z-index:120;display:flex;flex-direction:column;padding:10px 6px;gap:4px;box-shadow:none;overflow:visible}
    #vocalyCetvelDrawer.open{transform:translateX(0);box-shadow:18px 0 44px rgba(0,0,0,.38)} #vocalyCetvelHandle{position:absolute;right:-22px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;text-orientation:mixed;border-radius:0 12px 12px 0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);border-left:none;color:#dbe6ff;font-size:12px;font-weight:800;letter-spacing:.4px;padding:10px 3px;cursor:pointer;user-select:none;backdrop-filter:blur(8px)}
    .cetvelScroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:2px}.cetvelMeta{position:sticky;top:0;z-index:2;padding:6px 4px 8px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:4px;background:linear-gradient(180deg,rgba(8,17,31,.98),rgba(12,22,39,.96))} .cetvelMetaTitle{font-size:10px;color:#9fb0c9;text-align:center;margin-bottom:4px;letter-spacing:.4px}
    .cetvelTarget{min-height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);font-size:12px;font-weight:800;color:#eef4ff;padding:4px 3px;line-height:1.1;text-align:center;word-break:break-word}
    .cetvelBlock{width:100%;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035);font-weight:800;line-height:1.08;color:#dce7ff;overflow:hidden;padding:4px 3px;white-space:normal;word-break:break-word}
    .cetvelBlock.main{min-height:48px;font-size:15px} .cetvelBlock.chromatic{min-height:26px;font-size:10px;opacity:.78}
    .cetvel-do{color:#ef7373} .cetvel-dosharp{color:#d58bd7} .cetvel-re{color:#efb282} .cetvel-resharp{color:#b4d28a} .cetvel-mi{color:#f1d76a} .cetvel-fa{color:#7fd788} .cetvel-fasharp{color:#6fe0c1} .cetvel-sol{color:#6fd8f0} .cetvel-solsharp{color:#87b6ff} .cetvel-la{color:#8da4ff} .cetvel-lasharp{color:#b191ff} .cetvel-si{color:#ff9ed1}
    .cetvelBlock.target{box-shadow:0 0 0 2px rgba(250,204,21,.26) inset,0 0 18px rgba(250,204,21,.12);background:rgba(250,204,21,.10)} .cetvelBlock.detected{box-shadow:0 0 0 2px rgba(34,197,94,.28) inset,0 0 18px rgba(34,197,94,.14);background:rgba(34,197,94,.10)}
    #resultModal{position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; padding:20px;}
    body.cetvel-open #measureSection .card{transition:margin-left .22s ease,width .22s ease,transform .22s ease;}
    @media (max-width:980px){ .rowCompact{grid-template-columns:1fr 1fr} .rowCompact>*:last-child{grid-column:1/-1} #waveform{height:240px} .miniBar{gap:5px} }
    @media (max-width:680px){ #vocalyCetvelDrawer{width:88px;min-width:88px;max-width:88px;padding:8px 5px 10px;gap:4px;background:linear-gradient(180deg,rgba(8,17,31,.72),rgba(12,22,39,.78));backdrop-filter:blur(8px)} #vocalyCetvelHandle{right:-18px;font-size:10px;padding:9px 2px} .cetvelMeta{padding:6px 3px 7px} .cetvelMetaTitle{font-size:8px} .cetvelTarget{min-height:28px;font-size:10px} .cetvelBlock.main{min-height:34px;font-size:11px} .cetvelBlock.chromatic{min-height:22px;font-size:8px;line-height:1.0} .karaokeBox,.measureBox{min-width:52px;padding:7px 8px;font-size:13px} #karaoke,#measureBoxes{max-height:56vh} body.cetvel-open #measureSection .card{margin-left:72px;width:calc(100% - 72px);} .measureTitleRow{display:grid;grid-template-columns:minmax(64px,84px) 1fr;align-items:center;gap:8px} .measureTitleRow h2{font-size:13px;line-height:1.05;max-width:80px;margin:0} .measureToolbar{width:100%;min-width:0;display:flex;align-items:center;justify-content:flex-start;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-ms-overflow-style:none} .measureToolbar::-webkit-scrollbar{display:none} .measureToolbarGroup{flex:0 0 auto;gap:4px;padding:4px 5px;border-radius:12px} .measureIconBtn{width:32px;height:32px;font-size:15px;border-radius:9px} .measureTolerance{flex:0 0 auto;height:32px;padding:0 7px;font-size:12px;gap:4px;border-radius:12px;white-space:nowrap} .measureTolerance select{font-size:12px;min-width:46px} #measureTitle{margin-top:6px} }
  </style>
</head>
<body>
  <aside id="vocalyCetvelDrawer" class="hidden">
    <div id="vocalyCetvelHandle">VOCALY CETVEL</div>
    <div class="cetvelScroll">
    <div class="cetvelMeta"><div class="cetvelMetaTitle">Hedef</div><div class="cetvelTarget" id="cetvelTargetText">—</div></div>
    <div class="cetvelBlock main cetvel-do" data-note="Do">Do</div>
    <div class="cetvelBlock main cetvel-si" data-note="Si">Si</div>
    <div class="cetvelBlock chromatic cetvel-lasharp" data-note="La#">La# / Sib</div>
    <div class="cetvelBlock main cetvel-la" data-note="La">La</div>
    <div class="cetvelBlock chromatic cetvel-solsharp" data-note="Sol#">Sol# / Lab</div>
    <div class="cetvelBlock main cetvel-sol" data-note="Sol">Sol</div>
    <div class="cetvelBlock chromatic cetvel-fasharp" data-note="Fa#">Fa# / Solb</div>
    <div class="cetvelBlock main cetvel-fa" data-note="Fa">Fa</div>
    <div class="cetvelBlock main cetvel-mi" data-note="Mi">Mi</div>
    <div class="cetvelBlock chromatic cetvel-resharp" data-note="Re#">Re# / Mib</div>
    <div class="cetvelBlock main cetvel-re" data-note="Re">Re</div>
    <div class="cetvelBlock chromatic cetvel-dosharp" data-note="Do#">Do# / Reb</div>
    <div class="cetvelBlock main cetvel-do" data-note="Do">Do</div>
    </div>
  </aside>

  <div class="topbar"><div class="topbar-inner"><button class="logoBtn" id="homeLogoBtn"><div class="logoWord">VOCALY</div></button></div></div>

  <div class="app">
    <section id="homeSection">
      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:center;padding:12px 0 6px"><button class="logoBtn" id="homeLogoBigBtn"><div class="logoWord" style="font-size:28px;padding:18px 22px">VOCALY</div></button></div>
        <button class="bigBtn" id="homeLibraryBtn">Kütüphane</button>
        <button class="bigBtn" id="homeEditorBtn">Editör</button>
      </div>
    </section>

    <section id="librarySection" class="hidden">
      <div class="card"><div class="sectionTitle"><h2>Kütüphane</h2><button class="smallBtn" id="libraryBackBtn">Geri</button></div><div id="libraryList" class="libraryList"></div></div>
    </section>

    <section id="measureSection" class="hidden">
      <div class="card">
        <div class="sectionTitle measureTitleRow"><h2>Karaoke / Ölçme</h2><div class="measureToolbar"><div class="measureToolbarGroup"><button class="measureIconBtn" id="measureBackBtn" title="Geri">⟵</button><button class="measureIconBtn primary" id="measurePlayBtn" title="Başlat">▶</button><button class="measureIconBtn" id="measureStopBtn" title="Durdur">■</button><button class="measureIconBtn" id="measureResetBtn" title="Sıfırla">↺</button><button class="measureIconBtn" id="measurePlaySelectedBtn" title="Seçilileri Çal">▤▶</button></div><label class="measureTolerance">± <select id="toleranceSelect"><option value="15" selected>15</option><option value="20">20</option><option value="25">25</option></select></label></div></div>
        <div id="measureTitle" class="pill">—</div>
        <div id="measureBoxes" style="margin-top:12px"></div>
      </div>
    </section>

    <section id="editorSection" class="hidden">
      <div class="card">
        <div class="sectionTitle"><h2>Editör</h2><button class="smallBtn" id="editorBackBtn">Geri</button></div>
        <div class="miniBar">
          <label class="iconBtn fileLabel" title="MP3 Aç">🎵<input type="file" id="audioFile" accept="audio/*"></label>
          <label class="iconBtn fileLabel" title="JSON Aç">📂<input type="file" id="importJsonInput" accept=".json,application/json"></label>
          <button class="iconBtn" id="playBtn" title="Oynat / Durdur">▶</button>
          <button class="iconBtn" id="stopBtn" title="Durdur">■</button>
          <button class="iconBtn" id="zoomOutBtn" title="Zoom -">－</button>
          <input id="zoom" type="range" min="40" max="360" step="10" value="140">
          <button class="iconBtn" id="zoomInBtn" title="Zoom +">＋</button>
          <button class="iconBtn" id="splitWordsBtn" title="Kelimelere Böl">☰</button>
          <button class="iconBtn" id="autoTimingBtn" title="Oto Timing">⚡</button>
          <button class="iconBtn" id="saveProjectBtn" title="JSON İndir">💾</button>
        </div>
        <div class="waveShell"><div id="waveform"></div><div id="overlayViewport"><div id="overlayContent"><div id="ruler"></div><div id="segmentStrip"></div></div><div id="stripCursor"></div></div></div>
        <div class="statusPills"><div class="pill" id="timeText">0.00 sn</div><div class="pill" id="cursorText">Cursor: 0.00 sn</div><div class="pill" id="activeSegmentText">Aktif: -</div></div>
      </div>

      <div class="card">
        <div class="sectionTitle"><h2>Sözler</h2></div>
        <div class="rowCompact">
          <input id="titleInput" type="text" placeholder="Eser başlığı"><input id="intro" type="number" step="0.01" min="0" value="0.00" placeholder="Intro"><input id="hece" type="text" placeholder="Kelime / hece"><input id="nota" type="text" placeholder="Nota"><input id="start" type="number" step="0.01" placeholder="Start"><input id="end" type="number" step="0.01" placeholder="End"><input id="satir" type="number" step="1" min="1" placeholder="Satır"><button class="smallBtn primary" id="saveBtn">Kaydet</button>
        </div>
        <div class="rowCompact">
          <button class="smallBtn" id="updateBtn">Güncelle</button><button class="smallBtn" id="deleteLoadedBtn">Sil</button><button class="smallBtn" id="previewSelectedBtn">Dinle</button><button class="smallBtn" id="resetTimingBtn">Sıfırla</button><button class="smallBtn" id="minusStartBtn">Start -</button><button class="smallBtn" id="plusStartBtn">Start +</button><button class="smallBtn" id="minusEndBtn">End -</button><button class="smallBtn" id="plusEndBtn">End +</button>
        </div>
        <textarea id="lyricsInput" placeholder="Sözleri satır satır yapıştır..."></textarea>
      </div>

      <div class="card"><div class="sectionTitle"><h2>Önizleme</h2></div><div class="metaRow"><button class="smallBtn primary" id="previewPlayBtn">Önizleme</button><button class="smallBtn" id="previewStopBtn">Durdur</button><button class="smallBtn" id="clearSelectionBtn">Seçimi Temizle</button><button class="smallBtn" id="playLineBtn">Satırı Çal</button></div><div id="karaoke"></div></div>
    </section>
  </div>

  <div id="resultModal" class="hidden">
    <div style="width:min(92vw,420px);background:linear-gradient(180deg,#0f1b2d,#08111f);border:1px solid rgba(255,255,255,.12);border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.45);padding:22px;text-align:center;color:#eef4ff;">
      <div id="resultBadge" style="font-size:52px; margin-bottom:10px;">🏅</div>
      <div id="resultTitle" style="font-size:24px; font-weight:900; margin-bottom:8px;">Harika!</div>
      <div id="resultScore" style="font-size:42px; font-weight:900; color:#facc15; margin-bottom:10px;">100</div>
      <div id="resultText" style="color:#c7d4ea; margin-bottom:16px;">Tonu çok iyi yakaladın.</div>
      <button id="resultCloseBtn" class="smallBtn primary">Tamam</button>
    </div>

    function ensureVisible(el, container){
      if(!el || !container) return;

      const cRect = container.getBoundingClientRect();
      const bRect = el.getBoundingClientRect();
      const topSafe = cRect.top + 20;
      const bottomSafe = cRect.bottom - 20;
      const fullyVisible = bRect.top >= topSafe && bRect.bottom <= bottomSafe;

      if(fullyVisible) return;

      const targetScroll = el.offsetTop - (container.clientHeight * 0.30);
      container.scrollTo({
        top: Math.max(0, targetScroll),
        behavior:'smooth'
      });
    }

    function normalizeSingleNote(note){ if(!note) return ''; let n = String(note).trim().toLowerCase(); if(n.includes('/')) n = n.split('/')[0].trim(); const map = {'do':'Do','do#':'Do#','reb':'Reb','re':'Re','re#':'Re#','mib':'Mib','mi':'Mi','fa':'Fa','fa#':'Fa#','solb':'Solb','sol':'Sol','sol#':'Sol#','lab':'Lab','la':'La','la#':'La#','sib':'Sib','si':'Si'}; return map[n] || ''; }
    function getEnharmonicCanon(note){ const n = normalizeSingleNote(note); const map = {'Reb':'Do#','Mib':'Re#','Solb':'Fa#','Lab':'Sol#','Sib':'La#'}; return map[n] || n; }
    function expandTargetNotes(target){ if(!target) return []; return String(target).trim().split(/\s+/).map(normalizeSingleNote).filter(Boolean); }

    function freqToPitchInfo(freq){
      if(!freq || freq <= 0) return null;
      const noteNames = ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
      const midiFloat = 69 + 12 * Math.log2(freq / 440);
      const midiNearest = Math.round(midiFloat);
      const cents = Math.round((midiFloat - midiNearest) * 100);
      const noteIndex = ((midiNearest % 12) + 12) % 12;
      return { note: noteNames[noteIndex], cents, midi: midiNearest, freq };
    }

    function targetMatchesPitch(target, pitchInfo){
      if(!target || !pitchInfo) return false;
      const targetCanon = getEnharmonicCanon(target);
      const detectedCanon = getEnharmonicCanon(pitchInfo.note);
      if(targetCanon !== detectedCanon) return false;
      return Math.abs(pitchInfo.cents) <= CENT_TOLERANCE;
    }

    function noteMatches(targetString, pitchInfo){
      const targets = expandTargetNotes(targetString);
      if(!targets.length || !pitchInfo) return false;
      return targets.some(t => targetMatchesPitch(t, pitchInfo));
    }

    function setCetvelTarget(note){ const display = String(note || '').trim(); cetvelTargetText.textContent = display ? display : '—'; const targets = expandTargetNotes(note); document.querySelectorAll('#vocalyCetvelDrawer .cetvelBlock').forEach(el=>{ const n = el.dataset.note || ''; const canon = getEnharmonicCanon(n); el.classList.toggle('target', targets.some(t => getEnharmonicCanon(t) === canon)); }); }

    async function initPitch(){ if(audioCtx && analyser) return; const stream = await navigator.mediaDevices.getUserMedia({audio:true}); cetvelMicStream = stream; audioCtx = new (window.AudioContext || window.webkitAudioContext)(); micSource = audioCtx.createMediaStreamSource(stream); analyser = audioCtx.createAnalyser(); analyser.fftSize = 2048; dataArray = new Float32Array(analyser.fftSize); micSource.connect(analyser); }
    function autoCorrelate(buf, sampleRate){ let SIZE = buf.length; let rms = 0; for(let i=0;i<SIZE;i++){ let val = buf[i]; rms += val*val; } rms = Math.sqrt(rms/SIZE); if(rms < 0.01) return -1; let r1=0, r2=SIZE-1, thres=0.2; for(let i=0;i<SIZE/2;i++) if(Math.abs(buf[i])<thres){ r1=i; break; } for(let i=1;i<SIZE/2;i++) if(Math.abs(buf[SIZE-i])<thres){ r2=SIZE-i; break; } buf = buf.slice(r1, r2); SIZE = buf.length; let c = new Array(SIZE).fill(0); for(let i=0;i<SIZE;i++){ for(let j=0;j<SIZE-i;j++){ c[i] = c[i] + buf[j]*buf[j+i]; } } let d=0; while(c[d] > c[d+1]) d++; let maxval=-1, maxpos=-1; for(let i=d;i<SIZE;i++){ if(c[i] > maxval){ maxval = c[i]; maxpos = i; } } let T0 = maxpos; if(T0 <= 0) return -1; return sampleRate / T0; }

    function startBoxFill(boxEl, durationMs){
      if(!boxEl) return;
      const fill = boxEl.querySelector('.fill');
      if(!fill) return;
      fill.style.transition = 'none';
      fill.style.width = '0%';
      void fill.offsetWidth;
      fill.style.transition = 'width ' + Math.max(50, durationMs) + 'ms linear';
      fill.style.width = '100%';
    }

    async function playAndMeasureSegment(index, chain=false){
      const seg = heceler[index];
      const boxEl = document.getElementById('measure-box-'+index);
      if(!seg || !boxEl || seg.start===null || seg.end===null || !hasAudioLoaded()) return;
      boxEl.classList.remove('ok','bad','neutral');
      boxEl.classList.add('active');
      ensureVisible(boxEl, measureBoxes);
      const fill = boxEl.querySelector('.fill');
      if(fill){ fill.style.transition='none'; fill.style.width='0%'; }
      const durationMs = Math.max(180, (seg.end - seg.start) * 1000);
      startBoxFill(boxEl, durationMs);
      ws.play(seg.start, seg.end);
      const noteText = String(seg.note || '').trim();
      const hasTargetNote = noteText.length > 0;
      if(!hasTargetNote){
        setCetvelTarget('');
        await new Promise(resolve => setTimeout(resolve, durationMs));
        boxEl.classList.remove('active');
        boxEl.classList.add('neutral');
        if(chain) await new Promise(resolve => setTimeout(resolve,80));
        return;
      }
      setCetvelTarget(noteText);
      await new Promise(resolve => setTimeout(resolve, 160));
      const matched = await startPitchLoop(noteText, boxEl, Math.max(220, durationMs - 160));
      boxEl.classList.remove('active');
      if(matched){ boxEl.classList.remove('bad'); boxEl.classList.add('ok'); } else { boxEl.classList.remove('ok'); boxEl.classList.add('bad'); }
      if(chain) await new Promise(resolve => setTimeout(resolve,80));
    }

    function getMeasureScore(){ const boxes = [...document.querySelectorAll('#measureBoxes .measureBox:not(.intro)')]; const validBoxes = boxes.filter(b => !b.classList.contains('neutral')); const total = validBoxes.length; const ok = validBoxes.filter(b => b.classList.contains('ok')).length; const score = total ? Math.round((ok / total) * 100) : 0; return { total, ok, score }; }
    function showResultModal(){ const { total, ok, score } = getMeasureScore(); let badge = '🏅', title = 'Güzel!', text = `${ok} / ${total} doğru.`; if(score >= 90){ badge='🌟'; title='Harika!'; text='Tonu çok iyi yakaladın.'; } else if(score >= 75){ badge='🥇'; title='Çok iyi!'; text='Gayet başarılı bir performans.'; } else if(score >= 60){ badge='🥈'; title='İyi!'; text='Biraz daha çalışırsan çok daha iyi olacak.'; } else if(score >= 40){ badge='🥉'; title='Devam et!'; text='Bazı notalar geldi, biraz daha tekrar iyi olur.'; } else { badge='🎵'; title='Tekrar deneyelim'; text='Cetveli izleyip bir kez daha deneyebilirsin.'; } resultBadge.textContent = badge; resultTitle.textContent = title; resultScore.textContent = score; resultText.textContent = text; resultModal.classList.remove('hidden'); }

    function toggleMeasureSelection(index){ if(measureSelected.has(index)) measureSelected.delete(index); else measureSelected.add(index); renderMeasure(); }

    function initWave(){ ws = WaveSurfer.create({ container:'#waveform', waveColor:'#4a5f8e', progressColor:'#facc15', cursorColor:'#facc15', height:300, normalize:true, responsive:true, scrollParent:true, minPxPerSec:Number(zoom.value) }); ws.on('ready',()=>{ ws.zoom(Number(zoom.value)); bindWrapperEvents(); setCursorTime(ws.getCurrentTime()); normalizeIntroSegment(); renderAll(); }); ws.on('audioprocess',()=>{ const now=ws.getCurrentTime(); timeText.textContent=now.toFixed(2)+' sn'; setCursorTime(now); karaokePlaybackUpdate(now); syncOverlayPosition(); }); ws.on('seek',p=>{ const now=(ws.getDuration()||0)*p; timeText.textContent=now.toFixed(2)+' sn'; setCursorTime(now); karaokePlaybackUpdate(now); syncOverlayPosition(); }); ws.on('pause',()=>{ const now=ws.getCurrentTime(); setCursorTime(now); karaokePlaybackUpdate(now); syncOverlayPosition(); }); ws.on('finish',()=>{ karaokePlaybackUpdate(ws.getDuration()); }); ws.on('zoom',()=>{ renderAll(); syncOverlayPosition(); }); }
    function bindWaveformDrag(){ const wrapper=getWaveWrapper(); if(!wrapper) return; wrapper.addEventListener('pointerdown',e=>{ if(e.target.closest('.handle') || e.target.closest('.strip-block')) return; wrapper._drag={startX:e.clientX,startScroll:wrapper.scrollLeft}; }); wrapper.addEventListener('pointermove',e=>{ if(!wrapper._drag) return; const dx=e.clientX-wrapper._drag.startX; wrapper.scrollLeft=wrapper._drag.startScroll-dx; syncOverlayPosition(); }); const end=()=> wrapper._drag=null; wrapper.addEventListener('pointerup',end); wrapper.addEventListener('pointercancel',end); wrapper.addEventListener('scroll',syncOverlayPosition,{passive:true}); }
    function bindWrapperEvents(){ if(wrapperBound) return; const wrapper=getWaveWrapper(); if(!wrapper) return; bindWaveformDrag(); wrapperBound=true; }

    initWave(); renderAll(); setCursorTime(0); loadLibrary(); loadProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); showSection('home'); toleranceSelect.value = String(CENT_TOLERANCE);

    homeLibraryBtn.addEventListener('click',()=> showSection('library'));
    homeEditorBtn.addEventListener('click',()=> showSection('editor'));
    homeLogoBtn.addEventListener('click',goHome);
    homeLogoBigBtn.addEventListener('click',goHome);
    libraryBackBtn.addEventListener('click',()=> showSection('home'));
    editorBackBtn.addEventListener('click',()=> showSection('home'));
    measureBackBtn.addEventListener('click',()=>{ stopMeasure(); showSection('library'); });
    audioFile.addEventListener('change',e=>{ const file=e.target.files[0]; if(!file) return; currentAudioName=file.name; if(objectUrlRef && objectUrlRef.startsWith('blob:')) URL.revokeObjectURL(objectUrlRef); objectUrlRef=URL.createObjectURL(file); ws.load(objectUrlRef); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    importJsonInput.addEventListener('change',e=>{ const file=e.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=()=> importProjectFromJsonText(reader.result); reader.readAsText(file,'utf-8'); importJsonInput.value=''; });
    playBtn.addEventListener('click',()=> hasAudioLoaded() && ws.playPause());
    stopBtn.addEventListener('click',()=> { if(hasAudioLoaded()){ ws.stop(); setCursorTime(0); } });
    zoom.addEventListener('input',()=> { if(!hasAudioLoaded()) return; ws.zoom(Number(zoom.value)); setTimeout(renderAll,20); });
    zoomOutBtn.addEventListener('click',()=> { zoom.value=Math.max(40, Number(zoom.value)-20); zoom.dispatchEvent(new Event('input')); });
    zoomInBtn.addEventListener('click',()=> { zoom.value=Math.min(360, Number(zoom.value)+20); zoom.dispatchEvent(new Event('input')); });
    splitWordsBtn.addEventListener('click',()=> { parseLyricsToSegmentsPreserve(); loadedIndex=-1; renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    autoTimingBtn.addEventListener('click',()=> { if(!heceler.length) parseLyricsToSegmentsPreserve(); const words=heceler.filter(h=>!h.isIntro); if(!words.length) return; const intro=getIntroValue(); const duration=hasAudioLoaded()?ws.getDuration():Math.max(intro+words.length*0.8,8); const available=Math.max(0.6,duration-intro); const totalChars=words.reduce((s,w)=>s+Math.max(1,(w.text||'').length),0); let cursor=intro; words.forEach(seg=>{ const weight=Math.max(1,(seg.text||'').length); const segDur=Math.max(0.10, Number(((weight/totalChars)*available).toFixed(2))); seg.start=round2(cursor); seg.end=round2(cursor+segDur); cursor=seg.end; }); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    saveProjectBtn.addEventListener('click',saveProject);
    resetTimingBtn.addEventListener('click',()=> { normalizeIntroSegment(); heceler.forEach(h=>{ if(h.isIntro){ h.start=0; h.end=getIntroValue(); } else { h.start=null; h.end=null; } }); loadedIndex=-1; selectedSegmentIndexes=[]; renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    saveBtn.addEventListener('click',()=> { const text=heceInput.value.trim(); const note=notaInput.value.trim(); const start=parseFloat(startInput.value); const end=parseFloat(endInput.value); const line=Number(satirInput.value||1); if(!text) return alert('Kelime / hece gir.'); if(!isNaN(start) && !isNaN(end) && end<=start) return alert('End, start’tan büyük olmalı.'); const obj={ text:text, note:note, start:isNaN(start)?null:round2(start), end:isNaN(end)?null:round2(end), line:line, isIntro:false }; if(loadedIndex>-1){ const wasIntro=!!heceler[loadedIndex]?.isIntro; heceler[loadedIndex]={...obj,isIntro:wasIntro}; loadedIndex=-1; } else { heceler.push(obj); } normalizeIntroSegment(); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    updateBtn.addEventListener('click',()=> { if(loadedIndex===-1) return alert('Önce bir segment seç.'); const seg=heceler[loadedIndex]; const start=parseFloat(startInput.value); const end=parseFloat(endInput.value); if(isNaN(start)||isNaN(end)||end<=start) return alert('Geçerli bir start/end gir.'); seg.text=heceInput.value.trim(); seg.note=notaInput.value.trim(); seg.start=round2(start); seg.end=round2(end); seg.line=Number(satirInput.value||seg.line||1); if(seg.isIntro){ seg.text='INTRO'; seg.start=0; introInput.value=seg.end.toFixed(2); } renderAll(); seekToSegment(loadedIndex,false); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    deleteLoadedBtn.addEventListener('click',()=> { if(loadedIndex===-1) return alert('Önce bir segment seç.'); if(heceler[loadedIndex]?.isIntro) return alert('Intro silinmez.'); const removed=loadedIndex; heceler.splice(removed,1); loadedIndex=-1; selectedSegmentIndexes=selectedSegmentIndexes.filter(i=>i!==removed).map(i=> i>removed ? i-1 : i); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    minusStartBtn.addEventListener('click',()=> { if(loadedIndex===-1) return; const seg=heceler[loadedIndex]; const v=Math.max(0, round2((seg.start??0)-0.05)); if(seg.end<=v+0.03) return; seg.start=v; startInput.value=v.toFixed(2); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    plusStartBtn.addEventListener('click',()=> { if(loadedIndex===-1) return; const seg=heceler[loadedIndex]; const v=round2((seg.start??0)+0.05); if(seg.end<=v+0.03) return; seg.start=v; startInput.value=v.toFixed(2); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    minusEndBtn.addEventListener('click',()=> { if(loadedIndex===-1) return; const seg=heceler[loadedIndex]; const v=round2((seg.end??0)-0.05); if(v<=seg.start+0.03) return; seg.end=v; endInput.value=v.toFixed(2); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    plusEndBtn.addEventListener('click',()=> { if(loadedIndex===-1) return; const seg=heceler[loadedIndex]; seg.end=round2((seg.end??0)+0.05); endInput.value=seg.end.toFixed(2); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    previewSelectedBtn.addEventListener('click',()=> { if(loadedIndex===-1) return alert('Önce bir segment seç.'); const seg=heceler[loadedIndex]; if(!seg||seg.start===null||seg.end===null||!hasAudioLoaded()) return; ws.play(seg.start,seg.end); });
    previewPlayBtn.addEventListener('click',()=> { if(!hasAudioLoaded()) return; sequenceStopRequested=true; ws.stop(); ws.play(0); });
    previewStopBtn.addEventListener('click',()=> { if(!hasAudioLoaded()) return; sequenceStopRequested=true; ws.pause(); });
    clearSelectionBtn.addEventListener('click',clearSelection);
    playLineBtn.addEventListener('click',playSelectedLine);
    measurePlayBtn.addEventListener('click',startMeasure);
    measureStopBtn.addEventListener('click',stopMeasure);
    measureResetBtn.addEventListener('click',resetMeasure);
    measurePlaySelectedBtn.addEventListener('click',playSelectedMeasureSegments); toleranceSelect.addEventListener('change',()=>{ CENT_TOLERANCE = Number(toleranceSelect.value)||15; });
    vocalyCetvelHandle.addEventListener('click', async () => { if(vocalyCetvelDrawer.classList.contains('open')){ stopLiveCetvelListening(); closeCetvel(); } else { await startLiveCetvelListening(); } });
    resultCloseBtn.addEventListener('click',()=> resultModal.classList.add('hidden'));
    document.addEventListener('keydown',e=>{ const tag=document.activeElement ? document.activeElement.tagName.toLowerCase() : ''; const inInput=tag==='input'||tag==='textarea'||tag==='select'; if(inInput) return; if(e.code==='Space'){ e.preventDefault(); if(hasAudioLoaded()) ws.playPause(); return; } if(e.code==='Escape'){ loadedIndex=-1; selectedSegmentIndexes=[]; renderAll(); updateActiveSegmentLabel(-1); return; } if(e.code==='ArrowRight'){ e.preventDefault(); if(hasAudioLoaded()) seekToTime(ws.getCurrentTime()+0.2); return; } if(e.code==='ArrowLeft'){ e.preventDefault(); if(hasAudioLoaded()) seekToTime(ws.getCurrentTime()-0.2); return; } });
    window.addEventListener('resize',()=> setTimeout(renderAll,50));
  </script>
</body>
</html>
