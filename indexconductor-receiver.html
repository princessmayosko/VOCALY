<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocaly Camera Mouse Receiver</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial}
#top{position:fixed;left:18px;top:15px;z-index:5;background:#111;border:1px solid #333;border-radius:10px;padding:10px 14px}
.code{font:20px monospace;margin-top:5px}.muted{color:#999}
#hand{position:absolute;width:260px;transform:translate(-50%,-50%);pointer-events:none;transition:none}
</style></head>
<body>
<div id="top"><div id="status">● Telefon bekleniyor</div><div class="muted">Bağlantı kodu:</div><div class="code" id="code">oluşturuluyor…</div></div>
<img id="hand" src="hand_baton.png">
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
const peer=new Peer();let x=innerWidth/2,y=innerHeight/2;const hand=document.getElementById("hand");
function draw(){hand.style.left=x+"px";hand.style.top=y+"px"}
peer.on("open",id=>document.getElementById("code").textContent=id);
peer.on("connection",c=>{
 document.getElementById("status").textContent="● TELEFON BAĞLANDI";
 c.on("data",d=>{
  if(!d||d.type!=="camera-mouse")return;
  x=Math.max(130,Math.min(innerWidth-130,x+(Number(d.dx)||0)));
  y=Math.max(130,Math.min(innerHeight-130,y+(Number(d.dy)||0)));
  draw();
 });
 c.on("close",()=>document.getElementById("status").textContent="● TELEFON BAĞLANTISI KOPTU");
});
draw();
</script></body></html>
