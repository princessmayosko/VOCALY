<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vocaly Karaoke Ölçme</title>
<style>
:root{
  --green:#1f8a70;
  --green-soft:rgba(31,138,112,0.14);
  --green-dark:#145c4a;
  --purple:#6d28d9;
  --purple-soft:rgba(109,40,217,0.14);
  --purple-dark:#4c1d95;
  --red:#dc2626;
  --text:#111827;
  --muted:#6b7280;
  --border:#d1d5db;
  --shadow:0 14px 36px rgba(0,0,0,0.10);
  --card:#ffffffee;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  color:var(--text);
  padding:24px;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(109,40,217,0.18) 0, rgba(109,40,217,0.08) 18%, transparent 38%),
    radial-gradient(circle at bottom right, rgba(31,138,112,0.20) 0, rgba(31,138,112,0.08) 20%, transparent 40%),
    linear-gradient(135deg, #f8fafc 0%, #f5f3ff 32%, #ecfeff 68%, #f8fafc 100%);
  position:relative;
  overflow-x:hidden;
}
body::before,
body::after{
  content:"";
  position:fixed;
  pointer-events:none;
  inset:auto;
  border-radius:32px;
  border:2px solid rgba(109,40,217,0.10);
  width:320px;
  height:320px;
  z-index:0;
  transform:rotate(12deg);
}
body::before{
  top:34px;
  right:-90px;
  background:linear-gradient(135deg, rgba(109,40,217,0.06), rgba(31,138,112,0.04));
}
body::after{
  left:-100px;
  bottom:36px;
  width:360px;
  height:360px;
  border-color:rgba(31,138,112,0.12);
  transform:rotate(-10deg);
  background:linear-gradient(135deg, rgba(31,138,112,0.05), rgba(109,40,217,0.03));
}
.wrap{
  max-width:980px;
  margin:0 auto;
  position:relative;
  z-index:1;
}
.card{
  background:var(--card);
  border:1px solid rgba(255,255,255,0.9);
  box-shadow:var(--shadow);
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
  backdrop-filter:blur(8px);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(120deg, rgba(109,40,217,0.06), transparent 30%),
    linear-gradient(300deg, rgba(31,138,112,0.06), transparent 32%);
  pointer-events:none;
}
h1{
  margin:0 0 14px;
  font-size:28px;
  text-align:center;
  color:#1f2937;
  position:relative;
  z-index:1;
}
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  margin-bottom:14px;
  position:relative;
  z-index:1;
}
button{
  border:none;
  background:linear-gradient(135deg, var(--green), var(--green-dark));
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
  font-weight:700;
  box-shadow:0 8px 18px rgba(31,138,112,0.18);
}
button.stop{
  background:linear-gradient(135deg, #dc2626, #991b1b);
  box-shadow:0 8px 18px rgba(220,38,38,0.18);
}
button.reset{
  background:linear-gradient(135deg, var(--purple), var(--purple-dark));
  box-shadow:0 8px 18px rgba(109,40,217,0.18);
}
audio{
  width:100%;
  max-width:560px;
  display:block;
  margin:10px auto 0;
  position:relative;
  z-index:1;
}
.status{
  text-align:center;
  font-size:14px;
  color:var(--muted);
  font-weight:700;
  margin-top:10px;
  position:relative;
  z-index:1;
}
.layout{
  display:grid;
  grid-template-columns:160px 1fr;
  gap:16px;
  align-items:start;
  position:relative;
  z-index:1;
}
.intro{
  position:relative;
  padding:12px 14px;
  border-radius:16px;
  background:#fff;
  border:2px solid var(--green);
  font-weight:800;
  min-height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(31,138,112,0.08);
}
.introFill{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:0%;
  background:linear-gradient(90deg, var(--purple), var(--green));
  opacity:.20;
}
.introText{position:relative;z-index:2}
.lyrics{display:flex;flex-direction:column;gap:10px}
.line{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
.hece{
  padding:10px 14px;
  border-radius:12px;
  background:#fff;
  border:1px solid #ddd;
  font-weight:bold;
  transition:background .12s linear,border-color .12s linear,transform .12s linear,box-shadow .12s linear;
  box-shadow:0 4px 10px rgba(0,0,0,0.03);
}
.hece.active{
  background:#ede9fe;
  border-color:var(--purple);
  transform:translateY(-1px);
  box-shadow:0 8px 18px rgba(109,40,217,0.12);
}
.hece.correct{
  background:#dff7ef;
  border-color:var(--green);
}
.hece.wrong{
  background:#fee2e2;
  border-color:#dc2626;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:14px;
  position:relative;
  z-index:1;
}
.box{
  border:1px solid rgba(17,24,39,0.07);
  border-radius:16px;
  padding:12px;
  background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(248,250,252,0.95));
}
.label{
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}
.value{
  font-size:24px;
  font-weight:800;
}
#tunerScaleTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:#6b7280;
  margin-bottom:6px;
  position:relative;
  z-index:1;
}
#tunerScaleTop .mid{
  color:#374151;
  font-weight:700;
}
#tunerRuler{
  position:relative;
  height:52px;
  border-radius:16px;
  background:linear-gradient(180deg,#fff 0%, #f3f4f6 100%);
  overflow:hidden;
  border:1px solid var(--border);
  z-index:1;
}
#targetZone{
  position:absolute;
  left:50%;
  top:10px;
  width:64px;
  height:30px;
  transform:translateX(-50%);
  border-radius:10px;
  background:linear-gradient(90deg, rgba(109,40,217,0.12), rgba(31,138,112,0.16));
  border:1px solid rgba(31,138,112,0.22);
  z-index:1;
}
#centerMark{
  position:absolute;
  left:50%;
  top:6px;
  transform:translateX(-50%);
  width:2px;
  height:38px;
  background:var(--green);
  border-radius:999px;
  z-index:2;
}
#tickLayer{position:absolute;inset:0;z-index:1}
.tuner-tick{
  position:absolute;
  bottom:8px;
  width:2px;
  background:#9ca3af;
  border-radius:999px;
  transform:translateX(-50%);
  opacity:.75;
}
.tuner-tick.major{height:18px}
.tuner-tick.minor{height:10px}
#pitchDot{
  position:absolute;
  left:50%;
  top:50%;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#94a3b8;
  transform:translate(-50%,-50%);
  z-index:4;
  transition:left .08s linear, background .08s linear, box-shadow .08s linear;
}
#pitchDot.correct{
  background:var(--green);
  box-shadow:0 0 0 6px rgba(31,138,112,0.16), 0 0 12px rgba(31,138,112,0.35);
}
#pitchDot.wrong{background:var(--red)}
#pitchDot.waiting{background:#94a3b8}
#tunerInfo{
  min-height:20px;
  margin-top:10px;
  font-size:13px;
  color:#4b5563;
  position:relative;
  z-index:1;
}
.result{
  margin-top:18px;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  position:relative;
  z-index:1;
}
.small{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:10px;
  position:relative;
  z-index:1;
}
#feedbackText{
  font-size:15px;
  font-weight:700;
  color:#374151;
}
.select-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  border:1px solid rgba(17,24,39,0.08);
  border-radius:12px;
  padding:8px 10px;
}
.select-wrap label{
  font-size:13px;
  font-weight:700;
  color:#374151;
}
.select-wrap select{
  border:none;
  background:transparent;
  font-size:13px;
  font-weight:700;
  color:#111827;
  outline:none;
}
.tuner-options{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
  position:relative;
  z-index:1;
}

/* SONUÇ PENCERESİ */
.result-overlay{
  position:fixed;
  inset:0;
  background:rgba(17,24,39,0.34);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
  backdrop-filter:blur(4px);
}
.result-overlay.hidden{
  display:none;
}
.result-modal{
  width:min(92vw, 430px);
  background:linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,250,252,0.98));
  border:1px solid rgba(255,255,255,0.95);
  box-shadow:0 20px 50px rgba(0,0,0,0.18);
  border-radius:24px;
  padding:22px 18px 18px;
  text-align:center;
  transform:translateY(-40px) scale(0.96);
  opacity:0;
  animation:resultDropIn .45s ease forwards;
}
@keyframes resultDropIn{
  0%{
    opacity:0;
    transform:translateY(-55px) scale(0.94);
  }
  60%{
    opacity:1;
    transform:translateY(6px) scale(1.01);
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
.result-badge{
  font-size:52px;
  line-height:1;
  margin-bottom:10px;
}
.result-title{
  font-size:28px;
  font-weight:800;
  color:#111827;
  margin-bottom:8px;
}
.result-message{
  font-size:16px;
  font-weight:700;
  color:#374151;
  margin-bottom:10px;
  line-height:1.45;
}
.result-score{
  font-size:18px;
  font-weight:800;
  color:#1f2937;
  margin-bottom:16px;
}
.result-close{
  border:none;
  background:linear-gradient(135deg, #6d28d9, #1f8a70);
  color:#fff;
  padding:11px 18px;
  border-radius:14px;
  cursor:pointer;
  font-size:14px;
  font-weight:800;
  box-shadow:0 8px 18px rgba(0,0,0,0.14);
}

@media (max-width:720px){
  .layout{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .controls{align-items:stretch}
  .select-wrap{width:100%;justify-content:space-between}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Vocaly Karaoke Ölçme</h1>
    <div class="controls">
      <button onclick="startKaraoke()">Başlat</button>
      <button class="stop" onclick="stopKaraoke()">Durdur</button>
      <button class="reset" onclick="resetKaraoke()">Sıfırla</button>

      <div class="select-wrap">
        <label for="speedSelect">Hız</label>
        <select id="speedSelect">
          <option value="1" selected>1x</option>
          <option value="0.75">0.75x</option>
          <option value="0.5">0.50x</option>
          <option value="0.25">0.25x</option>
        </select>
      </div>
    </div>

    <audio id="song">
      <source src="sozsuz.mp3" type="audio/mpeg">
    </audio>
    <div class="status" id="statusText">Hazır</div>
  </div>

  <div class="card">
    <div class="layout">
      <div class="intro">
        <div id="introFill" class="introFill"></div>
        <div class="introText">Intro</div>
      </div>
      <div class="lyrics">
        <div id="line1" class="line"></div>
        <div id="line2" class="line"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="box">
        <div class="label">Aktif Hedef</div>
        <div class="value" id="activeHece">-</div>
      </div>
      <div class="box">
        <div class="label">Hedef Nota</div>
        <div class="value" id="targetNote">-</div>
      </div>
    </div>

    <div class="tuner-options">
      <div class="select-wrap">
        <label for="toleranceSelect">Tolerans</label>
        <select id="toleranceSelect">
          <option value="20">±20 cent</option>
          <option value="25">±25 cent</option>
          <option value="30" selected>±30 cent</option>
          <option value="35">±35 cent</option>
        </select>
      </div>
    </div>

    <div id="tunerScaleTop">
      <span>PES</span>
      <span class="mid">+</span>
      <span>TİZ</span>
    </div>

    <div id="tunerRuler">
      <div id="targetZone"></div>
      <div id="centerMark"></div>
      <div id="tickLayer"></div>
      <div id="pitchDot" class="waiting"></div>
    </div>

    <div id="tunerInfo">Tuner kapalı.</div>
    <div class="result" id="resultText">Toplam Puan: 0</div>
    <div id="feedbackText" class="small"></div>
    <div class="small">Öbekler: sön-mez / şa-fak / sön-me-den / yur-du / üs-tün / tü-ten-en / son-o-cak</div>
  </div>
</div>

<div id="resultOverlay" class="result-overlay hidden">
  <div id="resultModal" class="result-modal">
    <div id="resultBadge" class="result-badge">🌟</div>
    <div id="resultTitle" class="result-title">Harika!</div>
    <div id="resultMessage" class="result-message">Tonu çok iyi yakaladın.</div>
    <div id="resultScore" class="result-score">Toplam Puan: 0</div>
    <button class="result-close" onclick="closeResultOverlay()">Tamam</button>
  </div>
</div>

<script>
const INTRO_DURATION = 4.20;
const SONG_END_TIME = 18.97;

/* AFFEDİCİ PENCERELER */
const SINGLE_EARLY_GRACE = 0.45;
const SINGLE_LATE_GRACE  = 1.80;

const PHRASE_EARLY_GRACE = 1.00;
const PHRASE_LATE_GRACE  = 2.10;

const SINGLE_MIN_GOOD_FRAMES = 1;
const PHRASE_MIN_GOOD_FRAMES = 1;

const MIN_DETECTABLE_FREQ = 60;
const MAX_DETECTABLE_FREQ = 1200;

const NOTE_ALIASES = {
  "do":0,"do#":1,"reb":1,"re":2,"re#":3,"mib":3,"mi":4,"fa":5,
  "fa#":6,"solb":6,"sol":7,"sol#":8,"lab":8,"la":9,"la#":10,"sib":10,"si":11
};

const PC_TO_TR = {
  0:"Do",1:"Do#/Reb",2:"Re",3:"Re#/Mib",4:"Mi",5:"Fa",
  6:"Fa#/Solb",7:"Sol",8:"Sol#/Lab",9:"La",10:"La#/Sib",11:"Si"
};

const heceler = [
  { text:"Kork", note:"si", start:4.21, end:4.61, line:1 },
  { text:"ma", note:"mi", start:4.68, end:5.23, line:1 },
  { text:"sön", note:"fa", start:5.30, end:5.82, line:1 },
  { text:"mez", note:"sol", start:5.84, end:6.45, line:1 },
  { text:"bu", note:"re#", start:6.43, end:6.91, line:1 },
  { text:"şa", note:"fa", start:6.96, end:7.10, line:1 },
  { text:"fak", note:"mi", start:7.11, end:8.75, line:1 },
  { text:"lar", note:"mi", start:8.74, end:9.30, line:1 },
  { text:"da", note:"la", start:9.30, end:9.95, line:1 },
  { text:"yü", note:"si", start:9.95, end:10.51, line:1 },
  { text:"zen", note:"do", start:10.51, end:11.10, line:1 },
  { text:"al", note:"sol#", start:11.10, end:11.60, line:1 },
  { text:"san", note:"si", start:11.50, end:11.72, line:1 },
  { text:"cak", note:"la", start:11.71, end:13.47, line:1 },

  { text:"Sön", note:"si", start:13.47, end:13.68, line:2 },
  { text:"me", note:"la#", start:13.67, end:13.84, line:2 },
  { text:"den", note:"si", start:13.84, end:14.04, line:2 },
  { text:"yur", note:"fa", start:14.03, end:14.68, line:2 },
  { text:"du", note:"fa", start:14.68, end:15.68, line:2 },
  { text:"mun", note:"la", start:15.62, end:15.82, line:2 },
  { text:"üs", note:"sol#", start:15.84, end:16.29, line:2 },
  { text:"tün", note:"re", start:16.30, end:16.41, line:2 },
  { text:"de", note:"mi", start:16.43, end:16.86, line:2 },
  { text:"tü", note:"fa", start:16.78, end:17.02, line:2 },
  { text:"ten", note:"sol", start:17.03, end:17.49, line:2 },
  { text:"en", note:"fa", start:17.49, end:17.69, line:2 },
  { text:"son", note:"mi", start:17.64, end:18.03, line:2 },
  { text:"o", note:"re", start:18.03, end:18.25, line:2 },
  { text:"cak", note:"si", start:18.25, end:18.67, line:2 }
];

const PHRASE_GROUPS = [
  { members:[2,3] },
  { members:[5,6] },
  { members:[14,15,16] },
  { members:[17,18] },
  { members:[20,21] },
  { members:[23,24,25] },
  { members:[26,27,28] }
];

let micStream = null;
let micContext = null;
let analyser = null;
let micSource = null;
let tunerAnimation = null;
let tunerRunning = false;

let started = false;
let score = 0;
let toleranceCent = 30;
let currentUnitIndex = -1;
let currentDetectedFreq = null;
let detectedHistory = [];
let updateRaf = null;

const units = [];
const heceToUnitIndex = {};

const audio = document.getElementById("song");
const introFill = document.getElementById("introFill");
const line1 = document.getElementById("line1");
const line2 = document.getElementById("line2");
const statusText = document.getElementById("statusText");
const activeHece = document.getElementById("activeHece");
const targetNoteEl = document.getElementById("targetNote");
const resultText = document.getElementById("resultText");
const feedbackText = document.getElementById("feedbackText");
const tunerInfo = document.getElementById("tunerInfo");
const pitchDotEl = document.getElementById("pitchDot");
const tickLayer = document.getElementById("tickLayer");
const speedSelect = document.getElementById("speedSelect");
const toleranceSelect = document.getElementById("toleranceSelect");

function normalizePc(pc){
  return ((pc % 12) + 12) % 12;
}

function noteNameToPitchClass(name){
  return NOTE_ALIASES[String(name).toLowerCase().trim()];
}

function pitchClassToDisplay(pc){
  return PC_TO_TR[normalizePc(pc)];
}

function setPitchDotState(mode){
  pitchDotEl.classList.remove("correct","wrong","waiting");
  pitchDotEl.classList.add(mode);
}

function createTicks(){
  tickLayer.innerHTML = "";
  const tickPercents = [10,20,30,40,50,60,70,80,90];
  tickPercents.forEach((left, idx) => {
    const tick = document.createElement("div");
    tick.className = "tuner-tick " + (idx % 2 === 0 ? "major" : "minor");
    tick.style.left = left + "%";
    tickLayer.appendChild(tick);
  });
}

function updatePitchDotByCents(cents){
  if (cents === null || Number.isNaN(cents)) {
    pitchDotEl.style.left = "50%";
    setPitchDotState("waiting");
    return;
  }

  const clamped = Math.max(-50, Math.min(50, cents));
  const percent = 50 + (clamped / 50) * 40;
  pitchDotEl.style.left = `${percent}%`;

  if (Math.abs(cents) <= toleranceCent) setPitchDotState("correct");
  else setPitchDotState("wrong");
}

function freqToMidi(freq){
  return 69 + 12 * Math.log2(freq / 440);
}

function centsAgainstTarget(freq, targetName){
  const midi = freqToMidi(freq);
  const pc = noteNameToPitchClass(targetName);
  if (pc === undefined) return null;
  const nearestMidi = pc + 12 * Math.round((midi - pc) / 12);
  return (midi - nearestMidi) * 100;
}

function bestMatchAgainstTargets(freq, targets){
  let best = null;
  for (const target of targets) {
    const cents = centsAgainstTarget(freq, target);
    if (cents === null) continue;
    if (!best || Math.abs(cents) < Math.abs(best.cents)) {
      best = { target, cents };
    }
  }
  return best;
}

function getMedian(arr){
  if (!arr.length) return null;
  const s = [...arr].sort((a,b)=>a-b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

function smoothDetectedFreq(freq){
  if (!freq) return null;
  detectedHistory.push(freq);
  if (detectedHistory.length > 2) detectedHistory.shift();
  return getMedian(detectedHistory);
}

function autoCorrelate(buffer, sampleRate){
  let SIZE = buffer.length;
  let rms = 0;

  for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.006) return -1;

  let r1 = 0, r2 = SIZE - 1;
  const threshold = 0.2;

  for (let i = 0; i < SIZE / 2; i++) {
    if (Math.abs(buffer[i]) < threshold) { r1 = i; break; }
  }
  for (let i = 1; i < SIZE / 2; i++) {
    if (Math.abs(buffer[SIZE - i]) < threshold) { r2 = SIZE - i; break; }
  }

  buffer = buffer.slice(r1, r2);
  SIZE = buffer.length;

  const c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++) {
    for (let j = 0; j < SIZE - i; j++) c[i] += buffer[j] * buffer[j + i];
  }

  let d = 0;
  while (d + 1 < c.length && c[d] > c[d + 1]) d++;

  let maxval = -1, maxpos = -1;
  for (let i = d; i < SIZE; i++) {
    if (c[i] > maxval) {
      maxval = c[i];
      maxpos = i;
    }
  }

  if (maxpos <= 0) return -1;

  let T0 = maxpos;
  const x1 = c[T0 - 1] || 0;
  const x2 = c[T0] || 0;
  const x3 = c[T0 + 1] || 0;
  const a = (x1 + x3 - 2 * x2) / 2;
  const b = (x3 - x1) / 2;
  if (a) T0 = T0 - b / (2 * a);

  return sampleRate / T0;
}

function buildUnits(){
  units.length = 0;
  for (const k in heceToUnitIndex) delete heceToUnitIndex[k];

  const phraseAllIndexSet = new Set(PHRASE_GROUPS.flatMap(g => g.members));

  PHRASE_GROUPS.forEach((group, idx) => {
    const firstIndex = group.members[0];
    const firstHece = heceler[firstIndex];
    const lastIndex = group.members[group.members.length - 1];
    const lastHece = heceler[lastIndex];

    const unit = {
      type: "phrase",
      id: "phrase_" + idx,
      members: group.members,
      label: group.members.map(i => heceler[i].text).join("-"),
      targetNotes: [...new Set(group.members.map(i => heceler[i].note))],
      listenStart: firstHece.start - PHRASE_EARLY_GRACE,
      listenEnd: lastHece.end + PHRASE_LATE_GRACE,
      activeStart: firstHece.start - PHRASE_EARLY_GRACE,
      activeEnd: lastHece.end + PHRASE_LATE_GRACE,
      minGoodFrames: PHRASE_MIN_GOOD_FRAMES,
      goodFrames: 0,
      evaluated: false,
      passed: false,
      scored: false,
      scoreValue: group.members.length * 10
    };

    const unitIndex = units.push(unit) - 1;
    group.members.forEach(i => { heceToUnitIndex[i] = unitIndex; });
  });

  heceler.forEach((h, i) => {
    if (phraseAllIndexSet.has(i)) return;

    const next = heceler[i + 1];
    let listenEnd = h.end + SINGLE_LATE_GRACE;
    if (next) listenEnd = Math.min(listenEnd, next.start + 0.60);

    const unit = {
      type: "single",
      id: "single_" + i,
      members: [i],
      label: h.text,
      targetNotes: [h.note],
      listenStart: h.start - SINGLE_EARLY_GRACE,
      listenEnd,
      activeStart: h.start - SINGLE_EARLY_GRACE,
      activeEnd: listenEnd,
      minGoodFrames: SINGLE_MIN_GOOD_FRAMES,
      goodFrames: 0,
      evaluated: false,
      passed: false,
      scored: false,
      scoreValue: 10
    };

    const unitIndex = units.push(unit) - 1;
    heceToUnitIndex[i] = unitIndex;
  });

  units.sort((a, b) => a.listenStart - b.listenStart);
}

function renderLyrics(){
  line1.innerHTML = "";
  line2.innerHTML = "";

  heceler.forEach((h, i) => {
    const div = document.createElement("div");
    div.className = "hece";
    div.id = "hece" + i;
    div.textContent = h.text;
    if (h.line === 1) line1.appendChild(div);
    else line2.appendChild(div);
  });
}

function clearActiveClasses(){
  document.querySelectorAll(".hece").forEach(el => el.classList.remove("active"));
}

function activateUnit(unit){
  clearActiveClasses();

  if (!unit) {
    activeHece.textContent = "-";
    targetNoteEl.textContent = "-";
    return;
  }

  unit.members.forEach(i => {
    const el = document.getElementById("hece" + i);
    if (!el) return;
    if (!el.classList.contains("correct") && !el.classList.contains("wrong")) {
      el.classList.add("active");
    }
  });

  activeHece.textContent = unit.label;
  targetNoteEl.textContent = unit.targetNotes
    .map(n => pitchClassToDisplay(noteNameToPitchClass(n)))
    .join(" / ");
}

function markUnit(unit, passed){
  unit.members.forEach(i => {
    const el = document.getElementById("hece" + i);
    if (!el) return;
    el.classList.remove("active","correct","wrong");
    el.classList.add(passed ? "correct" : "wrong");
  });
}

function refreshScore(){
  resultText.textContent = "Toplam Puan: " + score;
}

function addScoreOnce(unit){
  if (unit.scored) return;
  score += unit.scoreValue;
  unit.scored = true;
  refreshScore();
}

function getFeedback(score){
  if(score >= 260){
    return {
      badge:"🏆",
      title:"Mükemmel!",
      message:"Tonu çok iyi yakaladın. Harika bir performans oldu."
    };
  }
  if(score >= 200){
    return {
      badge:"🌟",
      title:"Çok iyi!",
      message:"Birkaç küçük sapma dışında oldukça başarılı söyledin."
    };
  }
  if(score >= 140){
    return {
      badge:"👏",
      title:"Güzel iş!",
      message:"Gayet iyi gidiyorsun. Bir tekrar daha yaparsan daha da oturur."
    };
  }
  if(score >= 80){
    return {
      badge:"🙂",
      title:"İyi başlangıç!",
      message:"Temel oturuyor. Bir kez daha denersen çok daha iyi olacak."
    };
  }
  return {
    badge:"🎵",
    title:"Devam et!",
    message:"Bu bir ısınma turu gibi. Tekrar denediğinde daha iyi olacak."
  };
}

function showResultOverlay(){
  const data = getFeedback(score);

  document.getElementById("resultBadge").textContent = data.badge;
  document.getElementById("resultTitle").textContent = data.title;
  document.getElementById("resultMessage").textContent = data.message;
  document.getElementById("resultScore").textContent = "Toplam Puan: " + score;

  const overlay = document.getElementById("resultOverlay");
  const modal = document.getElementById("resultModal");

  overlay.classList.remove("hidden");

  if(modal){
    modal.style.animation = "none";
    void modal.offsetWidth;
    modal.style.animation = "resultDropIn .45s ease forwards";
  }
}

function closeResultOverlay(){
  const overlay = document.getElementById("resultOverlay");
  if(overlay) overlay.classList.add("hidden");
}

function updateTunerDisplay(freq, unit){
  if (freq === null || !unit) {
    updatePitchDotByCents(null);
    tunerInfo.textContent = tunerRunning ? "Ses bekleniyor..." : "Tuner kapalı.";
    return;
  }

  const best = bestMatchAgainstTargets(freq, unit.targetNotes);
  if (!best) {
    updatePitchDotByCents(null);
    tunerInfo.textContent = "Hedef nota yok.";
    return;
  }

  const detectedPitchClass = normalizePc(Math.round(freqToMidi(freq)));
  const cents = best.cents;
  const centsText = cents >= 0 ? `+${cents.toFixed(1)}` : cents.toFixed(1);
  const isOk = Math.abs(cents) <= toleranceCent;

  updatePitchDotByCents(cents);

  if (isOk) {
    tunerInfo.textContent =
      `Duyulan: ${pitchClassToDisplay(detectedPitchClass)} | Hedefler: ${unit.targetNotes.map(n => pitchClassToDisplay(noteNameToPitchClass(n))).join(" / ")} | Doğru`;
  } else {
    tunerInfo.textContent =
      `Duyulan: ${pitchClassToDisplay(detectedPitchClass)} | Hedefler: ${unit.targetNotes.map(n => pitchClassToDisplay(noteNameToPitchClass(n))).join(" / ")} | Sapma: ${centsText} cent`;
  }
}

function tunerLoop(){
  if (!tunerRunning || !analyser) return;

  const buffer = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buffer);
  const rawFreq = autoCorrelate(buffer, micContext.sampleRate);

  if (rawFreq !== -1 && rawFreq > MIN_DETECTABLE_FREQ && rawFreq < MAX_DETECTABLE_FREQ) {
    currentDetectedFreq = smoothDetectedFreq(rawFreq);
  } else {
    currentDetectedFreq = null;
    detectedHistory = [];
  }

  const unit = currentUnitIndex >= 0 ? units[currentUnitIndex] : null;
  updateTunerDisplay(currentDetectedFreq, unit);

  tunerAnimation = requestAnimationFrame(tunerLoop);
}

async function tunerAc(){
  if (tunerRunning) return true;

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    micContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = micContext.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0.35;

    micSource = micContext.createMediaStreamSource(micStream);
    micSource.connect(analyser);

    tunerRunning = true;
    tunerInfo.textContent = "Ses bekleniyor...";
    tunerLoop();
    return true;
  } catch (err) {
    console.error(err);
    tunerInfo.textContent = "Mikrofon açılamadı.";
    return false;
  }
}

function resetUnitsState(){
  units.forEach(unit => {
    unit.goodFrames = 0;
    unit.evaluated = false;
    unit.passed = false;
    unit.scored = false;
  });
}

function getActiveCandidates(t){
  return units
    .map((u, i) => ({ unit:u, index:i }))
    .filter(({unit}) => !unit.evaluated && t >= unit.activeStart && t <= unit.activeEnd);
}

function chooseDisplayUnitIndex(t){
  const active = getActiveCandidates(t);
  if (!active.length) {
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      if (!u.evaluated && t <= u.activeEnd) return i;
    }
    return -1;
  }

  active.sort((a, b) => {
    const da = Math.abs(t - ((a.unit.activeStart + a.unit.activeEnd) / 2));
    const db = Math.abs(t - ((b.unit.activeStart + b.unit.activeEnd) / 2));
    if (da !== db) return da - db;
    return a.unit.activeStart - b.unit.activeStart;
  });

  return active[0].index;
}

function processPitchForAllRelevantUnits(freq, t){
  if (!freq) return;

  for (const unit of units) {
    if (unit.evaluated) continue;
    if (t < unit.listenStart || t > unit.listenEnd) continue;

    const best = bestMatchAgainstTargets(freq, unit.targetNotes);
    if (!best) continue;

    if (Math.abs(best.cents) <= toleranceCent) {
      unit.goodFrames += 1;

      if (unit.type === "phrase" && unit.goodFrames >= unit.minGoodFrames) {
        unit.passed = true;
        unit.evaluated = true;
        markUnit(unit, true);
        addScoreOnce(unit);
      }

      if (unit.type === "single" && unit.goodFrames >= unit.minGoodFrames) {
        unit.passed = true;
      }
    }
  }
}

function evaluateExpiredUnits(t){
  units.forEach(unit => {
    if (unit.evaluated) return;

    if (t > unit.listenEnd) {
      unit.evaluated = true;

      if (unit.passed) {
        markUnit(unit, true);
        addScoreOnce(unit);
      } else {
        markUnit(unit, false);
      }
    }
  });
}

function updateIntro(t){
  if (t < INTRO_DURATION) introFill.style.width = ((t / INTRO_DURATION) * 100) + "%";
  else introFill.style.width = "100%";
}

function finalizeRemainingUnits(){
  units.forEach(unit => {
    if (!unit.evaluated) {
      unit.evaluated = true;
      if (unit.passed) {
        markUnit(unit, true);
        addScoreOnce(unit);
      } else {
        markUnit(unit, false);
      }
    }
  });
  refreshScore();

  if (feedbackText) {
    const data = getFeedback(score);
    feedbackText.textContent = `${data.badge} ${data.message}`;
  }
}

function updateEngine(){
  if (!started) return;

  const t = audio.currentTime;

  if (t >= SONG_END_TIME) {
    audio.pause();
    audio.currentTime = SONG_END_TIME;
    finalizeRemainingUnits();
    statusText.textContent = "Tamamlandı";
    clearActiveClasses();
    currentUnitIndex = -1;
    started = false;
    showResultOverlay();
    return;
  }

  updateIntro(t);
  processPitchForAllRelevantUnits(currentDetectedFreq, t);
  evaluateExpiredUnits(t);

  currentUnitIndex = chooseDisplayUnitIndex(t);

  if (currentUnitIndex >= 0) {
    const unit = units[currentUnitIndex];
    if (!unit.evaluated) activateUnit(unit);
    else activateUnit(null);
  } else {
    clearActiveClasses();
    activeHece.textContent = "-";
    targetNoteEl.textContent = "-";
  }

  if (!audio.paused && !audio.ended && started) {
    updateRaf = requestAnimationFrame(updateEngine);
  } else if (audio.ended) {
    finalizeRemainingUnits();
    statusText.textContent = "Tamamlandı";
    clearActiveClasses();
    currentUnitIndex = -1;
    started = false;
    showResultOverlay();
  }
}

async function startKaraoke(){
  const ok = await tunerAc();
  if (!ok) {
    statusText.textContent = "Mikrofon açılmadı";
    return;
  }

  if (updateRaf) cancelAnimationFrame(updateRaf);

  score = 0;
  closeResultOverlay();
  refreshScore();
  feedbackText.textContent = "";
  currentUnitIndex = -1;
  currentDetectedFreq = null;
  detectedHistory = [];
  resetUnitsState();

  document.querySelectorAll(".hece").forEach(el => {
    el.classList.remove("active","correct","wrong");
  });

  introFill.style.width = "0%";
  activeHece.textContent = "-";
  targetNoteEl.textContent = "-";
  audio.currentTime = 0;
  audio.playbackRate = Number(speedSelect.value);

  started = true;
  statusText.textContent = `Çalıyor (${audio.playbackRate.toFixed(2)}x)`;

  try {
    await audio.play();
  } catch(e) {
    statusText.textContent = "Müzik başlatılamadı";
    started = false;
    return;
  }

  updateRaf = requestAnimationFrame(updateEngine);
}

function stopKaraoke(){
  started = false;
  audio.pause();
  if (updateRaf) cancelAnimationFrame(updateRaf);
  statusText.textContent = "Durduruldu";
}

function resetKaraoke(){
  stopKaraoke();
  closeResultOverlay();
  audio.currentTime = 0;
  audio.playbackRate = Number(speedSelect.value);

  score = 0;
  refreshScore();
  feedbackText.textContent = "";
  currentUnitIndex = -1;
  currentDetectedFreq = null;
  detectedHistory = [];
  resetUnitsState();

  introFill.style.width = "0%";
  activeHece.textContent = "-";
  targetNoteEl.textContent = "-";
  document.querySelectorAll(".hece").forEach(el => {
    el.classList.remove("active","correct","wrong");
  });

  updatePitchDotByCents(null);
  tunerInfo.textContent = tunerRunning ? "Ses bekleniyor..." : "Tuner kapalı.";
  statusText.textContent = "Hazır";
}

speedSelect.addEventListener("change", () => {
  audio.playbackRate = Number(speedSelect.value);
  if (started) statusText.textContent = `Çalıyor (${audio.playbackRate.toFixed(2)}x)`;
});

toleranceSelect.addEventListener("change", () => {
  toleranceCent = Number(toleranceSelect.value);
});

buildUnits();
createTicks();
renderLyrics();
audio.playbackRate = Number(speedSelect.value);
toleranceCent = Number(toleranceSelect.value);
</script>
