<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vocaly Karaoke + Tuner</title>
<style>
:root{
  --green:#16a34a;
  --green-soft:rgba(22,163,74,0.12);
  --red:#dc2626;
  --text:#111827;
  --muted:#6b7280;
  --border:#d1d5db;
  --shadow:0 10px 28px rgba(0,0,0,0.08);
  --blue:#2563eb;
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-right:env(safe-area-inset-right, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  --safe-left:env(safe-area-inset-left, 0px);
}
*{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#f8fafc 0%, #f3f4f6 100%);
  color:var(--text);
  padding:calc(20px + var(--safe-top)) calc(14px + var(--safe-right)) calc(24px + var(--safe-bottom)) calc(14px + var(--safe-left));
  min-height:100svh;
  overflow-x:hidden;
}
.wrap{max-width:980px;margin:0 auto}
.card{
  background:rgba(255,255,255,0.95);
  border:1px solid rgba(229,231,235,0.95);
  box-shadow:var(--shadow);
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
}
h1{margin:0 0 14px;font-size:28px;text-align:center}
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  margin-bottom:14px;
}
button{
  border:none;
  background:#059669;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
  font-weight:700;
  min-height:42px;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button.stop{background:#dc2626}
button.reset{background:#475569}
audio{
  width:100%;
  max-width:560px;
  display:block;
  margin:10px auto 0;
  height:40px;
}
.status{text-align:center;font-size:14px;color:var(--muted);font-weight:700;margin-top:10px}
.layout{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:start}
.intro{
  position:relative;padding:12px 14px;border-radius:14px;background:#fff;border:2px solid var(--green);font-weight:800;
  min-height:56px;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.introFill{position:absolute;left:0;top:0;bottom:0;width:0%;background:#22c55e;opacity:.22}
.introText{position:relative;z-index:2}
.lyrics{display:flex;flex-direction:column;gap:10px;min-width:0}
.line{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
.hece{padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #ddd;font-weight:bold;word-break:break-word}
.hece.active{background:#dbeafe;border-color:#2563eb}
.hece.correct{background:#dcfce7;border-color:#16a34a}
.hece.wrong{background:#fee2e2;border-color:#dc2626}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.box{border:1px solid var(--border);border-radius:14px;padding:12px;background:#fafafa;min-width:0}
.label{font-size:12px;color:var(--muted);margin-bottom:6px}
.value{font-size:24px;font-weight:800;word-break:break-word}
#tunerScaleTop{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#6b7280;margin-bottom:6px}
#tunerScaleTop .mid{color:#374151;font-weight:700}
#tunerRuler{position:relative;height:52px;border-radius:16px;background:linear-gradient(180deg,#fff 0%, #f3f4f6 100%);overflow:hidden;border:1px solid var(--border)}
#targetZone{position:absolute;left:50%;top:10px;width:64px;height:30px;transform:translateX(-50%);border-radius:10px;background:var(--green-soft);border:1px solid rgba(22,163,74,0.22);z-index:1}
#centerMark{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:2px;height:38px;background:var(--green);border-radius:999px;z-index:2}
#tickLayer{position:absolute;inset:0;z-index:1}
.tuner-tick{position:absolute;bottom:8px;width:2px;background:#9ca3af;border-radius:999px;transform:translateX(-50%);opacity:.75}
.tuner-tick.major{height:18px}.tuner-tick.minor{height:10px}
#pitchDot{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:#94a3b8;transform:translate(-50%,-50%);z-index:4;transition:left .10s linear, background .10s linear, box-shadow .10s linear}
#pitchDot.correct{background:var(--green);box-shadow:0 0 0 6px rgba(22,163,74,0.16), 0 0 12px rgba(22,163,74,0.35)}
#pitchDot.wrong{background:var(--red)}
#pitchDot.waiting{background:#94a3b8}
#tunerInfo{min-height:20px;margin-top:10px;font-size:13px;color:#4b5563}
.result{margin-top:18px;font-size:22px;font-weight:bold;text-align:center}
.small{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.select-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:8px 10px;
  min-height:42px;
}
.select-wrap label{
  font-size:13px;
  font-weight:700;
  color:#374151;
}
.select-wrap select{
  border:none;
  background:transparent;
  font-size:13px;
  font-weight:700;
  color:#111827;
  outline:none;
  min-width:72px;
}
.tuner-options{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
@media (max-width:720px){
  .layout{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .controls{align-items:stretch}
  .select-wrap{width:100%;justify-content:space-between}
  .controls > *{width:100%}
  button{width:100%}
  h1{font-size:24px}
  .card{padding:14px}
  .hece{padding:9px 12px}
  .value{font-size:20px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Vocaly Karaoke Ölçme</h1>
    <div class="controls">
      <button type="button" onclick="startKaraoke()">Başlat</button>
      <button type="button" class="stop" onclick="stopKaraoke()">Durdur</button>
      <button type="button" class="reset" onclick="resetKaraoke()">Sıfırla</button>

      <div class="select-wrap">
        <label for="speedSelect">Hız</label>
        <select id="speedSelect">
          <option value="1">1x</option>
          <option value="0.75">0.75x</option>
          <option value="0.5">0.50x</option>
          <option value="0.25">0.25x</option>
        </select>
      </div>
    </div>

    <audio id="song" playsinline webkit-playsinline preload="auto" src="sozsuz.mp3"></audio>
    <div class="status" id="statusText">Hazır</div>
  </div>

  <div class="card">
    <div class="layout">
      <div class="intro">
        <div id="introFill" class="introFill"></div>
        <div class="introText">Intro</div>
      </div>
      <div class="lyrics">
        <div id="line1" class="line"></div>
        <div id="line2" class="line"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="box"><div class="label">Aktif Hece</div><div class="value" id="activeHece">-</div></div>
      <div class="box"><div class="label">Hedef Nota</div><div class="value" id="targetNote">-</div></div>
    </div>

    <div class="tuner-options">
      <div class="select-wrap">
        <label for="toleranceSelect">Tolerans</label>
        <select id="toleranceSelect">
          <option value="10">±10 cent</option>
          <option value="20">±20 cent</option>
          <option value="25">±25 cent</option>
        </select>
      </div>
    </div>

    <div id="tunerScaleTop">
      <span>PES</span>
      <span class="mid">+</span>
      <span>TİZ</span>
    </div>

    <div id="tunerRuler">
      <div id="targetZone"></div>
      <div id="centerMark"></div>
      <div id="tickLayer"></div>
      <div id="pitchDot" class="waiting"></div>
    </div>

    <div id="tunerInfo">Tuner kapalı.</div>
    <div class="result" id="resultText">Toplam Puan: 0</div>
    <div class="small">Belirlenen kısa grup bloklarında ilk ses bazlı doğrulama vardır. "sön" için özel esnetme uygulanır.</div>
  </div>
</div>

<script>
const INTRO_DURATION = 4.20;

const NOTE_ALIASES = {
  "do":0,"do#":1,"reb":1,"re":2,"re#":3,"mib":3,"mi":4,"fa":5,
  "fa#":6,"solb":6,"sol":7,"sol#":8,"lab":8,"la":9,"la#":10,"sib":10,"si":11
};
const PC_TO_TR = {
  0:"Do",1:"Do#/Reb",2:"Re",3:"Re#/Mib",4:"Mi",5:"Fa",
  6:"Fa#/Solb",7:"Sol",8:"Sol#/Lab",9:"La",10:"La#/Sib",11:"Si"
};

const heceler = [
  { text:"Kork", note:"si", start:4.21, end:4.61, line:1 },
  { text:"ma", note:"mi", start:4.68, end:5.23, line:1 },
  { text:"sön", note:"fa", start:5.29, end:5.82, line:1 },
  { text:"mez", note:"sol", start:5.84, end:6.45, line:1 },
  { text:"bu", note:"re#", start:6.43, end:6.91, line:1 },
  { text:"şa", note:"fa", start:6.97, end:7.10, line:1 },
  { text:"fak", note:"mi", start:7.11, end:8.75, line:1 },
  { text:"lar", note:"mi", start:8.74, end:9.30, line:1 },
  { text:"da", note:"la", start:9.30, end:9.95, line:1 },
  { text:"yü", note:"si", start:9.95, end:10.51, line:1 },
  { text:"zen", note:"do", start:10.51, end:11.10, line:1 },
  { text:"al", note:"sol#", start:11.10, end:11.60, line:1 },
  { text:"san", note:"si", start:11.50, end:11.72, line:1 },
  { text:"cak", note:"la", start:11.71, end:13.47, line:1 },

  { text:"Sön", note:"si", start:13.52, end:13.68, line:2 },
  { text:"me", note:"la#", start:13.67, end:13.84, line:2 },
  { text:"den", note:"si", start:13.84, end:14.04, line:2 },
  { text:"yur", note:"fa", start:14.03, end:14.68, line:2 },
  { text:"du", note:"fa", start:14.68, end:15.68, line:2 },
  { text:"mun", note:"la", start:15.62, end:15.82, line:2 },
  { text:"üs", note:"sol#", start:15.84, end:16.29, line:2 },
  { text:"tün", note:"re", start:16.30, end:16.41, line:2 },
  { text:"de", note:"mi", start:16.43, end:16.86, line:2 },
  { text:"tü", note:"fa", start:16.78, end:17.02, line:2 },
  { text:"ten", note:"sol", start:17.03, end:17.49, line:2 },
  { text:"en", note:"fa", start:17.49, end:17.69, line:2 },
  { text:"son", note:"mi", start:17.64, end:18.03, line:2 },
  { text:"o", note:"re", start:18.03, end:18.25, line:2 },
  { text:"cak", note:"si", start:18.25, end:18.67, line:2 }
];

const FIXED_GROUPS = [[5,6],[15,16,17],[21,22,23],[24,25,26,27,28,29]];

let micStream = null;
let micContext = null;
let analyser = null;
let micSource = null;
let tunerAnimation = null;
let tunerRunning = false;
let currentTargetNotes = ["la"];
let started = false;
let current = -1;
let score = 0;
let evaluatedSingles = new Set();
let evaluatedGroups = new Set();
let toleranceCent = 10;
let goodFramesPerHece = {};
let fixedGroups = [];
let groupByIndex = {};
let groupPassed = new Set();

const audio = document.getElementById("song");
const introFill = document.getElementById("introFill");
const line1 = document.getElementById("line1");
const line2 = document.getElementById("line2");
const statusText = document.getElementById("statusText");
const activeHece = document.getElementById("activeHece");
const targetNoteEl = document.getElementById("targetNote");
const resultText = document.getElementById("resultText");
const tunerInfo = document.getElementById("tunerInfo");
const pitchDotEl = document.getElementById("pitchDot");
const tickLayer = document.getElementById("tickLayer");
const speedSelect = document.getElementById("speedSelect");
const toleranceSelect = document.getElementById("toleranceSelect");

function normalizePc(pc){ return ((pc % 12) + 12) % 12; }
function noteNameToPitchClass(name){ return NOTE_ALIASES[String(name).toLowerCase().trim()]; }
function pitchClassToDisplay(pc){ return PC_TO_TR[normalizePc(pc)]; }
function setPitchDotState(mode){ pitchDotEl.classList.remove("correct","wrong","waiting"); pitchDotEl.classList.add(mode); }

function createTicks(){
  tickLayer.innerHTML = "";
  const tickPercents = [10,20,30,40,50,60,70,80,90];
  tickPercents.forEach((left, idx) => {
    const tick = document.createElement("div");
    tick.className = "tuner-tick " + (idx % 2 === 0 ? "major" : "minor");
    tick.style.left = left + "%";
    tickLayer.appendChild(tick);
  });
}

function updatePitchDotByCents(cents) {
  if (cents === null || Number.isNaN(cents)) {
    pitchDotEl.style.left = "50%";
    setPitchDotState("waiting");
    return;
  }
  const clamped = Math.max(-50, Math.min(50, cents));
  const percent = 50 + (clamped / 50) * 40;
  pitchDotEl.style.left = `${percent}%`;
  if (Math.abs(cents) <= toleranceCent) setPitchDotState("correct");
  else setPitchDotState("wrong");
}

function freqToMidi(freq) {
  return 69 + 12 * Math.log2(freq / 440);
}

function centsAgainstTarget(freq, targetName) {
  const midi = freqToMidi(freq);
  const pc = noteNameToPitchClass(targetName);
  if (pc === undefined) return null;
  const nearestMidi = pc + 12 * Math.round((midi - pc) / 12);
  return (midi - nearestMidi) * 100;
}

function autoCorrelate(buffer, sampleRate) {
  let SIZE = buffer.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return -1;

  let r1 = 0, r2 = SIZE - 1;
  const threshold = 0.2;

  for (let i = 0; i < SIZE / 2; i++) {
    if (Math.abs(buffer[i]) < threshold) { r1 = i; break; }
  }
  for (let i = 1; i < SIZE / 2; i++) {
    if (Math.abs(buffer[SIZE - i]) < threshold) { r2 = SIZE - i; break; }
  }

  buffer = buffer.slice(r1, r2);
  SIZE = buffer.length;

  const c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++) {
    for (let j = 0; j < SIZE - i; j++) c[i] += buffer[j] * buffer[j + i];
  }

  let d = 0;
  while (d + 1 < c.length && c[d] > c[d + 1]) d++;

  let maxval = -1, maxpos = -1;
  for (let i = d; i < SIZE; i++) {
    if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
  }
  if (maxpos <= 0) return -1;

  let T0 = maxpos;
  const x1 = c[T0 - 1] || 0;
  const x2 = c[T0] || 0;
  const x3 = c[T0 + 1] || 0;
  const a = (x1 + x3 - 2 * x2) / 2;
  const b = (x3 - x1) / 2;
  if (a) T0 = T0 - b / (2 * a);

  return sampleRate / T0;
}

function setTarget(notes) {
  currentTargetNotes = notes;
  targetNoteEl.textContent = notes.map(n => pitchClassToDisplay(noteNameToPitchClass(n))).join(" / ");
}

function getSingleEvalEnd(index) {
  const h = heceler[index];
  const next = heceler[index + 1];
  if (index === 2) {
    if (!next) return h.end + 0.55;
    return Math.min(h.end + 0.55, next.start - 0.005);
  }
  let extra = 0.28;
  if (!next) return h.end + extra;
  return Math.min(h.end + extra, next.start - 0.01);
}

function buildFixedGroups() {
  fixedGroups = [];
  groupByIndex = {};

  FIXED_GROUPS.forEach((members, id) => {
    const first = members[0];
    const last = members[members.length - 1];
    const next = heceler[last + 1];
    let evalEnd = heceler[last].end + 0.55;
    if (next) evalEnd = Math.min(evalEnd, next.start - 0.01);

    const group = { id, members, first, evalEnd };
    fixedGroups.push(group);
    members.forEach(idx => groupByIndex[idx] = group);
  });
}

function markGroupCorrect(group) {
  groupPassed.add(group.id);
  group.members.forEach(idx => {
    const el = document.getElementById("hece" + idx);
    if (!el) return;
    el.classList.remove("wrong", "active");
    el.classList.add("correct");
  });
}

function updateTunerFromFrequency(freq) {
  let bestCents = null;
  let bestTarget = null;

  for (const target of currentTargetNotes) {
    const cents = centsAgainstTarget(freq, target);
    if (cents === null) continue;
    if (bestCents === null || Math.abs(cents) < Math.abs(bestCents)) {
      bestCents = cents;
      bestTarget = target;
    }
  }

  if (bestCents === null) {
    updatePitchDotByCents(null);
    tunerInfo.textContent = "Geçerli hedef nota yok.";
    return;
  }

  const detectedPitchClass = normalizePc(Math.round(freqToMidi(freq)));
  const centsText = bestCents >= 0 ? `+${bestCents.toFixed(1)}` : bestCents.toFixed(1);
  const isOk = Math.abs(bestCents) <= toleranceCent;

  updatePitchDotByCents(bestCents);

  if (isOk) {
    if (current >= 0) {
      const group = groupByIndex[current];

      if (group && !groupPassed.has(group.id)) {
        const firstIdx = group.first;
        goodFramesPerHece[firstIdx] = (goodFramesPerHece[firstIdx] || 0) + 1;
        if (goodFramesPerHece[firstIdx] >= 1) markGroupCorrect(group);
      } else {
        goodFramesPerHece[current] = (goodFramesPerHece[current] || 0) + 1;
        const el = document.getElementById("hece" + current);
        if (el) {
          el.classList.remove("wrong");
          el.classList.add("correct");
        }
      }
    }

    tunerInfo.textContent = `Duyulan: ${pitchClassToDisplay(detectedPitchClass)} | Hedef: ${pitchClassToDisplay(noteNameToPitchClass(bestTarget))} | Doğru`;
  } else {
    tunerInfo.textContent = `Duyulan: ${pitchClassToDisplay(detectedPitchClass)} | Hedef: ${pitchClassToDisplay(noteNameToPitchClass(bestTarget))} | Sapma: ${centsText} cent`;
  }
}

function tunerLoop() {
  if (!tunerRunning || !analyser) return;

  const buffer = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buffer);
  const freq = autoCorrelate(buffer, micContext.sampleRate);

  if (freq !== -1 && freq > 50 && freq < 1200) {
    updateTunerFromFrequency(freq);
  } else {
    updatePitchDotByCents(null);
    tunerInfo.textContent = tunerRunning
      ? `Hedef: ${currentTargetNotes.map(n => pitchClassToDisplay(noteNameToPitchClass(n))).join(" / ")} | Ses bekleniyor...`
      : "Tuner kapalı.";
  }

  tunerAnimation = requestAnimationFrame(tunerLoop);
}

async function tunerAc() {
  if (tunerRunning) return true;

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    micContext = new (window.AudioContext || window.webkitAudioContext)();
    if (micContext.state === "suspended") await micContext.resume();
    analyser = micContext.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0.85;

    micSource = micContext.createMediaStreamSource(micStream);
    micSource.connect(analyser);

    tunerRunning = true;
    tunerInfo.textContent = `Hedef: ${currentTargetNotes.map(n => pitchClassToDisplay(noteNameToPitchClass(n))).join(" / ")} | Ses bekleniyor...`;
    tunerLoop();
    return true;
  } catch (err) {
    console.error(err);
    tunerInfo.textContent = "Mikrofon açılamadı.";
    return false;
  }
}

function renderLyrics(){
  line1.innerHTML = "";
  line2.innerHTML = "";

  heceler.forEach((h, i) => {
    const div = document.createElement("div");
    div.className = "hece";
    div.id = "hece" + i;
    div.textContent = h.text;
    if (h.line === 1) line1.appendChild(div);
    else line2.appendChild(div);
  });
}

function activate(i){
  document.querySelectorAll(".hece").forEach(el => el.classList.remove("active"));

  const group = groupByIndex[i];
  const el = document.getElementById("hece" + i);
  if (el && !el.classList.contains("wrong") && !el.classList.contains("correct")) {
    el.classList.add("active");
    el.scrollIntoView({ behavior:"smooth", block:"center", inline:"nearest" });
  }

  activeHece.textContent = heceler[i]?.text || "-";

  if (group && !groupPassed.has(group.id)) {
    setTarget([heceler[group.first].note]);
  } else {
    setTarget([heceler[i]?.note || "la"]);
  }

  if (goodFramesPerHece[i] === undefined) goodFramesPerHece[i] = 0;
}

function evaluateSingle(i){
  if (evaluatedSingles.has(i)) return;
  if (groupByIndex[i]) return;

  evaluatedSingles.add(i);

  const el = document.getElementById("hece" + i);
  if (!el) return;

  el.classList.remove("active");

  const goodCount = goodFramesPerHece[i] || 0;
  const passed = goodCount >= 1;

  if (passed) {
    el.classList.remove("wrong");
    el.classList.add("correct");
    score += 10;
  } else {
    el.classList.remove("correct");
    el.classList.add("wrong");
  }

  resultText.textContent = "Toplam Puan: " + score;
}

function evaluateGroup(group){
  if (evaluatedGroups.has(group.id)) return;
  evaluatedGroups.add(group.id);

  const passed = groupPassed.has(group.id) || (goodFramesPerHece[group.first] || 0) >= 1;

  group.members.forEach(idx => {
    const el = document.getElementById("hece" + idx);
    if (!el) return;
    el.classList.remove("active");
    if (passed) {
      el.classList.remove("wrong");
      el.classList.add("correct");
    } else {
      el.classList.remove("correct");
      el.classList.add("wrong");
    }
  });

  if (passed) score += 10 * group.members.length;
  resultText.textContent = "Toplam Puan: " + score;
}

function getActiveHeceIndex(t){
  let active = -1;
  for (let i = 0; i < heceler.length; i++) {
    if (t >= heceler[i].start) active = i;
    else break;
  }
  return active;
}

async function startKaraoke(){
  const ok = await tunerAc();
  if (!ok) {
    statusText.textContent = "Mikrofon açılmadı";
    return;
  }

  score = 0;
  current = -1;
  evaluatedSingles = new Set();
  evaluatedGroups = new Set();
  goodFramesPerHece = {};
  groupPassed = new Set();

  resultText.textContent = "Toplam Puan: 0";
  document.querySelectorAll(".hece").forEach(el => el.className = "hece");
  introFill.style.width = "0%";
  activeHece.textContent = "-";
  targetNoteEl.textContent = "-";
  audio.currentTime = 0;
  audio.playbackRate = Number(speedSelect.value);

  started = true;
  statusText.textContent = `Çalıyor (${audio.playbackRate.toFixed(2)}x)`;

  try {
    await audio.play();
  } catch(e) {
    statusText.textContent = "Müzik başlatılamadı";
    return;
  }

  requestAnimationFrame(update);
}

function stopKaraoke(){
  started = false;
  audio.pause();
  statusText.textContent = "Durduruldu";
}

function resetKaraoke(){
  stopKaraoke();
  audio.currentTime = 0;
  audio.playbackRate = Number(speedSelect.value);

  score = 0;
  current = -1;
  evaluatedSingles = new Set();
  evaluatedGroups = new Set();
  goodFramesPerHece = {};
  groupPassed = new Set();

  introFill.style.width = "0%";
  activeHece.textContent = "-";
  resultText.textContent = "Toplam Puan: 0";
  targetNoteEl.textContent = "-";
  document.querySelectorAll(".hece").forEach(el => el.className = "hece");

  updatePitchDotByCents(null);
  tunerInfo.textContent = tunerRunning ? "Ses bekleniyor..." : "Tuner kapalı.";
  statusText.textContent = "Hazır";
}

function update(){
  if (!started) return;

  const t = audio.currentTime;

  if (t < INTRO_DURATION) introFill.style.width = ((t / INTRO_DURATION) * 100) + "%";
  else introFill.style.width = "100%";

  const activeIdx = getActiveHeceIndex(t);
  if (activeIdx !== current && activeIdx >= 0) {
    current = activeIdx;
    activate(activeIdx);
  }

  for (let i = 0; i < heceler.length; i++) {
    const group = groupByIndex[i];
    if (group) {
      if (t > group.evalEnd) evaluateGroup(group);
    } else {
      const evalEnd = getSingleEvalEnd(i);
      if (t > evalEnd) evaluateSingle(i);
    }
  }

  if (!audio.paused && !audio.ended) {
    requestAnimationFrame(update);
  } else if (audio.ended) {
    fixedGroups.forEach(group => evaluateGroup(group));
    for (let i = 0; i < heceler.length; i++) evaluateSingle(i);
    statusText.textContent = "Tamamlandı";
  }
}

speedSelect.addEventListener("change", () => {
  audio.playbackRate = Number(speedSelect.value);
  if (started) statusText.textContent = `Çalıyor (${audio.playbackRate.toFixed(2)}x)`;
});

toleranceSelect.addEventListener("change", () => {
  toleranceCent = Number(toleranceSelect.value);
  if (tunerRunning) tunerInfo.textContent = `Tolerans güncellendi: ±${toleranceCent} cent`;
});

buildFixedGroups();
createTicks();
renderLyrics();
audio.playbackRate = Number(speedSelect.value);
toleranceCent = Number(toleranceSelect.value);

document.addEventListener("touchend", async () => {
  if (micContext && micContext.state === "suspended") {
    try { await micContext.resume(); } catch(e) {}
  }
}, { passive:true });
</script>
