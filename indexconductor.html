<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vocaly — Telefon Sensör Testi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050708;color:#eef2f1;font-family:Arial,sans-serif}
body{display:flex;justify-content:center}
main{width:min(560px,100%);padding:28px 20px 40px}
h1{margin:0;font-size:22px;letter-spacing:5px}
.sub{margin-top:7px;color:#7d8d8f;font-size:10px;letter-spacing:2px}
.card{margin-top:20px;padding:18px;border:1px solid #334042;border-radius:16px;background:#101617}
button{width:100%;height:52px;border:0;border-radius:10px;background:#e5c88e;color:#111;font-size:15px;font-weight:700}
#status{margin-top:14px;padding:14px;border-radius:10px;background:#171d1e;font-size:12px;line-height:1.6}
.ok{color:#e5c88e}.bad{color:#ff9b9b}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.value{padding:16px 10px;border-radius:12px;background:#0c1011;border:1px solid #283234;text-align:center}
.value b{display:block;font-size:23px;margin-top:5px}
.value span{font-size:10px;color:#7f8f91;letter-spacing:1px}
.note{margin-top:18px;color:#718082;font-size:11px;line-height:1.7}
</style>
</head>
<body>
<main>
<h1>VOCALY</h1>
<div class="sub">KONDUKTÖR • TELEFON SENSÖR TESTİ</div>

<div class="card">
<button id="start">SENSÖRÜ BAŞLAT</button>
<div id="status">HTTPS bağlantısı üzerinden sensör bekleniyor.</div>
<div class="grid">
<div class="value"><span>BETA</span><b id="beta">—</b></div>
<div class="value"><span>GAMMA</span><b id="gamma">—</b></div>
<div class="value"><span>ALPHA</span><b id="alpha">—</b></div>
</div>
</div>

<div class="note">
Telefonu hafifçe sağa-sola ve öne-arkaya eğ. Değerlerin değişmesi gerekiyor.
<br><br>
Bu sayfa sadece sensörü test eder. Bilgisayara bağlantı, el/baton ve 4/4 paterni bu aşamada yok.
</div>

<script>
const beta=document.getElementById('beta');
const gamma=document.getElementById('gamma');
const alpha=document.getElementById('alpha');
const status=document.getElementById('status');
const start=document.getElementById('start');

function show(v){return Number.isFinite(v)?v.toFixed(1)+'°':'—'}

function onOrientation(e){
 beta.textContent=show(e.beta);
 gamma.textContent=show(e.gamma);
 alpha.textContent=show(e.alpha);
 status.innerHTML='<span class="ok">🟢 SENSÖR VERİSİ GELİYOR</span><br>Telefon hareket ettirildiğinde değerler değişmeli.';
}

async function startSensor(){
 if(!window.isSecureContext){
   status.innerHTML='<span class="bad">🔴 BU SAYFA HTTPS DEĞİL.</span><br>Chrome adres çubuğunda kilit simgesi ve https:// ile açılmalı.';
   return;
 }
 if(typeof DeviceOrientationEvent==='undefined'){
   status.innerHTML='<span class="bad">🔴 DeviceOrientation desteklenmiyor.</span>';
   return;
 }
 try{
   if(typeof DeviceOrientationEvent.requestPermission==='function'){
     const p=await DeviceOrientationEvent.requestPermission();
     if(p!=='granted'){
       status.innerHTML='<span class="bad">🔴 Sensör izni verilmedi.</span>';
       return;
     }
   }
   window.addEventListener('deviceorientation',onOrientation,true);
   status.innerHTML='<span class="ok">🟢 SENSÖR AKTİF</span><br>Telefonu hareket ettir.';
 }catch(err){
   status.innerHTML='<span class="bad">🔴 Sensör başlatılamadı.</span><br>'+err;
 }
}
start.onclick=startSensor;
</script>
</main>
</body>
</html>
