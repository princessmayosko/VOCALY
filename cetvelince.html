<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VOCALY</title>
  <script src="https://unpkg.com/wavesurfer.js@6"></script>
  <style>
    :root{
      --bg:#08111f;
      --bg2:#0f1b2d;
      --panel:rgba(12,22,39,.94);
      --line:rgba(255,255,255,.10);
      --text:#eef4ff;
      --muted:#9fb0c9;
      --yellow:#facc15;
      --purple:#8b5cf6;
      --blue:#60a5fa;
      --green:#22c55e;
      --red:#ef4444;
      --shadow:0 12px 36px rgba(0,0,0,.32);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:Arial,sans-serif}
    body{min-height:100vh}
    button,input,textarea,select{font:inherit}
    .hidden{display:none!important}
    .app{max-width:1200px;margin:0 auto;padding:14px 14px 42px}

    .topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(8,17,31,.96),rgba(8,17,31,.78));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .topbar-inner{max-width:1200px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;justify-content:center}
    .logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#fde047 0,#facc15 42%,#ca8a04 100%);color:#111827;font-weight:900;font-size:20px;box-shadow:0 8px 24px rgba(250,204,21,.22)}

    .card{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px;margin-top:16px;overflow:hidden}
    .sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .sectionTitle h2{margin:0;font-size:20px}
    .metaRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .smallBtn{padding:10px 12px;border:none;border-radius:12px;background:rgba(255,255,255,.08);color:var(--text);cursor:pointer}
    .smallBtn.primary{background:linear-gradient(135deg,var(--purple),#6d28d9)}
    .bigBtn{width:100%;min-height:66px;border:none;border-radius:18px;background:rgba(255,255,255,.08);color:var(--text);font-size:20px;font-weight:800;cursor:pointer}
    .pill{padding:8px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);display:inline-flex;width:max-content}

    .libraryList{display:flex;flex-direction:column;gap:10px}
    .libraryItem{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04)}

    .miniBar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04);margin-bottom:10px}
    .iconBtn{width:34px;height:34px;border:none;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;padding:0;font-size:15px}
    .fileLabel{position:relative;overflow:hidden}.fileLabel input{position:absolute;inset:0;opacity:0;cursor:pointer}
    #zoom{flex:1;min-width:110px}

    .waveShell{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0c1528;width:100%}
    #waveform{height:300px;overflow-x:auto;overflow-y:hidden;width:100%}
    #overlayViewport{position:absolute;top:0;left:0;right:0;height:98px;overflow:hidden;z-index:8;pointer-events:none;background:linear-gradient(180deg,rgba(10,17,33,.97) 0%, rgba(10,17,33,.92) 70%, rgba(10,17,33,0) 100%)}
    #overlayContent{position:absolute;left:0;top:0;height:98px}
    #ruler{position:absolute;left:0;top:0;height:36px;border-bottom:1px solid #24355a;background:linear-gradient(180deg,rgba(13,22,44,.98) 0%, rgba(13,22,44,.92) 100%);pointer-events:auto}
    #segmentStrip{position:absolute;left:0;top:36px;height:50px;pointer-events:auto}
    #stripCursor{position:absolute;top:0;bottom:0;width:2px;background:var(--yellow);opacity:.95;pointer-events:none;z-index:20}
    .ruler-tick{position:absolute;bottom:0;width:1px;background:#4a5f8e}.ruler-tick.major{height:24px;background:#9fb0d8}.ruler-tick.medium{height:15px;background:#6f84b4}.ruler-tick.minor{height:8px;background:#43577f}.ruler-label{position:absolute;top:4px;transform:translateX(-50%);font-size:10px;color:#dce8ff;white-space:nowrap;font-weight:700}
    .strip-block{position:absolute;top:8px;height:32px;border-radius:10px;background:#1c2b52;border:1px solid #3c57a1;color:#eef4ff;min-width:34px;overflow:hidden;touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
    .strip-block.intro{background:#4b3a0d;border-color:#b38a17;color:#fde68a}.strip-block.active{box-shadow:0 0 0 3px rgba(139,92,246,.18);border-color:#c4b5fd}
    .strip-block .body{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
    .strip-block .handle{position:absolute;top:0;bottom:0;width:10px;z-index:2}.strip-block .handle.left{left:0;cursor:ew-resize}.strip-block .handle.right{right:0;cursor:ew-resize}.strip-block .drag{position:absolute;left:10px;right:10px;top:0;bottom:0;cursor:grab}

    .rowCompact{display:grid;grid-template-columns:2fr .8fr 1.2fr 1fr .8fr .8fr .7fr auto;gap:8px;align-items:center;margin-top:10px}
    .rowCompact > *{min-width:0}
    .rowCompact input{padding:10px 11px;border-radius:12px;border:1px solid #334267;background:#0f1830;color:#eef4ff}
    textarea{width:100%;margin-top:10px;min-height:110px;padding:12px;border-radius:14px;border:1px solid #334267;background:#0f1830;color:#eef4ff;resize:vertical;line-height:1.5}
    .statusPills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

    #karaoke,#measureBoxes{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;padding:12px;border:1px dashed rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.03);min-height:110px;max-height:380px;overflow:auto}
    .karaokeBox,.measureBox{position:relative;overflow:hidden;min-width:74px;padding:12px 14px;border-radius:14px;background:#192749;border:1px solid #31497e;font-weight:700;cursor:pointer;user-select:none;transition:.15s ease;flex:0 0 auto}
    .karaokeBox .fill,.measureBox .fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:rgba(139,92,246,.18);pointer-events:none;transition:width .05s linear}
    .karaokeBox .label,.measureBox .label{position:relative;z-index:1}
    .karaokeBox.active,.measureBox.active{border-color:#c4b5fd;box-shadow:0 0 0 4px rgba(139,92,246,.12);transform:scale(1.03)}
    .karaokeBox.intro,.measureBox.intro{background:#4b3a0d;border-color:#b38a17;color:#fde68a}
    .karaokeBox.selected,.measureBox.selected{box-shadow:0 0 0 4px rgba(96,165,250,.16);border-color:var(--blue)}
    .measureBox.ok{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.55)}
    .measureBox.bad{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.55)}
    .lineBreak{flex-basis:100%;height:0;width:0}

    /* cetvel */
    #vocalyCetvelDrawer{position:fixed;left:0;top:0;bottom:0;width:11vw;min-width:72px;max-width:96px;background:linear-gradient(180deg,rgba(8,17,31,.97),rgba(12,22,39,.98));border-right:1px solid rgba(255,255,255,.08);transform:translateX(-100%);transition:transform .22s ease;z-index:120;display:flex;flex-direction:column;padding:10px 6px;gap:2px;box-shadow:none}
    #vocalyCetvelDrawer.open{transform:translateX(0);box-shadow:18px 0 44px rgba(0,0,0,.38)}
    #vocalyCetvelHandle{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:121;writing-mode:vertical-rl;text-orientation:mixed;border-radius:0 12px 12px 0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);border-left:none;color:#dbe6ff;font-size:12px;font-weight:800;letter-spacing:.4px;padding:10px 3px;cursor:pointer;user-select:none;backdrop-filter:blur(8px)}
    .cetvelMeta{padding:6px 4px 8px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:4px}.cetvelMetaTitle{font-size:10px;color:#9fb0c9;text-align:center;margin-bottom:4px;letter-spacing:.4px}.cetvelTarget{min-height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);font-size:12px;font-weight:800;color:#eef4ff}
    .cetvelBlock{width:100%;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035);font-weight:800;line-height:1;color:#dce7ff;overflow:hidden}
    .cetvelBlock.main{min-height:48px;font-size:15px}.cetvelBlock.chromatic{min-height:26px;font-size:10px;opacity:.78}
    .cetvel-do{color:#ef7373}.cetvel-dosharp{color:#d58bd7}.cetvel-re{color:#efb282}.cetvel-resharp{color:#b4d28a}.cetvel-mi{color:#f1d76a}.cetvel-fa{color:#7fd788}.cetvel-fasharp{color:#6fe0c1}.cetvel-sol{color:#6fd8f0}.cetvel-solsharp{color:#87b6ff}.cetvel-la{color:#8da4ff}.cetvel-lasharp{color:#b191ff}.cetvel-si{color:#ff9ed1}
    .cetvelBlock.target{box-shadow:0 0 0 2px rgba(250,204,21,.26) inset,0 0 18px rgba(250,204,21,.12);background:rgba(250,204,21,.10)}
    .cetvelBlock.detected{box-shadow:0 0 0 2px rgba(34,197,94,.28) inset,0 0 18px rgba(34,197,94,.14);background:rgba(34,197,94,.10)}

    @media (max-width:980px){.rowCompact{grid-template-columns:1fr 1fr}.rowCompact > *:last-child{grid-column:1 / -1}#waveform{height:240px}.miniBar{gap:5px}}
    @media (max-width:680px){#vocalyCetvelDrawer{width:11.5vw;min-width:70px;max-width:88px}.cetvelBlock.main{min-height:44px;font-size:14px}.cetvelBlock.chromatic{min-height:24px;font-size:9px}}
  </style>
</head>
<body>
  <aside id="vocalyCetvelDrawer" class="hidden">
    <div class="cetvelMeta">
      <div class="cetvelMetaTitle">Hedef</div>
      <div class="cetvelTarget" id="cetvelTargetText">—</div>
    </div>
    <div class="cetvelBlock main cetvel-do" data-note="Do">Do</div>
    <div class="cetvelBlock main cetvel-si" data-note="Si">Si</div>
    <div class="cetvelBlock chromatic cetvel-lasharp" data-note="La#">La# / Sib</div>
    <div class="cetvelBlock main cetvel-la" data-note="La">La</div>
    <div class="cetvelBlock chromatic cetvel-solsharp" data-note="Sol#">Sol# / Lab</div>
    <div class="cetvelBlock main cetvel-sol" data-note="Sol">Sol</div>
    <div class="cetvelBlock chromatic cetvel-fasharp" data-note="Fa#">Fa# / Solb</div>
    <div class="cetvelBlock main cetvel-fa" data-note="Fa">Fa</div>
    <div class="cetvelBlock main cetvel-mi" data-note="Mi">Mi</div>
    <div class="cetvelBlock chromatic cetvel-resharp" data-note="Re#">Re# / Mib</div>
    <div class="cetvelBlock main cetvel-re" data-note="Re">Re</div>
    <div class="cetvelBlock chromatic cetvel-dosharp" data-note="Do#">Do# / Reb</div>
    <div class="cetvelBlock main cetvel-do" data-note="Do">Do</div>
  </aside>
  <div id="vocalyCetvelHandle" class="hidden">VOCALY CETVEL</div>

  <div class="topbar"><div class="topbar-inner"><div class="logo">V</div></div></div>

  <div class="app">
    <section id="homeSection">
      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:center;padding:12px 0 6px"><div class="logo" style="width:72px;height:72px;font-size:32px">V</div></div>
        <button class="bigBtn" id="homeLibraryBtn">Kütüphane</button>
        <button class="bigBtn" id="homeEditorBtn">Editör</button>
      </div>
    </section>

    <section id="librarySection" class="hidden">
      <div class="card">
        <div class="sectionTitle"><h2>Kütüphane</h2><button class="smallBtn" id="libraryBackBtn">Geri</button></div>
        <div id="libraryList" class="libraryList"></div>
      </div>
    </section>

    <section id="measureSection" class="hidden">
      <div class="card">
        <div class="sectionTitle"><h2>Karaoke / Ölçme</h2><div class="metaRow"><button class="smallBtn" id="measureBackBtn">Geri</button><button class="smallBtn primary" id="measurePlayBtn">Başlat</button><button class="smallBtn" id="measureStopBtn">Durdur</button><button class="smallBtn" id="measureResetBtn">Sıfırla</button></div></div>
        <div id="measureTitle" class="pill">—</div>
        <div id="measureBoxes" style="margin-top:12px"></div>
      </div>
    </section>

    <section id="editorSection" class="hidden">
      <div class="card">
        <div class="sectionTitle"><h2>Editör</h2><button class="smallBtn" id="editorBackBtn">Geri</button></div>
        <div class="miniBar">
          <label class="iconBtn fileLabel" title="MP3 Aç">🎵<input type="file" id="audioFile" accept="audio/*"></label>
          <label class="iconBtn fileLabel" title="JSON Aç">📂<input type="file" id="importJsonInput" accept=".json,application/json"></label>
          <button class="iconBtn" id="playBtn" title="Oynat / Durdur">▶</button>
          <button class="iconBtn" id="stopBtn" title="Durdur">■</button>
          <button class="iconBtn" id="zoomOutBtn" title="Zoom -">－</button>
          <input id="zoom" type="range" min="40" max="360" step="10" value="140">
          <button class="iconBtn" id="zoomInBtn" title="Zoom +">＋</button>
          <button class="iconBtn" id="splitWordsBtn" title="Kelimelere Böl">☰</button>
          <button class="iconBtn" id="autoTimingBtn" title="Oto Timing">⚡</button>
          <button class="iconBtn" id="saveProjectBtn" title="JSON İndir">💾</button>
        </div>
        <div class="waveShell"><div id="waveform"></div><div id="overlayViewport"><div id="overlayContent"><div id="ruler"></div><div id="segmentStrip"></div></div><div id="stripCursor"></div></div></div>
        <div class="statusPills"><div class="pill" id="timeText">0.00 sn</div><div class="pill" id="cursorText">Cursor: 0.00 sn</div><div class="pill" id="activeSegmentText">Aktif: -</div></div>
      </div>
      <div class="card">
        <div class="sectionTitle"><h2>Sözler</h2></div>
        <div class="rowCompact">
          <input id="titleInput" type="text" placeholder="Eser başlığı">
          <input id="intro" type="number" step="0.01" min="0" value="0.00" placeholder="Intro">
          <input id="hece" type="text" placeholder="Kelime / hece">
          <input id="nota" type="text" placeholder="Nota">
          <input id="start" type="number" step="0.01" placeholder="Start">
          <input id="end" type="number" step="0.01" placeholder="End">
          <input id="satir" type="number" step="1" min="1" placeholder="Satır">
          <button class="smallBtn primary" id="saveBtn">Kaydet</button>
        </div>
        <div class="rowCompact">
          <button class="smallBtn" id="updateBtn">Güncelle</button><button class="smallBtn" id="deleteLoadedBtn">Sil</button><button class="smallBtn" id="previewSelectedBtn">Dinle</button><button class="smallBtn" id="resetTimingBtn">Sıfırla</button><button class="smallBtn" id="minusStartBtn">Start -</button><button class="smallBtn" id="plusStartBtn">Start +</button><button class="smallBtn" id="minusEndBtn">End -</button><button class="smallBtn" id="plusEndBtn">End +</button>
        </div>
        <textarea id="lyricsInput" placeholder="Sözleri satır satır yapıştır..."></textarea>
      </div>
      <div class="card">
        <div class="sectionTitle"><h2>Önizleme</h2></div>
        <div class="metaRow"><button class="smallBtn primary" id="previewPlayBtn">Önizleme</button><button class="smallBtn" id="previewStopBtn">Durdur</button><button class="smallBtn" id="clearSelectionBtn">Seçimi Temizle</button><button class="smallBtn" id="playLineBtn">Satırı Çal</button></div>
        <div id="karaoke"></div>
      </div>
    </section>
  </div>

  <script>
    let ws = null, heceler = [], loadedIndex = -1, currentAudioName = 'audio.mp3', cursorTime = 0, objectUrlRef = null, dragState = null, wrapperBound = false, selectedSegmentIndexes = [], sequenceStopRequested = false, libraryItems = [], measureTimerRefs = [], currentMeasureItemId = null;
    let cetvelMicStream = null, audioCtx = null, analyser = null, micSource = null, dataArray = null, isPitchRunning = false, touchStartX = 0;
    const PROJECT_AUTOSAVE_KEY = 'vocaly_editor_clean_v4';
    const LIBRARY_KEY = 'vocaly_library_clean_v4';

    const homeSection = document.getElementById('homeSection');
    const librarySection = document.getElementById('librarySection');
    const measureSection = document.getElementById('measureSection');
    const editorSection = document.getElementById('editorSection');
    const homeLibraryBtn = document.getElementById('homeLibraryBtn');
    const homeEditorBtn = document.getElementById('homeEditorBtn');
    const libraryBackBtn = document.getElementById('libraryBackBtn');
    const measureBackBtn = document.getElementById('measureBackBtn');
    const editorBackBtn = document.getElementById('editorBackBtn');
    const libraryList = document.getElementById('libraryList');
    const measureTitle = document.getElementById('measureTitle');
    const measureBoxes = document.getElementById('measureBoxes');
    const measurePlayBtn = document.getElementById('measurePlayBtn');
    const measureStopBtn = document.getElementById('measureStopBtn');
    const measureResetBtn = document.getElementById('measureResetBtn');
    const vocalyCetvelDrawer = document.getElementById('vocalyCetvelDrawer');
    const vocalyCetvelHandle = document.getElementById('vocalyCetvelHandle');
    const cetvelTargetText = document.getElementById('cetvelTargetText');
    const titleInput = document.getElementById('titleInput');
    const audioFile = document.getElementById('audioFile');
    const importJsonInput = document.getElementById('importJsonInput');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const zoom = document.getElementById('zoom');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const introInput = document.getElementById('intro');
    const startInput = document.getElementById('start');
    const endInput = document.getElementById('end');
    const heceInput = document.getElementById('hece');
    const notaInput = document.getElementById('nota');
    const satirInput = document.getElementById('satir');
    const splitWordsBtn = document.getElementById('splitWordsBtn');
    const autoTimingBtn = document.getElementById('autoTimingBtn');
    const saveProjectBtn = document.getElementById('saveProjectBtn');
    const resetTimingBtn = document.getElementById('resetTimingBtn');
    const saveBtn = document.getElementById('saveBtn');
    const updateBtn = document.getElementById('updateBtn');
    const deleteLoadedBtn = document.getElementById('deleteLoadedBtn');
    const lyricsInput = document.getElementById('lyricsInput');
    const minusStartBtn = document.getElementById('minusStartBtn');
    const plusStartBtn = document.getElementById('plusStartBtn');
    const minusEndBtn = document.getElementById('minusEndBtn');
    const plusEndBtn = document.getElementById('plusEndBtn');
    const previewSelectedBtn = document.getElementById('previewSelectedBtn');
    const previewPlayBtn = document.getElementById('previewPlayBtn');
    const previewStopBtn = document.getElementById('previewStopBtn');
    const clearSelectionBtn = document.getElementById('clearSelectionBtn');
    const playLineBtn = document.getElementById('playLineBtn');
    const timeText = document.getElementById('timeText');
    const cursorText = document.getElementById('cursorText');
    const activeSegmentText = document.getElementById('activeSegmentText');
    const overlayViewport = document.getElementById('overlayViewport');
    const overlayContent = document.getElementById('overlayContent');
    const ruler = document.getElementById('ruler');
    const segmentStrip = document.getElementById('segmentStrip');
    const stripCursor = document.getElementById('stripCursor');
    const karaoke = document.getElementById('karaoke');

    function clamp(v,min,max){ return Math.max(min, Math.min(max,v)); }
    function round2(v){ return Number((v || 0).toFixed(2)); }
    function escapeHtml(str){ return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }
    function getIntroValue(){ const v=parseFloat(introInput.value); return isNaN(v)?0:round2(v); }
    function splitWordsFromText(text){ const lines=String(text||'').split(/\n/).map(x=>x.trim()); const out=[]; lines.forEach((line,lineIndex)=>{ if(!line) return; line.split(/\s+/).filter(Boolean).forEach(word=> out.push({text:word,line:lineIndex+1})); }); return out; }

    function showSection(name){
      homeSection.classList.add('hidden'); librarySection.classList.add('hidden'); measureSection.classList.add('hidden'); editorSection.classList.add('hidden');
      closeCetvel();
      if(name==='home') homeSection.classList.remove('hidden');
      if(name==='library') librarySection.classList.remove('hidden');
      if(name==='measure'){ measureSection.classList.remove('hidden'); vocalyCetvelDrawer.classList.remove('hidden'); vocalyCetvelHandle.classList.remove('hidden'); }
      if(name==='editor') editorSection.classList.remove('hidden');
    }

    function hasAudioLoaded(){ return !!(ws && ws.getDuration && ws.getDuration()>0); }
    function getWaveWrapper(){ return ws && ws.drawer ? ws.drawer.wrapper : null; }
    function getWaveInner(){ const wrapper=getWaveWrapper(); return wrapper ? (wrapper.querySelector('.wavesurfer-wave') || wrapper.firstElementChild) : null; }
    function getScrollableWidth(){ const inner=getWaveInner(); if(inner && inner.scrollWidth) return inner.scrollWidth; const wrapper=getWaveWrapper(); if(wrapper && wrapper.scrollWidth) return wrapper.scrollWidth; return overlayViewport.clientWidth || 1; }
    function getVisibleWidth(){ const wrapper=getWaveWrapper(); return wrapper ? wrapper.clientWidth : (overlayViewport.clientWidth || 1); }
    function getScrollLeft(){ const wrapper=getWaveWrapper(); return wrapper ? wrapper.scrollLeft : 0; }
    function getDurationSafe(){ return hasAudioLoaded() ? ws.getDuration() : 1; }
    function getPxPerSec(){ return getScrollableWidth()/getDurationSafe(); }
    function timeToPx(t){ return t * getPxPerSec(); }
    function pxToTime(px){ return px / getPxPerSec(); }
    function seekToTime(t){ if(!hasAudioLoaded()) return; const d=ws.getDuration(); const c=clamp(t,0,d); ws.seekTo(d ? c/d : 0); setCursorTime(c); }
    function setCursorTime(t){ cursorTime=clamp(round2(t||0),0,hasAudioLoaded()?ws.getDuration():999999); cursorText.textContent='Cursor: '+cursorTime.toFixed(2)+' sn'; updateStripCursor(); }
    function scrollToTime(t){ const wrapper=getWaveWrapper(); if(!wrapper || !hasAudioLoaded()) return; const x=timeToPx(t); wrapper.scrollLeft=clamp(x-wrapper.clientWidth*0.35,0,wrapper.scrollWidth-wrapper.clientWidth); syncOverlayPosition(); }
    function syncOverlayPosition(){ const wrapper=getWaveWrapper(); if(!wrapper) return; overlayContent.style.transform='translateX(' + (-wrapper.scrollLeft) + 'px)'; updateStripCursor(); }
    function updateStripCursor(){ if(!hasAudioLoaded()){ stripCursor.style.left='0px'; return; } stripCursor.style.left=(timeToPx(cursorTime)-getScrollLeft())+'px'; }

    function bindWaveformDrag(){ const wrapper=getWaveWrapper(); if(!wrapper) return; wrapper.addEventListener('pointerdown',e=>{ if(e.target.closest('.handle') || e.target.closest('.strip-block')) return; wrapper._drag={startX:e.clientX,startScroll:wrapper.scrollLeft}; }); wrapper.addEventListener('pointermove',e=>{ if(!wrapper._drag) return; const dx=e.clientX-wrapper._drag.startX; wrapper.scrollLeft=wrapper._drag.startScroll-dx; syncOverlayPosition(); }); const end=()=> wrapper._drag=null; wrapper.addEventListener('pointerup',end); wrapper.addEventListener('pointercancel',end); wrapper.addEventListener('scroll',syncOverlayPosition,{passive:true}); }
    function bindWrapperEvents(){ if(wrapperBound) return; const wrapper=getWaveWrapper(); if(!wrapper) return; bindWaveformDrag(); wrapperBound=true; }

    initWave(); renderAll(); setCursorTime(0); loadLibrary(); loadProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); showSection('home');

    homeLibraryBtn.addEventListener('click',()=> showSection('library'));
    homeEditorBtn.addEventListener('click',()=> showSection('editor'));
    libraryBackBtn.addEventListener('click',()=> showSection('home'));
    editorBackBtn.addEventListener('click',()=> showSection('home'));
    measureBackBtn.addEventListener('click',()=>{ stopMeasure(); showSection('library'); });
    audioFile.addEventListener('change',e=>{ const file=e.target.files[0]; if(!file) return; currentAudioName=file.name; if(objectUrlRef && objectUrlRef.startsWith('blob:')) URL.revokeObjectURL(objectUrlRef); objectUrlRef=URL.createObjectURL(file); ws.load(objectUrlRef); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    importJsonInput.addEventListener('change',e=>{ const file=e.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=()=> importProjectFromJsonText(reader.result); reader.readAsText(file,'utf-8'); importJsonInput.value=''; });
    playBtn.addEventListener('click',()=> hasAudioLoaded() && ws.playPause());
    stopBtn.addEventListener('click',()=> { if(hasAudioLoaded()){ ws.stop(); setCursorTime(0); } });
    zoom.addEventListener('input',()=> { if(!hasAudioLoaded()) return; ws.zoom(Number(zoom.value)); setTimeout(renderAll,20); });
    zoomOutBtn.addEventListener('click',()=> { zoom.value=Math.max(40, Number(zoom.value)-20); zoom.dispatchEvent(new Event('input')); });
    zoomInBtn.addEventListener('click',()=> { zoom.value=Math.min(360, Number(zoom.value)+20); zoom.dispatchEvent(new Event('input')); });
    splitWordsBtn.addEventListener('click',()=> { parseLyricsToSegmentsPreserve(); loadedIndex=-1; renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    autoTimingBtn.addEventListener('click',()=> { if(!heceler.length) parseLyricsToSegmentsPreserve(); const words=heceler.filter(h=>!h.isIntro); if(!words.length) return; const intro=getIntroValue(); const duration=hasAudioLoaded()?ws.getDuration():Math.max(intro+words.length*0.8,8); const available=Math.max(0.6,duration-intro); const totalChars=words.reduce((s,w)=>s+Math.max(1,(w.text||'').length),0); let cursor=intro; words.forEach(seg=>{ const weight=Math.max(1,(seg.text||'').length); const segDur=Math.max(0.10, Number(((weight/totalChars)*available).toFixed(2))); seg.start=round2(cursor); seg.end=round2(cursor+segDur); cursor=seg.end; }); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    saveProjectBtn.addEventListener('click',saveProject);
    resetTimingBtn.addEventListener('click',()=> { normalizeIntroSegment(); heceler.forEach(h=>{ if(h.isIntro){ h.start=0; h.end=getIntroValue(); } else { h.start=null; h.end=null; } }); loadedIndex=-1; selectedSegmentIndexes=[]; renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    saveBtn.addEventListener('click',()=> { const text=heceInput.value.trim(); const note=notaInput.value.trim(); const start=parseFloat(startInput.value); const end=parseFloat(endInput.value); const line=Number(satirInput.value||1); if(!text) return alert('Kelime / hece gir.'); if(!isNaN(start) && !isNaN(end) && end<=start) return alert('End, start’tan büyük olmalı.'); const obj={ text:text, note:note, start:isNaN(start)?null:round2(start), end:isNaN(end)?null:round2(end), line:line, isIntro:false }; if(loadedIndex>-1){ const wasIntro=!!heceler[loadedIndex]?.isIntro; heceler[loadedIndex]={...obj,isIntro:wasIntro}; loadedIndex=-1; } else { heceler.push(obj); } normalizeIntroSegment(); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    updateBtn.addEventListener('click',()=> { if(loadedIndex===-1) return alert('Önce bir segment seç.'); const seg=heceler[loadedIndex]; const start=parseFloat(startInput.value); const end=parseFloat(endInput.value); if(isNaN(start)||isNaN(end)||end<=start) return alert('Geçerli bir start/end gir.'); seg.text=heceInput.value.trim(); seg.note=notaInput.value.trim(); seg.start=round2(start); seg.end=round2(end); seg.line=Number(satirInput.value||seg.line||1); if(seg.isIntro){ seg.text='INTRO'; seg.start=0; introInput.value=seg.end.toFixed(2); } renderAll(); seekToSegment(loadedIndex,false); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    deleteLoadedBtn.addEventListener('click',()=> { if(loadedIndex===-1) return alert('Önce bir segment seç.'); if(heceler[loadedIndex]?.isIntro) return alert('Intro silinmez.'); const removed=loadedIndex; heceler.splice(removed,1); loadedIndex=-1; selectedSegmentIndexes=selectedSegmentIndexes.filter(i=>i!==removed).map(i=> i>removed ? i-1 : i); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    minusStartBtn.addEventListener('click',()=> { if(loadedIndex===-1) return; const seg=heceler[loadedIndex]; const v=Math.max(0, round2((seg.start??0)-0.05)); if(seg.end<=v+0.03) return; seg.start=v; startInput.value=v.toFixed(2); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    plusStartBtn.addEventListener('click',()=> { if(loadedIndex===-1) return; const seg=heceler[loadedIndex]; const v=round2((seg.start??0)+0.05); if(seg.end<=v+0.03) return; seg.start=v; startInput.value=v.toFixed(2); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    minusEndBtn.addEventListener('click',()=> { if(loadedIndex===-1) return; const seg=heceler[loadedIndex]; const v=round2((seg.end??0)-0.05); if(v<=seg.start+0.03) return; seg.end=v; endInput.value=v.toFixed(2); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    plusEndBtn.addEventListener('click',()=> { if(loadedIndex===-1) return; const seg=heceler[loadedIndex]; seg.end=round2((seg.end??0)+0.05); endInput.value=seg.end.toFixed(2); renderAll(); autoSaveProject(); syncCurrentSongToLibrary(); saveLibrary(); renderLibrary(); });
    previewSelectedBtn.addEventListener('click',()=> { if(loadedIndex===-1) return alert('Önce bir segment seç.'); const seg=heceler[loadedIndex]; if(!seg||seg.start===null||seg.end===null||!hasAudioLoaded()) return; ws.play(seg.start,seg.end); });
    previewPlayBtn.addEventListener('click',()=> { if(!hasAudioLoaded()) return; sequenceStopRequested=true; ws.stop(); ws.play(0); });
    previewStopBtn.addEventListener('click',()=> { if(!hasAudioLoaded()) return; sequenceStopRequested=true; ws.pause(); });
    clearSelectionBtn.addEventListener('click',clearSelection); playLineBtn.addEventListener('click',playSelectedLine);
    measurePlayBtn.addEventListener('click',startMeasure); measureStopBtn.addEventListener('click',stopMeasure); measureResetBtn.addEventListener('click',resetMeasure);
    vocalyCetvelHandle.addEventListener('click',()=>{ if(vocalyCetvelDrawer.classList.contains('open')) closeCetvel(); else openCetvel(); });
    document.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
    document.addEventListener('touchend', e=>{ if(measureSection.classList.contains('hidden')) return; const endX = e.changedTouches[0].clientX; const diff = endX - touchStartX; if(touchStartX < 30 && diff > 60) openCetvel(); if(diff < -60 && vocalyCetvelDrawer.classList.contains('open')) closeCetvel(); }, {passive:true});
    document.addEventListener('keydown',e=>{ const tag=document.activeElement ? document.activeElement.tagName.toLowerCase() : ''; const inInput=tag==='input'||tag==='textarea'||tag==='select'; if(inInput) return; if(e.code==='Space'){ e.preventDefault(); if(hasAudioLoaded()) ws.playPause(); return; } if(e.code==='Escape'){ loadedIndex=-1; selectedSegmentIndexes=[]; renderAll(); updateActiveSegmentLabel(-1); return; } if(e.code==='ArrowRight'){ e.preventDefault(); if(hasAudioLoaded()) seekToTime(ws.getCurrentTime()+0.2); return; } if(e.code==='ArrowLeft'){ e.preventDefault(); if(hasAudioLoaded()) seekToTime(ws.getCurrentTime()-0.2); return; } });
    window.addEventListener('resize',()=> setTimeout(renderAll,50));
  </script>
</body>
