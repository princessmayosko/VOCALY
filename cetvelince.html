<!DOCTYPE html><html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VOCALY Editör</title>
  <script src="https://unpkg.com/wavesurfer.js@6"></script>
  <style>
    :root{
      --bg:#08111f;
      --bg2:#0f1b2d;
      --panel:rgba(12,22,39,.94);
      --line:rgba(255,255,255,.10);
      --text:#eef4ff;
      --muted:#9fb0c9;
      --yellow:#facc15;
      --purple:#8b5cf6;
      --blue:#60a5fa;
      --shadow:0 12px 36px rgba(0,0,0,.32);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:Arial,sans-serif}
    body{min-height:100vh}
    button,input,textarea,select{font:inherit}
    .app{max-width:1380px;margin:0 auto;padding:14px 14px 42px}
    .topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(8,17,31,.96),rgba(8,17,31,.76));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .topbar-inner{max-width:1380px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}
    .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#fde047 0,#facc15 42%,#ca8a04 100%);color:#111827;font-weight:900;box-shadow:0 8px 24px rgba(250,204,21,.22)}
    .brand span{font-size:20px;color:var(--yellow)}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px;margin-top:16px;overflow:hidden}
    .sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .sectionTitle h2{margin:0;font-size:20px}
    .metaRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .miniBar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04);margin-bottom:10px}
    .iconBtn{width:34px;height:34px;border:none;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;padding:0;font-size:15px}
    .iconBtn:hover{background:rgba(255,255,255,.10)}
    .fileLabel{position:relative;overflow:hidden}
    .fileLabel input{position:absolute;inset:0;opacity:0;cursor:pointer}
    #zoom{flex:1;min-width:110px}
    .waveShell{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0c1528;width:100%;max-width:100%}
    #waveform{height:300px;overflow-x:auto;overflow-y:hidden;width:100%;max-width:100%}
    #overlayViewport{position:absolute;top:0;left:0;right:0;height:98px;overflow:hidden;z-index:8;pointer-events:none;background:linear-gradient(180deg,rgba(10,17,33,.97) 0%, rgba(10,17,33,.92) 70%, rgba(10,17,33,0) 100%)}
    #overlayContent{position:absolute;left:0;top:0;height:98px}
    #ruler{position:absolute;left:0;top:0;height:36px;border-bottom:1px solid #24355a;background:linear-gradient(180deg,rgba(13,22,44,.98) 0%, rgba(13,22,44,.92) 100%);pointer-events:auto}
    #segmentStrip{position:absolute;left:0;top:36px;height:50px;pointer-events:auto}
    #stripCursor{position:absolute;top:0;bottom:0;width:2px;background:var(--yellow);opacity:.95;pointer-events:none;z-index:20}
    .ruler-tick{position:absolute;bottom:0;width:1px;background:#4a5f8e}
    .ruler-tick.major{height:24px;background:#9fb0d8}
    .ruler-tick.medium{height:15px;background:#6f84b4}
    .ruler-tick.minor{height:8px;background:#43577f}
    .ruler-label{position:absolute;top:4px;transform:translateX(-50%);font-size:10px;color:#dce8ff;white-space:nowrap;font-weight:700}
    .strip-block{position:absolute;top:8px;height:32px;border-radius:10px;background:#1c2b52;border:1px solid #3c57a1;color:#eef4ff;min-width:34px;overflow:hidden;touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
    .strip-block.intro{background:#4b3a0d;border-color:#b38a17;color:#fde68a}
    .strip-block.active{box-shadow:0 0 0 3px rgba(139,92,246,.18);border-color:#c4b5fd}
    .strip-block .body{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
    .strip-block .handle{position:absolute;top:0;bottom:0;width:10px;z-index:2}
    .strip-block .handle.left{left:0;cursor:ew-resize}
    .strip-block .handle.right{right:0;cursor:ew-resize}
    .strip-block .drag{position:absolute;left:10px;right:10px;top:0;bottom:0;cursor:grab}
    .grid{display:block}
    .rowCompact{display:grid;grid-template-columns:2fr .8fr 1.2fr 1fr .8fr .8fr .7fr auto;gap:8px;align-items:center;margin-top:10px}.rowCompact > *{min-width:0}
    .rowCompact input,.rowCompact select{padding:10px 11px;border-radius:12px;border:1px solid #334267;background:#0f1830;color:#eef4ff}
    textarea{width:100%;margin-top:10px;min-height:110px;padding:12px;border-radius:14px;border:1px solid #334267;background:#0f1830;color:#eef4ff;resize:vertical;line-height:1.5}
    .smallBtn{padding:10px 12px;border:none;border-radius:12px;background:rgba(255,255,255,.08);color:var(--text);cursor:pointer}
    .smallBtn.primary{background:linear-gradient(135deg,var(--purple),#6d28d9)}
    .statusPills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .pill{padding:8px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted)}
    #karaoke{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;padding:12px;border:1px dashed rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.03);min-height:110px;max-height:300px;overflow:auto}
    .karaokeBox{position:relative;overflow:hidden;min-width:74px;padding:12px 14px;border-radius:14px;background:#192749;border:1px solid #31497e;font-weight:700;cursor:pointer;user-select:none;transition:.15s ease;flex:0 0 auto}
    .karaokeBox .fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:rgba(139,92,246,.18);pointer-events:none;transition:width .05s linear}
    .karaokeBox .label{position:relative;z-index:1}
    .karaokeBox.active{border-color:#c4b5fd;box-shadow:0 0 0 4px rgba(139,92,246,.12);transform:scale(1.04)}
    .karaokeBox.intro{background:#4b3a0d;border-color:#b38a17;color:#fde68a}
    .karaokeBox.intro .fill{background:rgba(250,204,21,.18)}
    .karaokeBox.selected{box-shadow:0 0 0 4px rgba(96,165,250,.16);border-color:var(--blue)}
    .lineBreak{flex-basis:100%;height:0;width:0}
    #status{color:var(--muted);font-size:14px}
    @media (max-width:980px){.grid{grid-template-columns:1fr}.rowCompact{grid-template-columns:1fr 1fr}.rowCompact > *:last-child{grid-column:1 / -1}#waveform{height:240px}.waveShell{width:100%}.miniBar{gap:5px}}/* VOCALY CETVEL */
#vocalyCetvel{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:11vw;
  min-width:72px;
  max-width:96px;
  background:linear-gradient(180deg,rgba(8,17,31,.97),rgba(12,22,39,.98));
  border-right:1px solid rgba(255,255,255,.08);
  box-shadow:none;
  transform:translateX(calc(-100% + 18px));
  transition:transform .22s ease;
  z-index:120;
  display:flex;
  flex-direction:column;
  padding:10px 6px 10px 6px;
  gap:2px;
}
#vocalyCetvel.open{transform:translateX(0);box-shadow:18px 0 44px rgba(0,0,0,.38)}
#vocalyCetvelHandle{
  position:absolute;
  right:-18px;
  top:50%;
  transform:translateY(-50%);
  writing-mode:vertical-rl;
  text-orientation:mixed;
  border-radius:0 12px 12px 0;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.09);
  border-left:none;
  color:#dbe6ff;
  font-size:12px;
  font-weight:800;
  letter-spacing:.4px;
  padding:10px 3px;
  cursor:pointer;
  user-select:none;
  backdrop-filter:blur(8px);
}
.cetvelBlock{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.035);
  font-weight:800;
  line-height:1;
  color:#dce7ff;
  overflow:hidden;
}
.cetvelBlock.main{
  min-height:48px;
  font-size:15px;
}
.cetvelBlock.chromatic{
  min-height:26px;
  font-size:10px;
  opacity:.78;
}
.cetvel-do{color:#ef7373}
.cetvel-dosharp{color:#d58bd7}
.cetvel-re{color:#efb282}
.cetvel-resharp{color:#b4d28a}
.cetvel-mi{color:#f1d76a}
.cetvel-fa{color:#7fd788}
.cetvel-fasharp{color:#6fe0c1}
.cetvel-sol{color:#6fd8f0}
.cetvel-solsharp{color:#87b6ff}
.cetvel-la{color:#8da4ff}
.cetvel-lasharp{color:#b191ff}
.cetvel-si{color:#ff9ed1}
.cetvelBlock.active{
  box-shadow:0 0 0 2px rgba(250,204,21,.26) inset,0 0 18px rgba(250,204,21,.12);
  background:rgba(250,204,21,.10);
}
.cetvelMeta{
  padding:6px 4px 8px 4px;
  border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:4px;
}
.cetvelMetaTitle{
  font-size:10px;
  color:#9fb0c9;
  text-align:center;
  margin-bottom:4px;
  letter-spacing:.4px;
}
.cetvelTarget{
  min-height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07);
  font-size:12px;
  font-weight:800;
  color:#eef4ff;
}
@media (max-width:680px){
  #vocalyCetvel{width:11.5vw;min-width:70px;max-width:88px}
  .cetvelBlock.main{min-height:44px;font-size:14px}
  .cetvelBlock.chromatic{min-height:24px;font-size:9px}
}

</style>
</head>

  <div class="topbar">

  </div>  <div class="app">
    <div class="card">

  </div>
</div>

<div class="grid">
  <div class="card">

  </div>  <script>
    let ws = null;
    let heceler = [];
    let loadedIndex = -1;
    let currentAudioName = 'audio.mp3';
    let cursorTime = 0;
    let objectUrlRef = null;
    let dragState = null;
    let wrapperBound = false;
    let selectedSegmentIndexes = [];
    let sequenceStopRequested = false;
    const PROJECT_AUTOSAVE_KEY = 'vocaly_editor_clean_v1';

    const titleInput = document.getElementById('titleInput');
    const audioFile = document.getElementById('audioFile');
    const importJsonInput = document.getElementById('importJsonInput');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const zoom = document.getElementById('zoom');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const introInput = document.getElementById('intro');
    const startInput = document.getElementById('start');
    const endInput = document.getElementById('end');
    const heceInput = document.getElementById('hece');
    const notaInput = document.getElementById('nota');
    const satirInput = document.getElementById('satir');
    const splitWordsBtn = document.getElementById('splitWordsBtn');
    const autoTimingBtn = document.getElementById('autoTimingBtn');
    const saveProjectBtn = document.getElementById('saveProjectBtn');
    const resetTimingBtn = document.getElementById('resetTimingBtn');
    const saveBtn = document.getElementById('saveBtn');
    const updateBtn = document.getElementById('updateBtn');
    const deleteLoadedBtn = document.getElementById('deleteLoadedBtn');
    const lyricsInput = document.getElementById('lyricsInput');
    const minusStartBtn = document.getElementById('minusStartBtn');
    const plusStartBtn = document.getElementById('plusStartBtn');
    const minusEndBtn = document.getElementById('minusEndBtn');
    const plusEndBtn = document.getElementById('plusEndBtn');
    const previewSelectedBtn = document.getElementById('previewSelectedBtn');
    const previewPlayBtn = document.getElementById('previewPlayBtn');
    const previewStopBtn = document.getElementById('previewStopBtn');
    const clearSelectionBtn = document.getElementById('clearSelectionBtn');
    const playLineBtn = document.getElementById('playLineBtn');
    const timeText = document.getElementById('timeText');
    const cursorText = document.getElementById('cursorText');
    const activeSegmentText = document.getElementById('activeSegmentText');
    const overlayViewport = document.getElementById('overlayViewport');
    const overlayContent = document.getElementById('overlayContent');
    const ruler = document.getElementById('ruler');
    const segmentStrip = document.getElementById('segmentStrip');
    const stripCursor = document.getElementById('stripCursor');
    const karaoke = document.getElementById('karaoke');

    function clamp(v,min,max){ return Math.max(min, Math.min(max,v)); }
    function round2(v){ return Number((v || 0).toFixed(2)); }
    function escapeHtml(str){ return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }
    function getIntroValue(){ const v=parseFloat(introInput.value); return isNaN(v)?0:round2(v); }
    function splitWordsFromText(text){ const lines=String(text||'').split(/\n/).map(x=>x.trim()); const out=[]; lines.forEach((line,lineIndex)=>{ if(!line) return; line.split(/\s+/).filter(Boolean).forEach(word=> out.push({text:word,line:lineIndex+1})); }); return out; }
    function hasAudioLoaded(){ return !!(ws && ws.getDuration && ws.getDuration()>0); }
    function getWaveWrapper(){ return ws && ws.drawer ? ws.drawer.wrapper : null; }
    function getWaveInner(){ const wrapper=getWaveWrapper(); return wrapper ? (wrapper.querySelector('.wavesurfer-wave') || wrapper.firstElementChild) : null; }
    function getScrollableWidth(){ const inner=getWaveInner(); if(inner && inner.scrollWidth) return inner.scrollWidth; const wrapper=getWaveWrapper(); if(wrapper && wrapper.scrollWidth) return wrapper.scrollWidth; return overlayViewport.clientWidth || 1; }
    function getVisibleWidth(){ const wrapper=getWaveWrapper(); return wrapper ? wrapper.clientWidth : (overlayViewport.clientWidth || 1); }
    function getScrollLeft(){ const wrapper=getWaveWrapper(); return wrapper ? wrapper.scrollLeft : 0; }
    function getDurationSafe(){ return hasAudioLoaded() ? ws.getDuration() : 1; }
    function getPxPerSec(){ return getScrollableWidth()/getDurationSafe(); }
    function timeToPx(t){ return t * getPxPerSec(); }
    function pxToTime(px){ return px / getPxPerSec(); }
    function seekToTime(t){ if(!hasAudioLoaded()) return; const d=ws.getDuration(); const c=clamp(t,0,d); ws.seekTo(d ? c/d : 0); setCursorTime(c); }
    function setCursorTime(t){ cursorTime=clamp(round2(t||0),0,hasAudioLoaded()?ws.getDuration():999999); cursorText.textContent='Cursor: '+cursorTime.toFixed(2)+' sn'; updateStripCursor(); }
    function scrollToTime(t){ const wrapper=getWaveWrapper(); if(!wrapper || !hasAudioLoaded()) return; const x=timeToPx(t); wrapper.scrollLeft=clamp(x-wrapper.clientWidth*0.35,0,wrapper.scrollWidth-wrapper.clientWidth); syncOverlayPosition(); }
    function syncOverlayPosition(){ const wrapper=getWaveWrapper(); if(!wrapper) return; overlayContent.style.transform='translateX(' + (-wrapper.scrollLeft) + 'px)'; updateStripCursor(); }
    function updateStripCursor(){ if(!hasAudioLoaded()){ stripCursor.style.left='0px'; return; } stripCursor.style.left=(timeToPx(cursorTime)-getScrollLeft())+'px'; }
    function getOrderedTimedSegments(){ return heceler.map((s,i)=>({s:s,i:i})).filter(x=>x.s.start!==null && x.s.end!==null).sort((a,b)=>a.s.start-b.s.start); }
    function updateActiveSegmentLabel(index=-1){ activeSegmentText.textContent = index===-1 || !heceler[index] ? 'Aktif: -' : 'Aktif: ' + heceler[index].text; }
    function normalizeIntroSegment(){ const intro=getIntroValue(); const idx=heceler.findIndex(h=>h.isIntro); if(idx===-1){ heceler.unshift({text:'INTRO',note:'',start:0,end:intro,line:0,isIntro:true}); } else { heceler[idx].text='INTRO'; heceler[idx].start=0; heceler[idx].end=intro; heceler[idx].line=0; heceler[idx].isIntro=true; } }
    function parseLyricsToSegmentsPreserve(){ const parsed=splitWordsFromText(lyricsInput.value); const oldWords=heceler.filter(h=>!h.isIntro); const introSeg=heceler.find(h=>h.isIntro)||{text:'INTRO',note:'',start:0,end:getIntroValue(),line:0,isIntro:true}; const next=[{text:'INTRO',note:introSeg.note||'',start:0,end:getIntroValue(),line:0,isIntro:true}]; parsed.forEach((w,i)=>{ const old=oldWords[i]; next.push({ text:w.text, note:old?old.note||'':'', start:old?old.start:null, end:old?old.end:null, line:w.line, isIntro:false }); }); heceler=next; selectedSegmentIndexes=[]; }
    function renderRuler(){ ruler.innerHTML=''; const duration=getDurationSafe(); const totalWidth=Math.max(getScrollableWidth(), getVisibleWidth()); ruler.style.width=totalWidth+'px'; segmentStrip.style.width=totalWidth+'px'; overlayContent.style.width=totalWidth+'px'; for(let t=0;t<=duration+0.0001;t+=0.25){ const tf=round2(t); const x=timeToPx(tf); const tick=document.createElement('div'); let cls='minor'; if(Math.abs(tf-Math.round(tf))<0.001) cls='major'; else if(Math.abs((tf/0.5)-Math.round(tf/0.5))<0.001) cls='medium'; tick.className='ruler-tick '+cls; tick.style.left=x+'px'; ruler.appendChild(tick); if(cls==='major'){ const label=document.createElement('div'); label.className='ruler-label'; label.style.left=x+'px'; label.textContent=tf.toFixed(1)+'s'; ruler.appendChild(label); } } }
    function renderStrip(){ segmentStrip.innerHTML=''; const ordered=getOrderedTimedSegments(); ordered.forEach(item=>{ const seg=item.s; const left=timeToPx(seg.start); const width=Math.max(34, timeToPx(seg.end)-timeToPx(seg.start)); const block=document.createElement('div'); block.className='strip-block'+(seg.isIntro?' intro':'')+(item.i===loadedIndex?' active':''); block.style.left=left+'px'; block.style.width=width+'px'; block.dataset.index=item.i; block.innerHTML='<div class="handle left"></div><div class="drag"></div><div class="handle right"></div><div class="body">'+escapeHtml(seg.text)+'</div>'; block.addEventListener('click',e=>{ e.stopPropagation(); if(!dragState) seekToSegment(item.i,true); }); block.querySelector('.drag').addEventListener('pointerdown',e=>startDrag(e,item.i,'move')); block.querySelector('.handle.left').addEventListener('pointerdown',e=>startDrag(e,item.i,'resize-left')); block.querySelector('.handle.right').addEventListener('pointerdown',e=>startDrag(e,item.i,'resize-right')); segmentStrip.appendChild(block); }); }
    function renderKaraoke(){ const sorted=heceler.map((seg,idx)=>({seg:seg,idx:idx})).filter(x=>!x.seg.isIntro && x.seg.start!==null && x.seg.end!==null).sort((a,b)=>a.seg.start-b.seg.start); if(sorted.length===0){ karaoke.innerHTML=''; return; } karaoke.innerHTML=''; const intro=heceler.find(h=>h.isIntro); if(intro && intro.end!==null && intro.end>0){ const introBox=document.createElement('div'); introBox.className='karaokeBox intro'; introBox.id='karaoke-intro'; introBox.innerHTML='<div class="fill"></div><div class="label">Intro '+intro.end.toFixed(2)+' sn</div>'; introBox.onclick=()=> hasAudioLoaded() && ws.play(0,intro.end); karaoke.appendChild(introBox); const br=document.createElement('div'); br.className='lineBreak'; karaoke.appendChild(br); } let lastLine=null; sorted.forEach((item,sortedIndex)=>{ if(lastLine!==null && item.seg.line!==lastLine){ const br=document.createElement('div'); br.className='lineBreak'; karaoke.appendChild(br); } const btn=document.createElement('div'); btn.className='karaokeBox'+(selectedSegmentIndexes.includes(item.idx)?' selected':''); btn.id='karaoke-box-'+sortedIndex; btn.dataset.realIndex=item.idx; const noteSmall=item.seg.note?' <span style="opacity:.72;font-size:12px;">('+escapeHtml(item.seg.note)+')</span>':''; btn.innerHTML='<div class="fill"></div><div class="label">'+escapeHtml(item.seg.text)+noteSmall+'</div>'; btn.onclick=()=> playSingleKaraokeSegment(item.idx); karaoke.appendChild(btn); lastLine=item.seg.line; }); }
    function renderAll(){ normalizeIntroSegment(); renderRuler(); renderStrip(); renderKaraoke(); syncOverlayPosition(); if(loadedIndex > -1 && heceler[loadedIndex]) setCetvelTarget(heceler[loadedIndex].note || ''); else setCetvelTarget(''); }
    function seekToSegment(index,playSnippet=false){ const seg=heceler[index]; if(!seg) return; loadedIndex=index; updateActiveSegmentLabel(index); heceInput.value=seg.text; notaInput.value=seg.note||''; satirInput.value=seg.line||''; startInput.value=seg.start!==null ? seg.start.toFixed(2) : ''; endInput.value=seg.end!==null ? seg.end.toFixed(2) : ''; setCetvelTarget(seg.note || ''); if(seg.start!==null && hasAudioLoaded()){ seekToTime(seg.start); scrollToTime(seg.start); } renderStrip(); if(playSnippet && hasAudioLoaded() && seg.start!==null && seg.end!==null) ws.play(seg.start,seg.end); }
    function startDrag(e,index,mode){ e.preventDefault(); e.stopPropagation(); const seg=heceler[index]; if(!seg||seg.start===null||seg.end===null) return; dragState={index:index,mode:mode,startX:e.clientX,origStart:seg.start,origEnd:seg.end}; document.addEventListener('pointermove',onDragMove,{passive:false}); document.addEventListener('pointerup',endDrag); document.addEventListener('pointercancel',endDrag); }
    function onDragMove(e){
      if(!dragState) return;
      e.preventDefault();

      const seg = heceler[dragState.index];
      const deltaPx = e.clientX - dragState.startX;
      const deltaTime = pxToTime(deltaPx);
      const minLen = 0.03;
      const duration = hasAudioLoaded() ? ws.getDuration() : Infinity;

      const ordered = getOrderedTimedSegments();
      const pos = ordered.findIndex(x => x.i === dragState.index);
      const prev = pos > 0 ? ordered[pos - 1].s : null;
      const next = pos < ordered.length - 1 ? ordered[pos + 1].s : null;

      if(dragState.mode === 'move'){
        if(seg.isIntro) return;

        const len = dragState.origEnd - dragState.origStart;
        let newStart = dragState.origStart + deltaTime;
        let newEnd = newStart + len;

        if(prev && prev.end !== null){
          newStart = Math.max(newStart, prev.end);
          newEnd = newStart + len;
        }

        if(next && next.start !== null){
          newEnd = Math.min(newEnd, next.start);
          newStart = newEnd - len;
        }

        if(newStart < 0){
          newStart = 0;
          newEnd = len;
        }

        if(newEnd > duration){
          newEnd = duration;
          newStart = Math.max(0, newEnd - len);
        }

        seg.start = round2(newStart);
        seg.end = round2(newEnd);
      }

      else if(dragState.mode === 'resize-left'){
        let newStart = dragState.origStart + deltaTime;

        if(seg.isIntro) newStart = 0;
        if(prev && prev.end !== null){
          newStart = Math.max(newStart, prev.end);
        }
        if(seg.end <= newStart + minLen){
          newStart = seg.end - minLen;
        }

        seg.start = round2(newStart);
      }

      else if(dragState.mode === 'resize-right'){
        let newEnd = dragState.origEnd + deltaTime;
        if(newEnd > duration) newEnd = duration;
        if(newEnd <= seg.start + minLen){
          newEnd = seg.start + minLen;
        }

        const diff = round2(newEnd - seg.end);
        seg.end = round2(newEnd);

        if(seg.isIntro){
          introInput.value = seg.end.toFixed(2);
        }

        if(diff !== 0 && pos !== -1){
          for(let i = pos + 1; i < ordered.length; i++){
            const cur = ordered[i].s;
            const len = Math.max(minLen, round2(cur.end - cur.start));
            cur.start = round2(cur.start + diff);
            cur.end = round2(cur.start + len);

            if(cur.end > duration){
              cur.end = round2(duration);
              if(cur.end <= cur.start) cur.start = round2(Math.max(0, cur.end - minLen));
            }
          }

          for(let i = pos + 1; i < ordered.length; i++){
            const prevSeg = ordered[i - 1].s;
            const cur = ordered[i].s;
            const len = Math.max(minLen, round2(cur.end - cur.start));
            cur.start = round2(prevSeg.end);
            cur.end = round2(cur.start + len);
          }
        }
      }

      startInput.value = seg.start.toFixed(2);
      endInput.value = seg.end.toFixed(2);
      renderStrip();
      renderKaraoke();
    }

    function endDrag(){ if(!dragState) return; const idx=dragState.index; dragState=null; document.removeEventListener('pointermove',onDragMove); document.removeEventListener('pointerup',endDrag); document.removeEventListener('pointercancel',endDrag); renderAll(); seekToSegment(idx,false); autoSaveProject(); }
    function karaokePlaybackUpdate(time){ const sorted=heceler.map((seg,idx)=>({seg:seg,idx:idx})).filter(x=>!x.seg.isIntro && x.seg.start!==null && x.seg.end!==null).sort((a,b)=>a.seg.start-b.seg.start); document.querySelectorAll('.karaokeBox').forEach(el=>{ el.classList.remove('active'); const fill=el.querySelector('.fill'); if(fill) fill.style.width='0%'; }); const intro=heceler.find(h=>h.isIntro); if(intro && intro.end!==null && intro.end>0){ const introEl=document.getElementById('karaoke-intro'); if(introEl){ const fill=introEl.querySelector('.fill'); if(time<=intro.end){ introEl.classList.add('active'); fill.style.width=Math.max(0,Math.min(100,(time/intro.end)*100))+'%'; } else fill.style.width='100%'; } } sorted.forEach((item,i)=>{ const el=document.getElementById('karaoke-box-'+i); if(!el) return; const fill=el.querySelector('.fill'); const h=item.seg; if(time>=h.start && time<=h.end){ el.classList.add('active'); fill.style.width=Math.max(0,Math.min(100,((time-h.start)/(h.end-h.start))*100))+'%'; } else if(time>h.end){ fill.style.width='100%'; } if(selectedSegmentIndexes.includes(item.idx)) el.classList.add('selected'); }); }
    function playSingleKaraokeSegment(index){ const seg=heceler[index]; if(!seg||seg.start===null||seg.end===null||!hasAudioLoaded()) return; selectedSegmentIndexes=[index]; renderKaraoke(); seekToSegment(index,true); }
    function clearSelection(){ selectedSegmentIndexes=[]; renderKaraoke(); }
    function selectWholeLine(lineNo){ selectedSegmentIndexes=heceler.map((seg,idx)=>({seg:seg,idx:idx})).filter(x=>!x.seg.isIntro && x.seg.line===lineNo && x.seg.start!==null && x.seg.end!==null).map(x=>x.idx); renderKaraoke(); }
    async function playSegmentsSequentially(indexes){ if(!hasAudioLoaded() || !indexes.length) return; sequenceStopRequested=false; const ordered=indexes.map(i=>({i:i,seg:heceler[i]})).filter(x=>x.seg&&x.seg.start!==null&&x.seg.end!==null).sort((a,b)=>a.seg.start-b.seg.start); for(const item of ordered){ if(sequenceStopRequested) break; selectedSegmentIndexes=[item.i]; renderKaraoke(); seekToSegment(item.i,false); ws.play(item.seg.start,item.seg.end); await new Promise(resolve=>setTimeout(resolve, Math.max(40, ((item.seg.end-item.seg.start)*1000)+50))); } }
    function playSelectedLine(){ if(!selectedSegmentIndexes.length){ alert('Önce bir kelime seç.'); return; } const first=heceler[selectedSegmentIndexes[0]]; if(!first) return; selectWholeLine(first.line); playSegmentsSequentially(selectedSegmentIndexes); }
    function buildProjectPayload(){ return { version:1, title:titleInput.value.trim(), intro:getIntroValue(), lyrics:lyricsInput.value, audioName:currentAudioName, selectedSegmentIndexes:selectedSegmentIndexes, heceler:heceler.map(h=>({text:h.text||'',note:h.note||'',start:h.start??null,end:h.end??null,line:h.line??0,isIntro:!!h.isIntro})), cursorTime:cursorTime }; }
    function applyProjectPayload(parsed){ titleInput.value=parsed.title||''; introInput.value=Number(parsed.intro||0).toFixed(2); lyricsInput.value=parsed.lyrics||''; currentAudioName=parsed.audioName||'audio.mp3'; selectedSegmentIndexes=Array.isArray(parsed.selectedSegmentIndexes)?parsed.selectedSegmentIndexes:[]; heceler=Array.isArray(parsed.heceler)?parsed.heceler.map(h=>({text:h.text||'',note:h.note||'',start:h.start??null,end:h.end??null,line:h.line??0,isIntro:!!h.isIntro})):[]; cursorTime=parsed.cursorTime||0; loadedIndex=-1; normalizeIntroSegment(); renderAll(); setCursorTime(cursorTime); if(hasAudioLoaded()) scrollToTime(cursorTime); }
    function saveProject(){ const payload=buildProjectPayload(); localStorage.setItem(PROJECT_AUTOSAVE_KEY, JSON.stringify(payload)); const blob=new Blob([JSON.stringify(payload,null,2)], {type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=((payload.title||'vocaly_editor').replace(/[^\w\u00C0-\u024F-]+/g,'_'))+'.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
    function autoSaveProject(){ localStorage.setItem(PROJECT_AUTOSAVE_KEY, JSON.stringify(buildProjectPayload())); }
    function loadProject(){ const raw=localStorage.getItem(PROJECT_AUTOSAVE_KEY); if(!raw) return; try{ applyProjectPayload(JSON.parse(raw)); }catch(err){ console.error(err); } }
    function importProjectFromJsonText(text){ try{ applyProjectPayload(JSON.parse(text)); autoSaveProject(); }catch(err){ console.error(err); alert('JSON okunamadı.'); } }
    function initWave(){ ws = WaveSurfer.create({ container:'#waveform', waveColor:'#4a5f8e', progressColor:'#facc15', cursorColor:'#facc15', height:300, normalize:true, responsive:true, scrollParent:true, minPxPerSec:Number(zoom.value) }); ws.on('ready',()=>{ ws.zoom(Number(zoom.value)); bindWrapperEvents(); setCursorTime(ws.getCurrentTime()); normalizeIntroSegment(); renderAll(); }); ws.on('audioprocess',()=>{ const now=ws.getCurrentTime(); timeText.textContent=now.toFixed(2)+' sn'; setCursorTime(now); karaokePlaybackUpdate(now); syncOverlayPosition(); }); ws.on('seek',p=>{ const now=(ws.getDuration()||0)*p; timeText.textContent=now.toFixed(2)+' sn'; setCursorTime(now); karaokePlaybackUpdate(now); syncOverlayPosition(); }); ws.on('pause',()=>{ const now=ws.getCurrentTime(); setCursorTime(now); karaokePlaybackUpdate(now); syncOverlayPosition(); }); ws.on('finish',()=>{ karaokePlaybackUpdate(ws.getDuration()); }); ws.on('zoom',()=>{ renderAll(); syncOverlayPosition(); }); }
    function bindWaveformDrag(){ const wrapper=getWaveWrapper(); if(!wrapper) return; wrapper.addEventListener('pointerdown',e=>{ if(e.target.closest('.handle') || e.target.closest('.strip-block')) return; wrapper._drag={startX:e.clientX,startScroll:wrapper.scrollLeft}; }); wrapper.addEventListener('pointermove',e=>{ if(!wrapper._drag) return; const dx=e.clientX-wrapper._drag.startX; wrapper.scrollLeft=wrapper._drag.startScroll-dx; syncOverlayPosition(); }); const end=()=> wrapper._drag=null; wrapper.addEventListener('pointerup',end); wrapper.addEventListener('pointercancel',end); wrapper.addEventListener('scroll',syncOverlayPosition,{passive:true}); }
    function bindWrapperEvents(){ if(wrapperBound) return; const wrapper=getWaveWrapper(); if(!wrapper) return; bindWaveformDrag(); wrapperBound=true; }
    initWave();
    renderAll();
    setCursorTime(0);
    loadProject();
    audioFile.addEventListener('change',e=>{ const file=e.target.files[0]; if(!file) return; currentAudioName=file.name; if(objectUrlRef) URL.revokeObjectURL(objectUrlRef); objectUrlRef=URL.createObjectURL(file); ws.load(objectUrlRef); });
    importJsonInput.addEventListener('change',e=>{ const file=e.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=()=> importProjectFromJsonText(reader.result); reader.readAsText(file,'utf-8'); importJsonInput.value=''; });
    playBtn.addEventListener('click',()=> hasAudioLoaded() && ws.playPause());
    stopBtn.addEventListener('click',()=> { if(hasAudioLoaded()){ ws.stop(); setCursorTime(0); } });
    zoom.addEventListener('input',()=> { if(!hasAudioLoaded()) return; ws.zoom(Number(zoom.value)); setTimeout(renderAll,20); });
    zoomOutBtn.addEventListener('click',()=> { zoom.value=Math.max(40, Number(zoom.value)-20); zoom.dispatchEvent(new Event('input')); });
    zoomInBtn.addEventListener('click',()=> { zoom.value=Math.min(360, Number(zoom.value)+20); zoom.dispatchEvent(new Event('input')); });
    splitWordsBtn.addEventListener('click',()=> { parseLyricsToSegmentsPreserve(); loadedIndex=-1; renderAll(); autoSaveProject(); });
    autoTimingBtn.addEventListener('click',()=> { if(!heceler.length) parseLyricsToSegmentsPreserve(); const words=heceler.filter(h=>!h.isIntro); if(!words.length) return; const intro=getIntroValue(); const duration=hasAudioLoaded()?ws.getDuration():Math.max(intro+words.length*0.8,8); const available=Math.max(0.6,duration-intro); const totalChars=words.reduce((s,w)=>s+Math.max(1,(w.text||'').length),0); let cursor=intro; words.forEach(seg=>{ const weight=Math.max(1,(seg.text||'').length); const segDur=Math.max(0.10, Number(((weight/totalChars)*available).toFixed(2))); seg.start=round2(cursor); seg.end=round2(cursor+segDur); cursor=seg.end; }); renderAll(); autoSaveProject(); });
    saveProjectBtn.addEventListener('click',saveProject);
    resetTimingBtn.addEventListener('click',()=> { normalizeIntroSegment(); heceler.forEach(h=>{ if(h.isIntro){ h.start=0; h.end=getIntroValue(); } else { h.start=null; h.end=null; } }); loadedIndex=-1; selectedSegmentIndexes=[]; renderAll(); autoSaveProject(); });
    saveBtn.addEventListener('click',()=> { const text=heceInput.value.trim(); const note=notaInput.value.trim(); const start=parseFloat(startInput.value); const end=parseFloat(endInput.value); const line=Number(satirInput.value||1); if(!text) return alert('Kelime / hece gir.'); if(!isNaN(start) && !isNaN(end) && end<=start) return alert('End, start’tan büyük olmalı.'); const obj={ text:text, note:note, start:isNaN(start)?null:round2(start), end:isNaN(end)?null:round2(end), line:line, isIntro:false }; if(loadedIndex>-1){ const wasIntro=!!heceler[loadedIndex]?.isIntro; heceler[loadedIndex]={...obj,isIntro:wasIntro}; loadedIndex=-1; } else { heceler.push(obj); } normalizeIntroSegment(); renderAll(); autoSaveProject(); });
    updateBtn.addEventListener('click',()=> { if(loadedIndex===-1) return alert('Önce bir segment seç.'); const seg=heceler[loadedIndex]; const start=parseFloat(startInput.value); const end=parseFloat(endInput.value); if(isNaN(start)||isNaN(end)||end<=start) return alert('Geçerli bir start/end gir.'); seg.text=heceInput.value.trim(); seg.note=notaInput.value.trim(); seg.start=round2(start); seg.end=round2(end); seg.line=Number(satirInput.value||seg.line||1); if(seg.isIntro){ seg.text='INTRO'; seg.start=0; introInput.value=seg.end.toFixed(2); } renderAll(); seekToSegment(loadedIndex,false); autoSaveProject(); });
    deleteLoadedBtn.addEventListener('click',()=> { if(loadedIndex===-1) return alert('Önce bir segment seç.'); if(heceler[loadedIndex]?.isIntro) return alert('Intro silinmez.'); const removed=loadedIndex; heceler.splice(removed,1); loadedIndex=-1; selectedSegmentIndexes=selectedSegmentIndexes.filter(i=>i!==removed).map(i=> i>removed ? i-1 : i); renderAll(); autoSaveProject(); });
    minusStartBtn.addEventListener('click',()=> { if(loadedIndex===-1) return; const seg=heceler[loadedIndex]; const v=Math.max(0, round2((seg.start??0)-0.05)); if(seg.end<=v+0.03) return; seg.start=v; startInput.value=v.toFixed(2); renderAll(); autoSaveProject(); });
    plusStartBtn.addEventListener('click',()=> { if(loadedIndex===-1) return; const seg=heceler[loadedIndex]; const v=round2((seg.start??0)+0.05); if(seg.end<=v+0.03) return; seg.start=v; startInput.value=v.toFixed(2); renderAll(); autoSaveProject(); });
    minusEndBtn.addEventListener('click',()=> { if(loadedIndex===-1) return; const seg=heceler[loadedIndex]; const v=round2((seg.end??0)-0.05); if(v<=seg.start+0.03) return; seg.end=v; endInput.value=v.toFixed(2); renderAll(); autoSaveProject(); });
    plusEndBtn.addEventListener('click',()=> { if(loadedIndex===-1) return; const seg=heceler[loadedIndex]; seg.end=round2((seg.end??0)+0.05); endInput.value=seg.end.toFixed(2); renderAll(); autoSaveProject(); });
    previewSelectedBtn.addEventListener('click',()=> { if(loadedIndex===-1) return alert('Önce bir segment seç.'); const seg=heceler[loadedIndex]; if(!seg||seg.start===null||seg.end===null||!hasAudioLoaded()) return; ws.play(seg.start,seg.end); });
    previewPlayBtn.addEventListener('click',()=> { if(!hasAudioLoaded()) return; sequenceStopRequested=true; ws.stop(); ws.play(0); });
    previewStopBtn.addEventListener('click',()=> { if(!hasAudioLoaded()) return; sequenceStopRequested=true; ws.pause(); });
    clearSelectionBtn.addEventListener('click',clearSelection);
    playLineBtn.addEventListener('click',playSelectedLine);
    document.addEventListener('keydown',e=>{ const tag=document.activeElement ? document.activeElement.tagName.toLowerCase() : ''; const inInput=tag==='input'||tag==='textarea'||tag==='select'; if(inInput) return; if(e.code==='Space'){ e.preventDefault(); if(hasAudioLoaded()) ws.playPause(); return; } if(e.code==='Escape'){ loadedIndex=-1; selectedSegmentIndexes=[]; renderAll(); updateActiveSegmentLabel(-1); return; } if(e.code==='ArrowRight'){ e.preventDefault(); if(hasAudioLoaded()) seekToTime(ws.getCurrentTime()+0.2); return; } if(e.code==='ArrowLeft'){ e.preventDefault(); if(hasAudioLoaded()) seekToTime(ws.getCurrentTime()-0.2); return; } });
    window.addEventListener('resize',()=> setTimeout(renderAll,50));
    const vocalyCetvel = document.getElementById('vocalyCetvel');
    const vocalyCetvelHandle = document.getElementById('vocalyCetvelHandle');
    const cetvelTargetText = document.getElementById('cetvelTargetText');
    function setCetvelTarget(note){
      if(cetvelTargetText) cetvelTargetText.textContent = note && note.trim() ? note : '—';
      document.querySelectorAll('#vocalyCetvel .cetvelBlock').forEach(el=>{
        const n = el.dataset.note || '';
        el.classList.toggle('active', !!note && n === note);
      });
    }
    if(vocalyCetvel && vocalyCetvelHandle){
      vocalyCetvelHandle.addEventListener('click',()=>{
        vocalyCetvel.classList.toggle('open');
      });
    }
  </script></body>
