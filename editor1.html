<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOCALY Editor Test</title>
<style>
:root{
  --text:#111827;
  --blue:#2563eb;
  --shadow:0 10px 28px rgba(0,0,0,0.08);
  --panel:rgba(255,255,255,0.95);
  --border:#e5e7eb;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#f8fafc 0%, #f3f4f6 100%);
  color:var(--text);
  padding:24px;
}
.wrap{max-width:1100px;margin:0 auto}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}
h1{margin-top:0}
.sub{color:#6b7280;font-size:14px;line-height:1.5}
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
  align-items:center;
}
input{
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #d1d5db;
}
button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-weight:700;
}
#waveform{
  height:240px;
  width:100%;
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  margin-top:16px;
}
.status{
  margin-top:14px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.pill{
  padding:8px 12px;
  border-radius:999px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  font-size:13px;
  font-weight:700;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Waveform Test</h1>
    <p class="sub">Önce sadece waveform çalışsın. MP3 yükle, dalga gelsin, sürükleyerek seçim yap, Space ile loop dene.</p>

    <div class="toolbar">
      <input type="file" id="audioFile" accept="audio/*">
      <button id="playBtn">Play / Pause</button>
      <label>Zoom</label>
      <input type="range" id="zoom" min="20" max="300" value="80">
      <input id="start" placeholder="start" step="0.01">
      <input id="end" placeholder="end" step="0.01">
    </div>

    <div class="status">
      <div class="pill" id="statusText">Hazır</div>
      <div class="pill" id="timeText">0.00 sn</div>
    </div>

    <div id="waveform"></div>
  </div>
</div>

<script src="https://unpkg.com/wavesurfer.js@6"></script>
<script src="https://unpkg.com/wavesurfer.js@6/dist/plugin/wavesurfer.regions.min.js"></script>

<script>
let ws = null;
let activeRegion = null;
let loopMode = false;

const audioFile = document.getElementById("audioFile");
const playBtn = document.getElementById("playBtn");
const zoom = document.getElementById("zoom");
const startInput = document.getElementById("start");
const endInput = document.getElementById("end");
const statusText = document.getElementById("statusText");
const timeText = document.getElementById("timeText");

function initWave() {
  ws = WaveSurfer.create({
    container: "#waveform",
    waveColor: "#cbd5e1",
    progressColor: "#2563eb",
    cursorColor: "#111827",
    height: 220,
    normalize: true,
    responsive: true,
    plugins: [
      WaveSurfer.regions.create({})
    ]
  });

  ws.enableDragSelection({
    color: "rgba(37,99,235,0.25)"
  });

  ws.on("ready", function () {
    statusText.textContent = "Ses yüklendi";
    ws.zoom(Number(zoom.value));
  });

  ws.on("error", function (err) {
    console.error(err);
    statusText.textContent = "Hata: waveform yüklenemedi";
  });

  ws.on("audioprocess", function () {
    timeText.textContent = ws.getCurrentTime().toFixed(2) + " sn";
    if (loopMode && activeRegion && ws.getCurrentTime() >= activeRegion.end) {
      ws.play(activeRegion.start);
    }
  });

  ws.on("seek", function () {
    timeText.textContent = ws.getCurrentTime().toFixed(2) + " sn";
  });

  ws.on("region-created", function (region) {
    if (activeRegion && activeRegion !== region) {
      activeRegion.remove();
    }
    activeRegion = region;
    startInput.value = region.start.toFixed(2);
    endInput.value = region.end.toFixed(2);
    statusText.textContent = "Seçim hazır";
  });

  ws.on("region-update-end", function (region) {
    activeRegion = region;
    startInput.value = region.start.toFixed(2);
    endInput.value = region.end.toFixed(2);
  });
}

initWave();

audioFile.addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  statusText.textContent = "Yükleniyor: " + file.name;
  ws.load(url);
});

playBtn.addEventListener("click", function () {
  if (ws) ws.playPause();
});

zoom.addEventListener("input", function () {
  if (ws) ws.zoom(Number(zoom.value));
});

document.addEventListener("keydown", function (e) {
  if (e.code === "Space") {
    const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    e.preventDefault();
    if (!ws || !activeRegion) return;
    loopMode = !loopMode;
    if (loopMode) {
      ws.play(activeRegion.start);
      statusText.textContent = "Loop açık";
    } else {
      statusText.textContent = "Loop kapalı";
    }
  }
});
</script>
</body>
</html>
