
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocaly Defter v3</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#151b24;
      color:#f3f3f3;
    }
    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:14px;
    }
    .toolbar{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-bottom:14px;
    }
    .card{
      background:#222b37;
      border:1px solid #314051;
      border-radius:18px;
      padding:14px;
      box-shadow:0 8px 24px rgba(0,0,0,.14);
    }
    .row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
    }
    button, select, input{
      font:inherit;
    }
    button{
      border:none;
      border-radius:14px;
      background:#3a4658;
      color:#fff;
      padding:12px 18px;
      font-size:16px;
      cursor:pointer;
    }
    button.active{
      background:#d3a100;
      color:#111;
      font-weight:700;
    }
    button:hover{opacity:.96}
    .tempo-box{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:280px;
    }
    .tempo-box input[type="range"]{
      flex:1;
    }

    details.settings{
      margin-bottom:14px;
      overflow:hidden;
    }
    details.settings summary{
      list-style:none;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:18px;
      font-weight:700;
    }
    details.settings summary::-webkit-details-marker{display:none}
    .arrow{transition:transform .2s ease}
    details[open] .arrow{transform:rotate(180deg)}
    .settings-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
      gap:12px;
      margin-top:14px;
    }
    .field{
      background:#1b2330;
      border:1px solid #314051;
      border-radius:14px;
      padding:12px;
    }
    .field label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      opacity:.92;
    }
    .field select, .field input[type="text"]{
      width:100%;
      border:none;
      border-radius:10px;
      padding:11px 12px;
      background:#38465a;
      color:#fff;
      font-size:15px;
    }

    .staff-shell{
      background:#cfcfcf;
      border-radius:28px;
      padding:18px;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
      overflow:auto;
      border:1px solid rgba(255,255,255,.2);
    }
    svg{
      display:block;
      background:#d4d4d4;
      border-radius:22px;
      touch-action:none;
    }
    .status{
      margin-top:12px;
      background:#222b37;
      border:1px solid #314051;
      border-radius:14px;
      padding:12px 14px;
      color:#e7e7e7;
    }
    .bottom{
      margin-top:14px;
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
    }
    .hint{
      font-size:13px;
      opacity:.85;
      margin-top:8px;
      line-height:1.4;
    }
    .piano-wrap{overflow:auto}
    .piano{
      position:relative;
      height:170px;
      min-width:980px;
      user-select:none;
    }
    .white-key{
      position:absolute;
      width:68px;
      height:170px;
      background:linear-gradient(to bottom,#fff,#dfdfdf);
      border:1px solid #444;
      border-radius:0 0 8px 8px;
      cursor:pointer;
    }
    .black-key{
      position:absolute;
      width:40px;
      height:100px;
      background:linear-gradient(to bottom,#1d1d1d,#000);
      border:1px solid #333;
      border-radius:0 0 6px 6px;
      z-index:3;
      cursor:pointer;
    }
    .active-key{
      background:linear-gradient(to bottom,#ffd95a,#d3a100)!important;
    }
    @media (max-width:768px){
      .wrap{padding:10px}
      button{padding:11px 15px;font-size:15px}
      .tempo-box{min-width:unset;width:100%}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div class="card row">
        <button id="modeSelectBtn" class="active">Seç</button>
        <button id="modeAddBtn">Nota Ekle</button>
        <button id="modeDeleteBtn">Sil</button>
      </div>

      <div class="card row">
        <button id="playBtn">▶ Oynat</button>
        <button id="stopBtn">■ Durdur</button>
        <button id="clearBtn">Temizle</button>
      </div>

      <div class="card tempo-box">
        <span style="font-size:18px;">Tempo</span>
        <input id="tempoRange" type="range" min="60" max="180" value="120">
        <span id="tempoLabel" style="font-size:18px;">120</span>
      </div>
    </div>

    <details class="settings card" open>
      <summary>
        <span>Nota ve Ölçü Ayarları</span>
        <span class="arrow">⌄</span>
      </summary>

      <div class="settings-grid">
        <div class="field">
          <label for="durationSelect">Nota Değeri</label>
          <select id="durationSelect">
            <option value="1">Sekizlik</option>
            <option value="2" selected>Çeyrek</option>
            <option value="4">Yarım</option>
            <option value="8">Tam</option>
          </select>
        </div>

        <div class="field">
          <label for="measureCountSelect">Ölçü Sayısı</label>
          <select id="measureCountSelect">
            <option value="2">2 ölçü</option>
            <option value="4" selected>4 ölçü</option>
            <option value="6">6 ölçü</option>
            <option value="8">8 ölçü</option>
            <option value="12">12 ölçü</option>
          </select>
        </div>

        <div class="field">
          <label for="meterTopSelect">Ölçü Üst Sayısı</label>
          <select id="meterTopSelect">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
        </div>

        <div class="field">
          <label for="meterBottomSelect">Ölçü Alt Sayısı</label>
          <select id="meterBottomSelect">
            <option value="2">2</option>
            <option value="4" selected>4</option>
            <option value="8">8</option>
          </select>
        </div>

        <div class="field">
          <label for="syllableInput">Seçili Nota Hece</label>
          <input id="syllableInput" type="text" placeholder="Seçili notaya hece yaz...">
        </div>
      </div>
      <div class="hint">
        Porteye tıklayarak nota ekleyebilirsin. Seç modunda notayı sürükleyerek sağa-sola ve yukarı-aşağı taşıyabilirsin.
        Seçili notada nota değeri kutusunu değiştirirsen, o notanın süresi güncellenir.
      </div>
    </details>

    <div class="staff-shell">
      <svg id="staffSvg" width="1700" height="430" viewBox="0 0 1700 430"></svg>
    </div>

    <div class="status" id="statusBox">Hazır.</div>

    <div class="bottom">
      <div class="card piano-wrap">
        <div style="margin-bottom:8px;font-weight:700;">Piyano ile Nota Giriş</div>
        <div class="piano" id="piano"></div>
      </div>
    </div>
  </div>

<script>
(() => {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  const svg = document.getElementById("staffSvg");
  const statusBox = document.getElementById("statusBox");
  const tempoRange = document.getElementById("tempoRange");
  const tempoLabel = document.getElementById("tempoLabel");
  const durationSelect = document.getElementById("durationSelect");
  const measureCountSelect = document.getElementById("measureCountSelect");
  const meterTopSelect = document.getElementById("meterTopSelect");
  const meterBottomSelect = document.getElementById("meterBottomSelect");
  const syllableInput = document.getElementById("syllableInput");

  const state = {
    mode: "select",
    tempo: 120,
    selectedDuration: 2,
    measureCount: 4,
    meterTop: 4,
    meterBottom: 4,
    notes: [],
    selectedNoteId: null,
    playTimers: [],
    dragId: null,
    dragMoved: false,
  };

  const staffTop = 125;
  const lineGap = 16;
  const startX = 170;
  const unitWidth = 38; // sekizlik grid
  const topLineY = staffTop;
  const bottomLineY = staffTop + lineGap * 4;

  const pitchMap = [
    { name:"C6", midi:84, y:staffTop - 56 },
    { name:"B5", midi:83, y:staffTop - 48 },
    { name:"A5", midi:81, y:staffTop - 40 },
    { name:"G5", midi:79, y:staffTop - 32 },
    { name:"F5", midi:77, y:staffTop - 24 },
    { name:"E5", midi:76, y:staffTop - 16 },
    { name:"D5", midi:74, y:staffTop - 8  },
    { name:"C5", midi:72, y:staffTop     },
    { name:"B4", midi:71, y:staffTop + 8  },
    { name:"A4", midi:69, y:staffTop + 16 },
    { name:"G4", midi:67, y:staffTop + 24 },
    { name:"F4", midi:65, y:staffTop + 32 },
    { name:"E4", midi:64, y:staffTop + 40 },
    { name:"D4", midi:62, y:staffTop + 48 },
    { name:"C4", midi:60, y:staffTop + 56 }
  ];

  function uuid(){
    return crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
  }

  function ensureAudio(){
    if(!audioCtx) audioCtx = new AudioCtx();
    if(audioCtx.state === "suspended") audioCtx.resume();
  }

  function midiToFreq(midi){
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function noteNameToMidi(noteName){
    const map = {C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
    const m = noteName.match(/^([A-G]#?)(\d)$/);
    if(!m) return 60;
    const [, base, oct] = m;
    return (parseInt(oct,10)+1)*12 + map[base];
  }

  function freqFromName(name){
    return midiToFreq(noteNameToMidi(name));
  }

  function getClosestPitch(y){
    let best = pitchMap[0];
    let bestDist = Math.abs(y - best.y);
    for(const p of pitchMap){
      const d = Math.abs(y - p.y);
      if(d < bestDist){
        best = p;
        bestDist = d;
      }
    }
    return best;
  }

  function unitsPerBeat(){
    return state.meterBottom === 8 ? 1 : state.meterBottom === 4 ? 2 : 4;
  }

  function unitsPerMeasure(){
    return state.meterTop * unitsPerBeat();
  }

  function totalUnits(){
    return state.measureCount * unitsPerMeasure();
  }

  function getSelectedNote(){
    return state.notes.find(n => n.id === state.selectedNoteId) || null;
  }

  function updateStatus(){
    const modeText = state.mode === "select" ? "Seç" : state.mode === "add" ? "Nota Ekle" : "Sil";
    statusBox.innerHTML =
      `Mod: <strong>${modeText}</strong> | Nota sayısı: <strong>${state.notes.length}</strong> | Ölçü: <strong>${state.meterTop}/${state.meterBottom}</strong> | Gösterilen ölçü: <strong>${state.measureCount}</strong>`;
  }

  function setMode(mode){
    state.mode = mode;
    document.getElementById("modeSelectBtn").classList.toggle("active", mode === "select");
    document.getElementById("modeAddBtn").classList.toggle("active", mode === "add");
    document.getElementById("modeDeleteBtn").classList.toggle("active", mode === "delete");
    updateStatus();
  }

  document.getElementById("modeSelectBtn").onclick = () => setMode("select");
  document.getElementById("modeAddBtn").onclick = () => setMode("add");
  document.getElementById("modeDeleteBtn").onclick = () => setMode("delete");

  tempoRange.addEventListener("input", () => {
    state.tempo = Number(tempoRange.value);
    tempoLabel.textContent = state.tempo;
  });

  durationSelect.addEventListener("change", () => {
    state.selectedDuration = Number(durationSelect.value);
    const note = getSelectedNote();
    if(note){
      note.duration = state.selectedDuration;
      drawAll();
    }
  });

  measureCountSelect.addEventListener("change", () => {
    state.measureCount = Number(measureCountSelect.value);
    trimNotesOutside();
    drawAll();
  });

  meterTopSelect.addEventListener("change", () => {
    state.meterTop = Number(meterTopSelect.value);
    trimNotesOutside();
    drawAll();
  });

  meterBottomSelect.addEventListener("change", () => {
    state.meterBottom = Number(meterBottomSelect.value);
    trimNotesOutside();
    drawAll();
  });

  syllableInput.addEventListener("input", () => {
    const note = getSelectedNote();
    if(!note) return;
    note.syllable = syllableInput.value;
    drawAll();
  });

  document.getElementById("clearBtn").onclick = () => {
    stopSequence();
    state.notes = [];
    state.selectedNoteId = null;
    syllableInput.value = "";
    drawAll();
  };

  document.getElementById("playBtn").onclick = playSequence;
  document.getElementById("stopBtn").onclick = stopSequence;

  function trimNotesOutside(){
    const maxUnits = totalUnits();
    state.notes = state.notes.filter(n => n.startUnit < maxUnits);
    const sel = getSelectedNote();
    if(!sel){
      state.selectedNoteId = null;
      syllableInput.value = "";
    }
  }

  function createSvgEl(tag, attrs={}){
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for(const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  }

  function drawLedgerLine(x, y){
    svg.appendChild(createSvgEl("line", {
      x1:x-16, y1:y, x2:x+16, y2:y, stroke:"#111", "stroke-width":2
    }));
  }

  function noteXFromUnit(unit){
    return startX + unit * unitWidth;
  }

  function noteCenterX(note){
    return noteXFromUnit(note.startUnit) + 18;
  }

  function drawStaffBase(){
    svg.innerHTML = "";
    const contentWidth = noteXFromUnit(totalUnits()) + 140;
    const w = Math.max(1700, contentWidth);
    svg.setAttribute("width", w);
    svg.setAttribute("viewBox", `0 0 ${w} 430`);

    for(let i=0;i<5;i++){
      const y = staffTop + i*lineGap;
      svg.appendChild(createSvgEl("line", {
        x1:80, y1:y, x2:contentWidth - 50, y2:y,
        stroke:"#666", "stroke-width":2
      }));
    }

    const treble = createSvgEl("text", {
      x:96, y:staffTop + 42, fill:"#111",
      "font-size":58, "font-family":"serif"
    });
    treble.textContent = "𝄞";
    svg.appendChild(treble);

    const meterTopText = createSvgEl("text", {
      x:140, y:staffTop + 18, fill:"#111",
      "font-size":26, "font-weight":"700"
    });
    meterTopText.textContent = state.meterTop;
    svg.appendChild(meterTopText);

    const meterBottomText = createSvgEl("text", {
      x:140, y:staffTop + 48, fill:"#111",
      "font-size":26, "font-weight":"700"
    });
    meterBottomText.textContent = state.meterBottom;
    svg.appendChild(meterBottomText);

    for(let u=0; u<=totalUnits(); u++){
      const x = noteXFromUnit(u);
      const isMeasure = u % unitsPerMeasure() === 0;
      if(isMeasure){
        svg.appendChild(createSvgEl("line", {
          x1:x, y1:staffTop-8, x2:x, y2:bottomLineY+8,
          stroke:"#565656", "stroke-width":2.5
        }));
      }else{
        svg.appendChild(createSvgEl("line", {
          x1:x, y1:staffTop-10, x2:x, y2:bottomLineY+130,
          stroke:"rgba(0,0,0,.08)", "stroke-width":1
        }));
      }
    }

    for(let m=0; m<state.measureCount; m++){
      const x = noteXFromUnit(m * unitsPerMeasure()) + 8;
      const label = createSvgEl("text", {
        x:x, y:staffTop - 26,
        fill:"#555", "font-size":14, "font-weight":"700"
      });
      label.textContent = (m+1) + ". ölçü";
      svg.appendChild(label);
    }
  }

  function drawSingleNote(note){
    const x = noteCenterX(note);
    const y = note.y;
    const selected = state.selectedNoteId === note.id;

    if(y < topLineY){
      for(let ly = topLineY; ly >= y; ly -= lineGap){
        if(ly !== topLineY || y === ly) drawLedgerLine(x, ly);
      }
    }
    if(y > bottomLineY){
      for(let ly = bottomLineY + lineGap; ly <= y; ly += lineGap){
        drawLedgerLine(x, ly);
      }
    }

    const g = createSvgEl("g", {
      style:"cursor:pointer;",
      "data-note-id": note.id
    });

    const isWhole = note.duration === 8;
    const isHalf = note.duration === 4;
    const isQuarter = note.duration === 2;
    const isEighth = note.duration === 1;

    const headFill = isHalf || isWhole ? (selected ? "#ffe08a" : "#f5f5f5") : (selected ? "#d3a100" : "#111");

    const head = createSvgEl("ellipse", {
      cx:x, cy:y, rx:12, ry:8,
      fill: headFill,
      stroke: "#111",
      "stroke-width": 2.2,
      transform:`rotate(-20 ${x} ${y})`
    });
    g.appendChild(head);

    if(!isWhole){
      const stemUp = y > staffTop + lineGap;
      const stemX = stemUp ? x + 10 : x - 10;
      const stemY2 = stemUp ? y - 42 : y + 42;
      const stem = createSvgEl("line", {
        x1:stemX, y1:y, x2:stemX, y2:stemY2,
        stroke:"#111", "stroke-width":2
      });
      g.appendChild(stem);

      if(isEighth){
        const flag = stemUp
          ? createSvgEl("path", {
              d:`M ${stemX} ${stemY2} Q ${stemX+14} ${stemY2+8} ${stemX+2} ${stemY2+22}`,
              stroke:"#111", "stroke-width":2, fill:"none"
            })
          : createSvgEl("path", {
              d:`M ${stemX} ${stemY2} Q ${stemX-14} ${stemY2-8} ${stemX-2} ${stemY2-22}`,
              stroke:"#111", "stroke-width":2, fill:"none"
            });
        g.appendChild(flag);
      }
    }

    if(selected){
      const box = createSvgEl("rect", {
        x:x-18, y:y-18, width:36, height:36, rx:8,
        fill:"none", stroke:"#d3a100", "stroke-width":2,
        "stroke-dasharray":"5 4"
      });
      g.appendChild(box);
    }

    if(note.syllable){
      const txt = createSvgEl("text", {
        x:x - 10, y:bottomLineY + 50, fill:"#222", "font-size":13
      });
      txt.textContent = note.syllable;
      g.appendChild(txt);
    }

    g.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      if(state.mode === "delete"){
        state.notes = state.notes.filter(n => n.id !== note.id);
        if(state.selectedNoteId === note.id){
          state.selectedNoteId = null;
          syllableInput.value = "";
        }
        drawAll();
        return;
      }
      state.selectedNoteId = note.id;
      syllableInput.value = note.syllable || "";
      durationSelect.value = String(note.duration);
      state.selectedDuration = note.duration;

      if(state.mode === "select"){
        state.dragId = note.id;
        state.dragMoved = false;
        try{ g.setPointerCapture(e.pointerId); }catch(err){}
      }
      drawAll();
    });

    g.addEventListener("pointermove", (e) => {
      if(state.mode !== "select" || state.dragId !== note.id) return;
      const p = getSvgPoint(e);
      const unit = clampUnit(snapUnitFromX(p.x));
      const pitch = getClosestPitch(p.y);
      note.startUnit = unit;
      note.pitch = pitch.name;
      note.midi = pitch.midi;
      note.y = pitch.y;
      state.dragMoved = true;
      drawAll();
    });

    g.addEventListener("pointerup", (e) => {
      if(state.dragId === note.id){
        state.dragId = null;
      }
    });

    svg.appendChild(g);
  }

  function drawNotes(){
    const sorted = [...state.notes].sort((a,b)=>a.startUnit-b.startUnit);
    sorted.forEach(drawSingleNote);
  }

  function drawAll(){
    drawStaffBase();
    drawNotes();
    updateStatus();
  }

  function getSvgPoint(evt){
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function snapUnitFromX(x){
    return Math.round((x - startX) / unitWidth);
  }

  function clampUnit(u){
    return Math.max(0, Math.min(totalUnits()-1, u));
  }

  function addNoteAt(startUnit, pitchObj){
    if(startUnit >= totalUnits()) return;
    const existing = state.notes.find(n => n.startUnit === startUnit);
    if(existing){
      existing.pitch = pitchObj.name;
      existing.midi = pitchObj.midi;
      existing.y = pitchObj.y;
      existing.duration = state.selectedDuration;
      state.selectedNoteId = existing.id;
      syllableInput.value = existing.syllable || "";
      durationSelect.value = String(existing.duration);
    } else {
      const newNote = {
        id: uuid(),
        startUnit,
        duration: state.selectedDuration,
        pitch: pitchObj.name,
        midi: pitchObj.midi,
        y: pitchObj.y,
        syllable: ""
      };
      state.notes.push(newNote);
      state.selectedNoteId = newNote.id;
      syllableInput.value = "";
      durationSelect.value = String(newNote.duration);
    }
    drawAll();
  }

  svg.addEventListener("click", (e) => {
    if(state.mode !== "add") return;
    const p = getSvgPoint(e);
    const unit = clampUnit(snapUnitFromX(p.x));
    const pitch = getClosestPitch(p.y);
    addNoteAt(unit, pitch);
  });

  function buildSequenceData(){
    const sorted = [...state.notes].sort((a,b)=>a.startUnit-b.startUnit);
    const secPerQuarter = 60 / state.tempo;
    return sorted.map(n => {
      let quarterMultiplier;
      if(n.duration === 1) quarterMultiplier = 0.5;
      else if(n.duration === 2) quarterMultiplier = 1;
      else if(n.duration === 4) quarterMultiplier = 2;
      else quarterMultiplier = 4;

      const startQuarter = n.startUnit / 2;
      return {
        pitch:n.pitch,
        startSec:startQuarter * secPerQuarter,
        durSec:quarterMultiplier * secPerQuarter
      };
    });
  }

  function playTone(freq, startTime, durationSec){
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.24, startTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + durationSec);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + durationSec + 0.03);
  }

  function highlightKey(noteName, on){
    document.querySelectorAll("[data-note]").forEach(el => {
      if(el.dataset.note === noteName) el.classList.toggle("active-key", on);
    });
  }

  function clearTimers(){
    state.playTimers.forEach(t => clearTimeout(t));
    state.playTimers = [];
  }

  function playSequence(){
    if(!state.notes.length) return;
    stopSequence();
    ensureAudio();
    const seq = buildSequenceData();
    const now = audioCtx.currentTime + 0.05;

    seq.forEach(item => {
      playTone(freqFromName(item.pitch), now + item.startSec, Math.max(0.1, item.durSec * 0.92));
      const onT = setTimeout(() => highlightKey(item.pitch, true), item.startSec * 1000);
      const offT = setTimeout(() => highlightKey(item.pitch, false), (item.startSec + item.durSec) * 1000);
      state.playTimers.push(onT, offT);
    });
  }

  function stopSequence(){
    clearTimers();
    document.querySelectorAll(".active-key").forEach(el => el.classList.remove("active-key"));
    if(audioCtx && audioCtx.state !== "closed"){
      try { audioCtx.close(); } catch(e){}
      audioCtx = null;
    }
  }

  function createPiano(){
    const piano = document.getElementById("piano");
    piano.innerHTML = "";

    const whiteOrder = ["C","D","E","F","G","A","B"];
    const blackAfter = { C:"C#", D:"D#", F:"F#", G:"G#", A:"A#" };

    let whiteIndex = 0;
    [4,5].forEach(oct => {
      whiteOrder.forEach(base => {
        const note = base + oct;
        const white = document.createElement("div");
        white.className = "white-key";
        white.style.left = `${whiteIndex * 68}px`;
        white.dataset.note = note;
        white.title = note;
        white.onclick = () => handlePianoInput(note);
        piano.appendChild(white);

        if(blackAfter[base]){
          const black = document.createElement("div");
          black.className = "black-key";
          black.style.left = `${whiteIndex * 68 + 48}px`;
          black.dataset.note = blackAfter[base] + oct;
          black.title = black.dataset.note;
          black.onclick = (e) => {
            e.stopPropagation();
            handlePianoInput(black.dataset.note);
          };
          piano.appendChild(black);
        }
        whiteIndex++;
      });
    });

    const lastC = document.createElement("div");
    lastC.className = "white-key";
    lastC.style.left = `${whiteIndex * 68}px`;
    lastC.dataset.note = "C6";
    lastC.title = "C6";
    lastC.onclick = () => handlePianoInput("C6");
    piano.appendChild(lastC);
  }

  function handlePianoInput(noteName){
    ensureAudio();
    playTone(freqFromName(noteName), audioCtx.currentTime, 0.4);
    highlightKey(noteName, true);
    setTimeout(() => highlightKey(noteName, false), 180);

    const pitchObj = pitchMap.find(p => p.name === noteName);
    if(!pitchObj) return;
    if(state.mode === "delete") return;

    if(state.mode === "select" && state.selectedNoteId){
      const selected = getSelectedNote();
      if(selected){
        selected.pitch = pitchObj.name;
        selected.midi = pitchObj.midi;
        selected.y = pitchObj.y;
        drawAll();
        return;
      }
    }

    let nextUnit = 0;
    if(state.notes.length){
      const maxEnd = Math.max(...state.notes.map(n => n.startUnit + n.duration));
      nextUnit = maxEnd;
    }
    nextUnit = clampUnit(nextUnit);
    addNoteAt(nextUnit, pitchObj);
  }

  drawAll();
  createPiano();
  setMode("select");
})();
</script>
</body>
</html>
