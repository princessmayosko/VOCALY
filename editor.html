<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocaly Waveform Editor</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f7fb;
color:#111827;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
margin-bottom:10px;
}

.card{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
margin-bottom:20px;
}

button{
padding:10px 16px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.primary{
background:#2563eb;
color:white;
}

.secondary{
background:#e5e7eb;
}

input{
padding:10px;
border-radius:8px;
border:1px solid #d1d5db;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:10px;
}

#waveform{
height:200px;
margin-top:20px;
}

.list{
margin-top:20px;
}

.item{
background:#f9fafb;
padding:10px;
border-radius:8px;
margin-bottom:6px;
font-size:14px;
}

textarea{
width:100%;
height:200px;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Waveform Editör</h1>

<input type="file" id="audioFile">

<div id="waveform"></div>

<div class="row">
<input id="start" placeholder="start">
<input id="end" placeholder="end">
<input id="hece" placeholder="hece">
<input id="nota" placeholder="nota">
<button class="primary" onclick="ekle()">Kaydet</button>
</div>

</div>

<div class="card">

<h3>Kayıtlı Heceler</h3>
<div id="liste" class="list"></div>

</div>

<div class="card">

<h3>Çıktı</h3>
<textarea id="output"></textarea>

</div>

</div>

<script src="https://unpkg.com/wavesurfer.js"></script>
<script src="https://unpkg.com/wavesurfer.js/dist/plugins/regions.min.js"></script>

<script>

let ws
let regions
let aktif
let heceler=[]

const startInput=document.getElementById("start")
const endInput=document.getElementById("end")

function initWave(){

regions=WaveSurfer.Regions.create()

ws=WaveSurfer.create({
container:"#waveform",
waveColor:"#cbd5e1",
progressColor:"#2563eb",
height:180,
plugins:[regions]
})

regions.enableDragSelection({color:"rgba(37,99,235,0.3)"})

regions.on("region-created",(r)=>{

if(aktif && aktif!==r)aktif.remove()

aktif=r

startInput.value=r.start.toFixed(2)
endInput.value=r.end.toFixed(2)

})

}

initWave()

document.getElementById("audioFile").addEventListener("change",e=>{

const file=e.target.files[0]

if(!file)return

const url=URL.createObjectURL(file)

ws.load(url)

})

function ekle(){

const hece=document.getElementById("hece").value
const nota=document.getElementById("nota").value
const start=parseFloat(startInput.value)
const end=parseFloat(endInput.value)

if(!hece)return

heceler.push({
text:hece,
note:nota,
start:start,
end:end
})

listeyiYenile()

}

function listeyiYenile(){

const liste=document.getElementById("liste")

liste.innerHTML=""

heceler.forEach(h=>{

const div=document.createElement("div")
div.className="item"

div.innerText=h.text+" | "+h.note+" | "+h.start+"-"+h.end

liste.appendChild(div)

})

const kod="const heceler = "+JSON.stringify(heceler,null,2)

document.getElementById("output").value=kod

}

</script>

</body>
</html>
