<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Vocaly Editor</title>

<style>
body{
font-family:Arial;
background:#f5f7fb;
padding:20px;
}

#waveform{
margin-top:20px;
height:200px;
border:1px solid #ddd;
border-radius:10px;
background:white;
}

input{
padding:8px;
margin:5px;
}

button{
padding:8px 12px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

textarea{
width:100%;
height:200px;
margin-top:20px;
font-family:monospace;
}
</style>

</head>

<body>

<h2>Vocaly Waveform Editor</h2>

<input type="file" id="audioFile">

<div id="waveform"></div>

<br>

Start <input id="start">
End <input id="end">
Hece <input id="hece">
Nota <input id="nota">

<button onclick="ekle()">Kaydet</button>

<h3>Karaoke Kod</h3>

<textarea id="output"></textarea>

<script src="https://unpkg.com/wavesurfer.js@6"></script>
<script src="https://unpkg.com/wavesurfer.js@6/dist/plugin/wavesurfer.regions.min.js"></script>

<script>

let ws
let data=[]
let aktif=null

function init(){

ws=WaveSurfer.create({
container:"#waveform",
waveColor:"#bbb",
progressColor:"#2563eb",
height:200,
plugins:[WaveSurfer.regions.create({})]
})

ws.enableDragSelection({
color:"rgba(37,99,235,0.3)"
})

ws.on("region-created",r=>{

if(aktif && aktif!==r){
aktif.remove()
}

aktif=r

start.value=r.start.toFixed(2)
end.value=r.end.toFixed(2)

})

}

init()

audioFile.onchange=e=>{
let file=e.target.files[0]
if(!file)return

let url=URL.createObjectURL(file)
ws.load(url)
}

function ekle(){

let obj={
text:hece.value,
note:nota.value,
start:parseFloat(start.value),
end:parseFloat(end.value)
}

data.push(obj)

output.value="const heceler = "+JSON.stringify(data,null,2)

}

</script>

</body>
</html>
