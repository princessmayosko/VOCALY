<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocaly Cetveli</title>

<style>
body{
  margin:0;
  background:#0f172a;
  font-family:Arial;
  color:white;
  overflow:hidden;
}

/* PANEL */
.panel{
  position:fixed;
  left:-120px;
  top:0;
  width:120px;
  height:100%;
  background:#111827;
  border-right:1px solid #1f2937;
  transition:0.3s;
  display:flex;
  justify-content:center;
}

.panel.open{
  left:0;
}

/* TOGGLE */
.toggle{
  position:fixed;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  background:#1f2937;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  z-index:10;
}

/* CETVEL */
.ruler{
  position:relative;
  width:60px;
  height:100%;
  margin-top:40px;
}

.line{
  position:absolute;
  width:100%;
  height:2px;
  left:0;
}

.note{
  position:absolute;
  left:70px;
  transform:translateY(-50%);
  font-size:14px;
}

/* RENKLER */
.do{background:#ef4444;}
.re{background:#f97316;}
.mi{background:#eab308;}
.fa{background:#22c55e;}
.sol{background:#3b82f6;}
.la{background:#a855f7;}
.si{background:#ec4899;}

/* HEDEF */
.target{
  box-shadow:0 0 15px #22c55e;
}

/* SES NOKTASI */
.dot{
  position:absolute;
  left:25px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 10px white;
  transition:0.1s;
}
.dot.green{
  background:#22c55e;
  box-shadow:0 0 20px #22c55e;
}

</style>
</head>

<body>

<div class="toggle" onclick="togglePanel()">🎤</div>

<div id="panel" class="panel">
  <div class="ruler" id="ruler"></div>
</div>

<script>

// ===== NOTALAR =====
const NOTES = [
  {name:"Do", class:"do", midi:0},
  {name:"Si", class:"si", midi:11},
  {name:"La", class:"la", midi:9},
  {name:"Sol", class:"sol", midi:7},
  {name:"Fa", class:"fa", midi:5},
  {name:"Mi", class:"mi", midi:4},
  {name:"Re", class:"re", midi:2},
  {name:"Do", class:"do", midi:0}
];

// hedef nota
const TARGET = 7; // Sol

// ===== CETVEL OLUŞTUR =====
const ruler = document.getElementById("ruler");
const height = window.innerHeight;

NOTES.forEach((n, i)=>{
  let y = (i/(NOTES.length-1))*height;

  let line = document.createElement("div");
  line.className = "line "+n.class;
  line.style.top = y+"px";

  if(n.midi===TARGET){
    line.classList.add("target");
  }

  let label = document.createElement("div");
  label.className = "note";
  label.innerText = n.name;
  label.style.top = y+"px";

  ruler.appendChild(line);
  ruler.appendChild(label);
});

// ===== SES NOKTASI =====
const dot = document.createElement("div");
dot.className="dot";
ruler.appendChild(dot);

// ===== PANEL =====
function togglePanel(){
  document.getElementById("panel").classList.toggle("open");
}

// ===== AUDIO =====
let audioContext;
let analyser;
let dataArray;

async function startMic(){
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  audioContext = new AudioContext();
  const source = audioContext.createMediaStreamSource(stream);

  analyser = audioContext.createAnalyser();
  analyser.fftSize = 2048;

  source.connect(analyser);
  dataArray = new Float32Array(analyser.fftSize);

  update();
}

// ===== AUTOCORRELATION =====
function getPitch(){
  analyser.getFloatTimeDomainData(dataArray);

  let SIZE = dataArray.length;
  let bestOffset = -1;
  let bestCorrelation = 0;

  for(let offset=8; offset<1000; offset++){
    let correlation = 0;

    for(let i=0; i<SIZE-offset; i++){
      correlation += dataArray[i]*dataArray[i+offset];
    }

    correlation = correlation/(SIZE-offset);

    if(correlation>bestCorrelation){
      bestCorrelation = correlation;
      bestOffset = offset;
    }
  }

  if(bestOffset>0){
    return audioContext.sampleRate / bestOffset;
  }

  return null;
}

// ===== FREKANS → MIDI =====
function freqToMidi(freq){
  return 69 + 12 * Math.log2(freq / 440);
}

// ===== UPDATE LOOP =====
function update(){
  requestAnimationFrame(update);

  const freq = getPitch();
  if(!freq) return;

  let midi = freqToMidi(freq);

  // oktav bağımsız
  let pitchClass = ((Math.round(midi)%12)+12)%12;

  // konum
  let pos = (pitchClass / 12);
  let y = height * (1-pos);

  dot.style.top = y+"px";

  // hedef kontrol
  if(Math.abs(pitchClass - TARGET) < 1){
    dot.classList.add("green");
  }else{
    dot.classList.remove("green");
  }
}

// ===== BAŞLAT =====
document.body.addEventListener("click", startMic);

</script>

</body>
</html>
