<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Vocaly Defter v10</title>
<style>
body{background:#111;color:#fff;font-family:Arial;padding:20px}
button,select,input{padding:8px;margin:5px}
svg{background:#ddd;border-radius:10px}
</style>
</head>
<body>

<h2>🎼 Vocaly Defter v10</h2>

<input id="title" placeholder="Eser başlığı">
<input id="composer" placeholder="Besteci">

<br>

<select id="keySelect">
<option value="0">Do Majör / La minör</option>
<option value="1#">Sol Majör / Mi minör</option>
<option value="2#">Re Majör / Si minör</option>
<option value="3#">La Majör / Fa# minör</option>
<option value="1b">Fa Majör / Re minör</option>
<option value="2b">Si♭ Majör / Sol minör</option>
</select>

<br>

<button onclick="addNote()">Nota ekle</button>
<button onclick="play()">Çal</button>

<svg id="sheet" width="800" height="200"></svg>

<script>

let notes=[]
let keySig="0"

const SHARP_ORDER=["F","C","G","D","A"]
const FLAT_ORDER=["B","E","A","D","G"]

document.getElementById("keySelect").onchange=e=>{
  keySig=e.target.value
}

function getMidi(note){
  const map={C:0,D:2,E:4,F:5,G:7,A:9,B:11}
  let letter=note[0]
  let octave=parseInt(note.slice(-1))
  let acc=0
  if(note.includes("#")) acc=1
  if(note.includes("b")) acc=-1
  return (octave+1)*12+map[letter]+acc
}

function freq(note){
  return 440*Math.pow(2,(getMidi(note)-69)/12)
}

function applyKey(note){
  if(keySig==="0") return note

  let type=keySig.includes("#")?"#":"b"
  let count=parseInt(keySig)

  let letter=note[0]

  if(type==="#"){
    if(SHARP_ORDER.slice(0,count).includes(letter)){
      return letter+"#"+note.slice(1)
    }
  }

  if(type==="b"){
    if(FLAT_ORDER.slice(0,count).includes(letter)){
      return letter+"b"+note.slice(1)
    }
  }

  return note
}

function playNote(note){
  let ctx=new AudioContext()
  let osc=ctx.createOscillator()
  let g=ctx.createGain()

  let real=applyKey(note)

  osc.frequency.value=freq(real)
  osc.type="triangle"

  g.gain.value=0.2

  osc.connect(g)
  g.connect(ctx.destination)

  osc.start()
  osc.stop(ctx.currentTime+0.5)
}

function addNote(){
  let pitches=["C4","D4","E4","F4","G4","A4","B4"]
  let p=pitches[Math.floor(Math.random()*pitches.length)]
  notes.push(p)
  draw()
}

function play(){
  notes.forEach((n,i)=>{
    setTimeout(()=>playNote(n),i*500)
  })
}

function draw(){
  let svg=document.getElementById("sheet")
  svg.innerHTML=""

  notes.forEach((n,i)=>{
    let x=50+i*50
    let y=100
    let t=document.createElementNS("http://www.w3.org/2000/svg","text")
    t.setAttribute("x",x)
    t.setAttribute("y",y)
    t.textContent=n
    svg.appendChild(t)
  })
}

</script>

</body>
</html>
