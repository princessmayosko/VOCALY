<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>VOCALY</title>
<style>
:root{
  --bg:#08111f;
  --bg2:#0f1b2d;
  --panel:rgba(12,22,39,.92);
  --panel2:rgba(18,31,52,.92);
  --line:rgba(255,255,255,.09);
  --text:#eef4ff;
  --muted:#9fb0c9;
  --yellow:#facc15;
  --purple:#8b5cf6;
  --green:#22c55e;
  --red:#ef4444;
  --cyan:#22d3ee;
  --shadow:0 12px 36px rgba(0,0,0,.32);

  --do:#ef4444;
  --dosharp:#ff7b72;
  --re:#fb923c;
  --resharp:#fdba74;
  --mi:#facc15;
  --fa:#22c55e;
  --fasharp:#4ade80;
  --sol:#22d3ee;
  --solsharp:#60a5fa;
  --la:#8b5cf6;
  --lasharp:#a78bfa;
  --si:#ec4899;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:Arial,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
.hidden{display:none!important}
.app{max-width:1200px;margin:0 auto;padding:14px 14px 90px}
.topbar{
  position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(8,17,31,.95),rgba(8,17,31,.72));
  border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:1200px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px}
.logo{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 30%,#fde047 0,#facc15 42%,#ca8a04 100%);
  color:#111827;font-weight:900;box-shadow:0 8px 24px rgba(250,204,21,.22)
}
.brand span{font-size:20px;color:var(--yellow)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.navBtn,.smallBtn,.primaryBtn,.ghostBtn{
  border:none;border-radius:14px;padding:11px 14px;cursor:pointer;
  color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line)
}
.navBtn.active{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.45)}
.primaryBtn{background:linear-gradient(135deg,var(--purple),#6d28d9);border:none;font-weight:700}
.ghostBtn{background:rgba(255,255,255,.04)}
.smallBtn{padding:9px 11px;font-size:14px}
.hero{
  margin-top:18px;background:linear-gradient(135deg,rgba(139,92,246,.16),rgba(34,211,238,.09));
  border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)
}
.hero h1{margin:0 0 8px;font-size:28px;line-height:1.08}
.hero p{margin:0;color:var(--muted);line-height:1.5}
.quickActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.panel{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sectionTitle h2{margin:0;font-size:20px}
.sectionTitle p{margin:4px 0 0;color:var(--muted);font-size:14px}
.libraryGrid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.libraryGrid{grid-template-columns:repeat(2,1fr)}}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.03));
  border:1px solid var(--line);border-radius:20px;padding:14px
}
.cardTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cardTitle{font-size:18px;font-weight:800;margin:0 0 6px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:6px 9px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--muted)}
.card p{margin:8px 0 0;color:var(--muted);line-height:1.45}
.cardActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.workspaceGrid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.workspaceGrid{grid-template-columns:1.1fr .9fr}}
.lyricsBox{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;min-height:140px}
.hece{
  position:relative;padding:14px 16px;border-radius:18px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);font-weight:700;transition:.18s ease;overflow:hidden
}
.hece.active{outline:2px solid rgba(34,211,238,.42);background:rgba(34,211,238,.12)}
.hece.correct{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.5)}
.hece.wrong{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.48)}
.heceLabel{position:relative;z-index:2}
.heceSmall{display:block;margin-top:6px;font-size:12px;color:rgba(255,255,255,.7);position:relative;z-index:2}
.heceFill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,rgba(250,204,21,.08),rgba(250,204,21,.28));z-index:1;transition:none}
.subtext{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.45}
.infoList{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.infoItem{padding:12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.infoItem .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.infoItem .v{font-size:22px;font-weight:800}
.placeholder{display:grid;place-items:center;min-height:240px;text-align:center;color:var(--muted);border:1px dashed rgba(255,255,255,.12);border-radius:22px;background:rgba(255,255,255,.03);padding:20px}
.footerNote{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.45}
.tunerHandle{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:120;width:26px;height:134px;border-top-right-radius:14px;border-bottom-right-radius:14px;background:rgba(255,255,255,.09);border:1px solid var(--line);border-left:none;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;letter-spacing:.8px;font-size:12px;font-weight:800;cursor:pointer;user-select:none}
.tunerPanel{position:fixed;left:-164px;top:0;width:164px;height:100dvh;z-index:119;background:rgba(8,17,31,.98);border-right:1px solid var(--line);transition:left .25s ease;display:flex;flex-direction:column;align-items:center;padding:14px 10px 12px;box-shadow:var(--shadow)}
.tunerPanel.open{left:0}
.tunerTop{width:100%;display:flex;flex-direction:column;gap:8px;align-items:center}
.tunerLabel{font-size:12px;color:var(--muted)}
.tunerTarget{font-size:24px;font-weight:900}
.tunerCurrent{font-size:15px;font-weight:700;min-height:18px;text-align:center}
.tunerScale{margin-top:12px;flex:1;width:100%;display:grid;grid-template-rows:repeat(13,1fr);gap:1px;background:rgba(255,255,255,.05);padding:2px;border-radius:16px;border:1px solid rgba(255,255,255,.08)}
.noteCell{position:relative;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;text-align:center;opacity:.35;transition:.16s ease;font-weight:900;background:rgba(255,255,255,.04);font-size:15px;min-height:42px}
.noteCell.chromatic{font-size:11px;opacity:.24;transform:scaleY(.78);transform-origin:center;min-height:24px}
.noteCell.active{opacity:1;transform:scale(1.04);box-shadow:0 0 14px currentColor inset,0 0 10px currentColor}
.noteCell.targetMark::after{content:'•';position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#fff;opacity:.85;font-size:18px}
.note-do{color:var(--do)} .note-dosharp{color:var(--dosharp)} .note-re{color:var(--re)} .note-resharp{color:var(--resharp)} .note-mi{color:var(--mi)} .note-fa{color:var(--fa)} .note-fasharp{color:var(--fasharp)} .note-sol{color:var(--sol)} .note-solsharp{color:var(--solsharp)} .note-la{color:var(--la)} .note-lasharp{color:var(--lasharp)} .note-si{color:var(--si)}
.tunerBottom{width:100%;display:grid;gap:8px;margin-top:12px}
.pill{padding:10px 8px;border-radius:14px;text-align:center;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13px}
.pill.good{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.35)}
.pill.bad{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3)}
@keyframes fillBar{from{width:0%}to{width:100%}}
@media (max-width:640px){.hero h1{font-size:24px}.topbar-inner{align-items:flex-start;flex-direction:column}.nav{width:100%}.navBtn{flex:1}.infoList{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><div class="logo">V</div><span>VOCALY</span></div>
      <div class="nav">
        <button class="navBtn active" data-view="library">Kütüphane</button>
        <button class="navBtn" data-view="measure">Karaoke/Ölçme</button>
        <button class="navBtn" data-view="editor">Editör</button>

  <div class="tunerHandle" id="tunerHandle">TUNER</div>

    <div class="tunerScale" id="tunerScale">

      <button class="smallBtn" id="micBtn">Mikrofonu Aç</button>

  <div class="app">
    <section class="hero">
      <h1>VOCALY</h1>

        <div>
          <h2>Kütüphane</h2>

    </section>

      <div class="sectionTitle">
        <div>
          <h2>Karaoke/Ölçme</h2>

          <button class="smallBtn" id="startMeasureBtn">Başlat</button>

          <div class="lyricsBox" id="lyricsBox"></div>
        </div>

        <div class="card">
          <div class="infoList">
            <div class="infoItem"><div class="k">Aktif</div><div class="v" id="activeHeceText">—</div></div>
            <div class="infoItem"><div class="k">Hedef</div><div class="v" id="activeTargetText">—</div></div>
            <div class="infoItem"><div class="k">Algılanan</div><div class="v" id="detectedText">—</div></div>
            <div class="infoItem"><div class="k">Durum</div><div class="v" id="matchStateText">Hazır</div></div>

    <section class="panel view hidden" id="view-editor">

          <h2>Editör</h2>

    </section>

<script>
const library = [
  {
    id:'neseli-gunler',
    title:'Neşeli Günler',
    level:'Kolay',
    mode:'Eser',
    desc:'',
    lyrics:[
      { text:'Ne', note:'Do' },
      { text:'şe', note:'Re' },
      { text:'li', note:'Mi' },
      { text:'gün', note:'Fa' },
      { text:'ler', note:'Sol' }
    ]
  }
];

const noteFreq = { Do:261.63, Re:293.66, Mi:329.63, Fa:349.23, Sol:392.00, La:440.00, Si:493.88 };
const pitchClassMap = { 0:'Do', 1:'Do#', 2:'Re', 3:'Re#', 4:'Mi', 5:'Fa', 6:'Fa#', 7:'Sol', 8:'Sol#', 9:'La', 10:'La#', 11:'Si' };
const targetClassMap = { Do:0, Re:2, Mi:4, Fa:5, Sol:7, La:9, Si:11 };
const MEASURE_DURATION = 2000;
const DETECT_TOLERANCE_CENTS = 45;

let selectedSong = null;
let activeHeceIndex = 0;
let currentDetected = null;
let audioCtx = null;
let analyser = null;
let mediaStream = null;
let sourceNode = null;
let buffer = null;
let rafId = null;
let micReady = false;
let measureTimer = null;
let measureRunning = false;
let measureLocked = false;

const views = document.querySelectorAll('.view');
const navBtns = document.querySelectorAll('.navBtn');
const libraryGrid = document.getElementById('libraryGrid');
const lyricsBox = document.getElementById('lyricsBox');
const activeHeceText = document.getElementById('activeHeceText');
const activeTargetText = document.getElementById('activeTargetText');
const detectedText = document.getElementById('detectedText');
const matchStateText = document.getElementById('matchStateText');
const tunerPanel = document.getElementById('tunerPanel');
const tunerHandle = document.getElementById('tunerHandle');
const tunerTarget = document.getElementById('tunerTarget');
const tunerCurrent = document.getElementById('tunerCurrent');
const heroOpenLibrary = document.getElementById('heroOpenLibrary');
const heroOpenMeasure = document.getElementById('heroOpenMeasure');
const editorPlaceholder = document.getElementById('editorPlaceholder');

function renderLibrary(){
  if(!libraryGrid) return;
  libraryGrid.innerHTML = '';
  library.forEach(song => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="cardTop">
        <div>
          <div class="cardTitle">${song.title}</div>
          <div class="badges">
            <span class="badge">${song.level}</span>
            <span class="badge">${song.mode}</span>
          </div>
        </div>
      </div>
      <div class="cardActions">
        <button class="primaryBtn" data-open-measure="${song.id}">Aç</button>
      </div>
    `;
    libraryGrid.appendChild(card);
  });

  document.querySelectorAll('[data-open-measure]').forEach(btn => {
    btn.addEventListener('click', () => {
      openSong(btn.dataset.openMeasure);
      showView('measure');
    });
  });
}

function openSong(id){
  selectedSong = library.find(x => x.id === id) || null;
  activeHeceIndex = 0;
  stopMeasure(true);
  renderMeasure();
}

function renderMeasure(){
  if(!lyricsBox) return;
  lyricsBox.innerHTML = '';
  if(!selectedSong){
    if(activeHeceText) activeHeceText.textContent = '—';
    if(activeTargetText) activeTargetText.textContent = '—';
    if(tunerTarget) tunerTarget.textContent = '—';
    updateTargetMarks(null);
    return;
  }

  selectedSong.lyrics.forEach((item, index) => {
    const h = document.createElement('button');
    h.className = 'hece';
    h.dataset.index = String(index);
    h.innerHTML = `<span class="heceFill"></span><span class="heceLabel">${item.text}</span><small class="heceSmall">${item.note}</small>`;
    if(index === activeHeceIndex) h.classList.add('active');
    h.addEventListener('click', () => {
      activeHeceIndex = index;
      stopMeasure(true);
      renderMeasure();
      evaluatePassiveState();
    });
    lyricsBox.appendChild(h);
  });

  const active = selectedSong.lyrics[activeHeceIndex];
  if(activeHeceText) activeHeceText.textContent = active?.text || '—';
  if(activeTargetText) activeTargetText.textContent = active?.note || '—';
  if(tunerTarget) tunerTarget.textContent = active?.note || '—';
  updateTargetMarks(active?.note || null);
  evaluatePassiveState();
}

function showView(name){
  views.forEach(v => v.classList.add('hidden'));
  const view = document.getElementById(`view-${name}`);
  if(view) view.classList.remove('hidden');
  navBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.view === name));
}

function updateTargetMarks(note){
  const cells = document.querySelectorAll('.noteCell');
  cells.forEach((el, idx) => {
    const isBottomDo = idx === 0;
    const isTopDo = idx === cells.length - 1;
    if(note === 'Do') el.classList.toggle('targetMark', isBottomDo || isTopDo);
    else el.classList.toggle('targetMark', el.dataset.note === note);
  });
}

function highlightDetected(note){
  const cells = document.querySelectorAll('.noteCell');
  cells.forEach((el, idx) => {
    const isBottomDo = idx === 0;
    const isTopDo = idx === cells.length - 1;
    if(note === 'Do') el.classList.toggle('active', isBottomDo || isTopDo);
    else el.classList.toggle('active', el.dataset.note === note);
  });
  if(tunerCurrent) tunerCurrent.textContent = note ? `Algılanan: ${note}` : 'Ses bekleniyor';
  if(detectedText) detectedText.textContent = note || '—';
}

function getActiveHeceEl(){
  return lyricsBox ? lyricsBox.querySelector(`.hece[data-index="${activeHeceIndex}"]`) : null;
}

function resetHeceVisual(el){
  if(!el) return;
  el.classList.remove('correct','wrong');
  const fill = el.querySelector('.heceFill');
  if(fill){ fill.style.animation = 'none'; fill.style.width = '0%'; }
}

function startHeceLoading(el){
  if(!el) return;
  const fill = el.querySelector('.heceFill');
  if(fill){
    fill.style.animation = 'none';
    fill.style.width = '0%';
    void fill.offsetWidth;
    fill.style.animation = `fillBar ${MEASURE_DURATION}ms linear forwards`;
  }
}

function evaluatePassiveState(){
  if(!selectedSong){
    if(matchStateText) matchStateText.textContent = 'Hazır';
    return;
  }
  const heceler = [...document.querySelectorAll('.hece')];
  heceler.forEach((h,i) => h.classList.toggle('active', i === activeHeceIndex));
  if(matchStateText) matchStateText.textContent = micReady ? 'Beklemede' : 'Mikrofon kapalı';
}

function lockCurrentHeceSuccess(){
  const el = getActiveHeceEl();
  if(!el || measureLocked) return;
  measureLocked = true;
  clearTimeout(measureTimer);
  el.classList.remove('active','wrong');
  el.classList.add('correct');
  if(matchStateText) matchStateText.textContent = 'Doğru';
  setTimeout(() => {
    if(!selectedSong) return;
    if(activeHeceIndex < selectedSong.lyrics.length - 1){
      activeHeceIndex += 1;
      renderMeasure();
      startMeasureForActiveHece();
    } else {
      stopMeasure(true);
      if(matchStateText) matchStateText.textContent = 'Bitti';
    }
  }, 350);
}

function lockCurrentHeceFail(){
  const el = getActiveHeceEl();
  if(!el || measureLocked) return;
  measureLocked = true;
  el.classList.remove('active','correct');
  el.classList.add('wrong');
  if(matchStateText) matchStateText.textContent = 'Yanlış';
}

function stopMeasure(silent=false){
  clearTimeout(measureTimer);
  measureRunning = false;
  measureLocked = false;
  if(!silent) evaluatePassiveState();
}

function startMeasureForActiveHece(){
  if(!selectedSong) return;
  clearTimeout(measureTimer);
  measureRunning = true;
  measureLocked = false;
  const active = selectedSong.lyrics[activeHeceIndex];
  if(tunerTarget) tunerTarget.textContent = active.note;
  if(activeHeceText) activeHeceText.textContent = active.text;
  if(activeTargetText) activeTargetText.textContent = active.note;
  updateTargetMarks(active.note);
  const heceler = [...document.querySelectorAll('.hece')];
  heceler.forEach((h,i) => {
    h.classList.toggle('active', i === activeHeceIndex);
    if(i === activeHeceIndex) resetHeceVisual(h);
  });
  const el = getActiveHeceEl();
  startHeceLoading(el);
  if(matchStateText) matchStateText.textContent = 'Dinleniyor';
  measureTimer = setTimeout(() => {
    if(!measureLocked) lockCurrentHeceFail();
  }, MEASURE_DURATION);
}

function nextHece(){
  if(!selectedSong) return;
  activeHeceIndex = Math.min(activeHeceIndex + 1, selectedSong.lyrics.length - 1);
  stopMeasure(true);
  renderMeasure();
}

function autoCorr(buf, sampleRate){
  let rms = 0;
  for(let i=0;i<buf.length;i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);
  if(rms < 0.01) return -1;
  let bestOffset = -1;
  let bestCorr = 0;
  for(let offset = 20; offset < 1000; offset++){
    let corr = 0;
    for(let i=0; i<buf.length-offset; i++) corr += buf[i] * buf[i+offset];
    if(corr > bestCorr){ bestCorr = corr; bestOffset = offset; }
  }
  if(bestOffset === -1) return -1;
  return sampleRate / bestOffset;
}

function freqToMidiFloat(freq){
  return 69 + 12 * Math.log2(freq / 440);
}

function centsDistanceToPitchClass(freq, targetPitchClass){
  const midiFloat = freqToMidiFloat(freq);
  let best = Infinity;
  for(let octave = -2; octave <= 10; octave++){
    const candidateMidi = targetPitchClass + 12 * octave;
    const diff = Math.abs((midiFloat - candidateMidi) * 100);
    if(diff < best) best = diff;
  }
  return best;
}

function freqToNoteClass(freq){
  if(!freq || freq <= 0) return null;
  let bestClass = null;
  let bestCents = Infinity;
  for(let pc = 0; pc < 12; pc++){
    const cents = centsDistanceToPitchClass(freq, pc);
    if(cents < bestCents){ bestCents = cents; bestClass = pc; }
  }
  if(bestCents > DETECT_TOLERANCE_CENTS) return null;
  return pitchClassMap[bestClass] || null;
}

async function initMic(){
  try{
    if(micReady) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    sourceNode = audioCtx.createMediaStreamSource(mediaStream);
    sourceNode.connect(analyser);
    buffer = new Float32Array(analyser.fftSize);
    micReady = true;
    startPitchLoop();
    evaluatePassiveState();
  } catch(err){ console.error(err); }
}

function openTunerPanel(){
  if(tunerPanel) tunerPanel.classList.add('open');
  initMic();
}

function startPitchLoop(){
  if(rafId) cancelAnimationFrame(rafId);
  const loop = () => {
    if(analyser && buffer){
      analyser.getFloatTimeDomainData(buffer);
      const freq = autoCorr(buffer, analyser.context.sampleRate);
      currentDetected = freq > 0 ? freqToNoteClass(freq) : null;
      highlightDetected(currentDetected);
      if(measureRunning && !measureLocked && selectedSong){
        const active = selectedSong.lyrics[activeHeceIndex];
        const targetName = active?.note;
        const targetPitchClass = targetClassMap[targetName];
        if(active && freq > 0 && targetPitchClass !== undefined){
          const cents = centsDistanceToPitchClass(freq, targetPitchClass);
          if(cents <= DETECT_TOLERANCE_CENTS) lockCurrentHeceSuccess();
        }
      }
    }
    rafId = requestAnimationFrame(loop);
  };
  loop();
}

navBtns.forEach(btn => btn.addEventListener('click', () => showView(btn.dataset.view)));
if(heroOpenLibrary) heroOpenLibrary.addEventListener('click', () => showView('library'));
if(heroOpenMeasure) heroOpenMeasure.addEventListener('click', () => showView('measure'));
if(tunerHandle) tunerHandle.addEventListener('click', () => {
  if(tunerPanel.classList.contains('open')) tunerPanel.classList.remove('open');
  else openTunerPanel();
});

document.addEventListener('click', (e) => {
  const t = e.target;
  if(t && t.id === 'nextHeceBtn') nextHece();
  if(t && t.id === 'startMeasureBtn') startMeasureForActiveHece();
});

document.body.addEventListener('click', async () => {
  if(audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
}, { passive:true });

if(editorPlaceholder) editorPlaceholder.innerHTML = '';
openTunerPanel();
renderLibrary();
openSong('neseli-gunler');
showView('library');
</script>
