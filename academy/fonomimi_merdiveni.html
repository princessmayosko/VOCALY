<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOCALY – Fonomimi Merdiveni</title>
<style>
*{box-sizing:border-box}
:root{--bg:#07101f;--panel:#0a1426;--line:#30476a;--yellow:#facc15}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.topbar{height:72px;background:#091426;border-bottom:1px solid #26344d;display:flex;align-items:center;justify-content:space-between;padding:10px 24px}
.game-title{font-size:23px;font-weight:900;color:var(--yellow)}
.stats{display:flex;gap:18px;font-size:18px;font-weight:800}
.game{max-width:1500px;margin:auto;padding:14px}
.game-world{position:relative;height:680px;overflow:hidden;border-radius:24px;border:1px solid #304362;background:
radial-gradient(circle at 18% 16%,rgba(125,211,252,.30),transparent 24%),
radial-gradient(circle at 78% 12%,rgba(167,139,250,.22),transparent 22%),
radial-gradient(circle at 52% 72%,rgba(34,197,94,.13),transparent 30%),
linear-gradient(180deg,#38bdf8 0%,#7dd3fc 34%,#38bdf8 62%,#166534 100%);
}

.game-world::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(ellipse at 12% 78%,rgba(255,255,255,.16) 0 7%,transparent 7.5%),
    radial-gradient(ellipse at 88% 72%,rgba(255,255,255,.12) 0 8%,transparent 8.5%),
    radial-gradient(circle at 72% 24%,rgba(255,255,255,.55) 0 2px,transparent 3px),
    radial-gradient(circle at 25% 20%,rgba(255,255,255,.45) 0 2px,transparent 3px),
    radial-gradient(circle at 46% 11%,rgba(255,255,255,.5) 0 1.5px,transparent 2.5px);
  opacity:.8;
}
.game-world::after{
  content:"";
  position:absolute;
  left:-5%;
  right:-5%;
  bottom:-12%;
  height:32%;
  pointer-events:none;
  z-index:1;
  background:
    radial-gradient(ellipse at 18% 100%,#166534 0 34%,transparent 35%),
    radial-gradient(ellipse at 74% 100%,#15803d 0 38%,transparent 39%);
  opacity:.85;
}
.level-info,.ladder,.pitch-panel,.bottom-panel{z-index:40}
.level-info{position:absolute;left:18px;top:18px;z-index:40;width:145px;padding:13px;border-radius:15px;background:#07101fee;border:1px solid #405274}
.level-info strong{display:block;color:#4ade80;font-size:18px;margin-bottom:4px}.level-info span{font-size:14px;color:#ddd}
.combo{margin-top:10px;color:#aaa;font-size:13px}.combo b{color:#facc15;font-size:20px}
.ladder{position:absolute;left:190px;right:190px;bottom:118px;height:470px}
.start-point{position:absolute;left:-95px;bottom:0;width:82px;height:76px;border-bottom:5px solid #475569;border-radius:12px;background:#ffffff08;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:30px}
.start-flag{position:absolute;bottom:82px;font-size:10px;font-weight:800;background:#1e293b;padding:4px 8px;border-radius:7px;white-space:nowrap}
.step{position:absolute;width:118px;height:72px;border:3px solid #ffffff88;border-radius:12px 12px 6px 6px;display:flex;align-items:center;justify-content:center;box-shadow:0 9px 0 #00000045,inset 0 3px #ffffff55;cursor:pointer;transition:filter .15s,transform .15s}
.step:hover{filter:brightness(1.14)}.step.active-target{filter:brightness(1.2) drop-shadow(0 0 12px #facc15);transform:translateY(-4px)}
.step:nth-of-type(n){z-index:5}
.step-do{left:0;bottom:0;background:#ef4444}.step-re{left:105px;bottom:52px;background:#f97316}.step-mi{left:210px;bottom:104px;background:#eab308}.step-fa{left:315px;bottom:156px;background:#22c55e}.step-sol{left:420px;bottom:208px;background:#0ea5e9}.step-la{left:525px;bottom:260px;background:#6366f1}.step-si{left:630px;bottom:312px;background:#d946ef}.step-do2{left:735px;bottom:364px;background:#ef4444}
.step-note{font-size:20px;font-weight:900;text-shadow:0 2px 3px #0008}
.hand-sign{position:absolute;left:50%;bottom:-72px;transform:translateX(-50%);width:92px;height:68px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3;filter:drop-shadow(0 3px 3px #0008)}
.hand-sign img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.coin{position:absolute;left:50%;top:-51px;transform:translateX(-50%);width:43px;height:43px;border-radius:50%;border:3px solid #fff3a3;background:radial-gradient(circle at 35% 30%,#fff7a8,#facc15 45%,#d97706);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 0 13px #facc15,0 0 25px #facc1577;animation:coinFloat 1.1s infinite ease-in-out}
.coin.inactive{opacity:.18;filter:grayscale(1);box-shadow:none}.coin.collected{animation:coinCollect .45s forwards}
@keyframes coinFloat{50%{margin-top:-7px}}@keyframes coinCollect{to{transform:translate(-50%,-85px) scale(1.4);opacity:0}}
.cat{position:absolute;z-index:30;width:112px;height:150px;left:-105px;bottom:0;transition:left .38s cubic-bezier(.2,.85,.25,1),bottom .38s cubic-bezier(.2,.85,.25,1);filter:drop-shadow(0 9px 6px #0008);pointer-events:none;display:flex;align-items:flex-end;justify-content:center}
.cat-img{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom}

.cat.jump{animation:jump .45s ease-out}@keyframes jump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-45px) scale(1.08)}65%{transform:translateY(-24px) scale(1.04)}100%{transform:translateY(0) scale(1)}}
.cat-svg{width:100%;height:100%}.cat-body{fill:#f8fafc;stroke:#cbd5e1;stroke-width:3}.cat-eye{fill:#22c55e;stroke:#111827;stroke-width:2}
.pitch-panel{position:absolute;right:18px;top:100px;width:105px;padding:12px;border-radius:17px;background:#07101fee;border:1px solid #405274;text-align:center;z-index:40}
.pitch-title{color:#a5b4fc;font-size:13px;font-weight:800;margin-bottom:10px}.pitch-meter{position:relative;width:30px;height:175px;margin:auto;border-radius:18px;background:#111827;border:2px solid #475569;overflow:hidden}.pitch-fill{position:absolute;left:0;bottom:50%;width:100%;height:6px;border-radius:5px;background:#22c55e;box-shadow:0 0 10px #22c55e;transition:.06s}.pitch-center{position:absolute;left:0;right:0;top:50%;height:2px;background:#fff}.pitch-status{margin-top:10px;color:#facc15;font-size:11px;font-weight:800;line-height:1.25}.pitch-status.correct{color:#4ade80}.pitch-hz{margin-top:6px;color:#94a3b8;font-size:11px}
.bottom-panel{position:absolute;left:18px;right:18px;bottom:14px;min-height:68px;padding:7px 14px;display:flex;align-items:center;justify-content:center;gap:20px;border-radius:15px;background:#07101fee;border:1px solid #405274;z-index:45}
.target{text-align:center;min-width:120px}.target small{display:block;color:#94a3b8;font-size:10px;font-weight:800}#targetNote{color:#facc15;font-size:27px;line-height:29px;font-weight:900}.target-hand{height:24px;font-size:23px}.mic-button,.controls button{border:none;border-radius:11px;font-weight:800;cursor:pointer}.mic-button{padding:10px 15px;background:#7c3aed;color:#fff}.mic-button.active{background:#dc2626}.instruction{max-width:270px;color:#cbd5e1;font-size:12px;line-height:1.3}
.controls{display:flex;justify-content:center;gap:12px;margin-top:11px}.controls button{padding:11px 22px;background:#facc15;color:#111;font-size:15px}.controls button:disabled,.mic-button:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:900px){
  html,body{width:100%;min-height:100%;overflow-x:hidden}
  body{overscroll-behavior:none}
  .topbar{
    height:52px;
    min-height:52px;
    padding:5px 8px;
    gap:5px;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto auto;
    align-items:center;
  }
  .game-title{
    width:auto;
    min-width:0;
    text-align:left;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:15px;
  }
  .method-select{position:static;display:block}
  .method-select label{display:none}
  #methodSelect{max-width:145px;min-width:105px;padding:6px 7px;font-size:10px;border-radius:8px}
  .stats{gap:7px;font-size:12px;white-space:nowrap}
  .game{width:100%;max-width:none;margin:0;padding:4px}
  .game-world{
    width:100%;
    height:calc(100svh - 118px);
    min-height:500px;
    border-radius:16px;
  }

  .level-info{
    left:10px;
    top:10px;
    width:115px;
    padding:9px;
    border-radius:12px;
    transform:none;
  }
  .level-info strong{font-size:15px}
  .level-info span{font-size:11px}
  .combo{margin-top:6px;font-size:10px}
  .combo b{font-size:15px}

  .pitch-panel{
    right:8px;
    top:72px;
    width:88px;
    padding:8px;
    border-radius:13px;
    transform:none;
  }
  .pitch-title{font-size:11px;margin-bottom:7px}
  .pitch-meter{width:24px;height:135px}
  .pitch-status{font-size:9px;margin-top:7px}
  .pitch-hz{font-size:9px}

  /* Keep the entire 8-step staircase inside a portrait screen. */
  .ladder{
    left:10px;
    right:auto;
    bottom:82px;
    width:850px;
    height:470px;
    transform:scale(.54);
    transform-origin:left bottom;
  }

  .cat{width:92px;height:123px}

  .bottom-panel{
    left:7px;
    right:7px;
    bottom:7px;
    min-height:55px;
    height:55px;
    padding:4px 7px;
    gap:8px;
    border-radius:12px;
  }
  .target{min-width:75px}
  .target small{font-size:8px}
  #targetNote{font-size:21px;line-height:21px}
  .target-hand{height:17px;font-size:17px}
  .mic-button{padding:7px 9px;font-size:11px;border-radius:9px}
  .instruction{display:none}

  .controls{
    margin-top:6px;
    gap:7px;
  }
  .controls button{
    padding:8px 14px;
    font-size:12px;
    border-radius:9px;
  }
}

@media (max-width:420px){
  .game-title{font-size:13px}
  #methodSelect{max-width:125px;min-width:95px;font-size:9px}
  .stats{font-size:10px;gap:4px}
  .game-world{height:calc(100svh - 112px)}
  .ladder{left:5px;transform:scale(.48)}
  .pitch-panel{width:82px;right:6px}
  .level-info{width:105px}
  .bottom-panel{left:5px;right:5px}
}
@supports (padding: env(safe-area-inset-bottom)){
      .game{padding-bottom:max(4px,env(safe-area-inset-bottom))}
      .bottom-panel{bottom:max(7px,env(safe-area-inset-bottom))}
    }
</style>
</head>

<aside class="pitch-panel"><div class="pitch-title">PITCH</div><div class="pitch-meter"><div id="pitchFill" class="pitch-fill"></div><div class="pitch-center"></div></div><div id="pitchStatus" class="pitch-status">HAZIR</div><div id="pitchHz" class="pitch-hz">—</div></aside>
<section class="bottom-panel"><div class="target"><small>HEDEF NOTA</small><div id="targetNote">DO</div><div id="targetHand" class="target-hand">✊</div></div><button id="micBtn" class="mic-button">🎤 Mikrofon</button><div id="instruction" class="instruction">Başla'ya bas ve hedef notayı söyle.</div></section>
</section>
<section class="controls"><button id="startBtn">▶ BAŞLA</button><button id="resetBtn">↻ YENİDEN</button></section>
</main>
<script>
(() => {
"use strict";
const NOTES=[
{name:"DO",display:"DO",freq:261.63,hand:"✊"},
{name:"RE",display:"RE",freq:293.66,hand:"🤚"},
{name:"MI",display:"Mİ",freq:329.63,hand:"🫳"},
{name:"FA",display:"FA",freq:349.23,hand:"👇"},
{name:"SOL",display:"SOL",freq:392,hand:"✋"},
{name:"LA",display:"LA",freq:440,hand:"🫴"},
{name:"SI",display:"Sİ",freq:493.88,hand:"☝️"},
{name:"DO2",display:"DO'",freq:523.25,hand:"✊"}
];
const TOLERANCE=30;
let current=0,direction=1,coins=0,score=0,combo=0,started=false,locked=false;
let method="scale-up";
let playSequence=[0,1,2,3,4,5,6,7];
let seqPos=0;
let stream=null,ctx=null,analyser=null,source=null,raf=null,lastHit=0;
const $=id=>document.getElementById(id);
const ladder=$("ladder"),cat=$("cat"),status=$("pitchStatus"),hz=$("pitchHz"),fill=$("pitchFill");

function buildSequence(){
  const sequences={
    "scale-up":[0,1,2,3,4,5,6,7],
    "scale-down":[7,6,5,4,3,2,1,0],
    "scale-both":[0,1,2,3,4,5,6,7,6,5,4,3,2,1,0],
    "arp-up":[0,2,4,7],
    "arp-down":[7,4,2,0],
    "arp-both":[0,2,4,7,4,2,0]
  };
  playSequence=sequences[method]||sequences["scale-up"];
  seqPos=0;
}

function isArpeggioMethod(){
  return method==="arp-up" || method==="arp-down" || method==="arp-both";
}

function isArpeggioNote(index){
  return index===0 || index===2 || index===4 || index===7;
}

function updateCoinsForMethod(){
  const isArp=isArpeggioMethod();

  document.querySelectorAll(".coin").forEach(c=>{
    const i=Number(c.dataset.index);

    // Gam: EVERY note has a coin.
    // Arpeggio: coins only on DO-MI-SOL-DO' positions.
    const show = isArp ? isArpeggioNote(i) : true;

    c.style.display = show ? "" : "none";
    c.style.pointerEvents = show ? "auto" : "none";
    c.classList.remove("collected");
  });
}

function setTarget(i){
 current=Math.max(0,Math.min(7,i));locked=false;
 const n=NOTES[current];
 $("targetNote").textContent=n.display;$("targetHand").textContent=n.hand;
 updateCoinsForMethod();
 status.textContent=`HEDEF: ${n.display} • DUYULAN: —`;status.className="pitch-status";hz.textContent="—";
 document.querySelectorAll(".step").forEach((s,k)=>s.classList.toggle("active-target",k===current));
 document.querySelectorAll(".coin").forEach((c,k)=>c.classList.toggle("inactive",k!==current));
}
function catToStep(i){
 const step=document.querySelector(`.step[data-index="${i}"]`); if(!step)return;
 const x=step.offsetLeft+(step.offsetWidth-cat.offsetWidth)/2;
 const bottom=ladder.clientHeight-step.offsetTop-step.offsetHeight+0;
 cat.style.left=Math.round(x)+"px";cat.style.bottom=Math.round(bottom)+"px";
 cat.classList.remove("jump");void cat.offsetWidth;cat.classList.add("jump");
}
function startPosition(){
  requestAnimationFrame(()=>{
    const startPoint=document.querySelector(".start-point");
    if(startPoint){
      const x=startPoint.offsetLeft+(startPoint.offsetWidth-cat.offsetWidth)/2;
      const bottom=ladder.clientHeight-startPoint.offsetTop-startPoint.offsetHeight;
      cat.style.left=Math.round(x)+"px";
      cat.style.bottom=Math.round(bottom)+"px";
      cat.classList.remove("jump");
    }else{
      cat.style.left="40px";
      cat.style.bottom="0px";
      cat.classList.remove("jump");
    }
  });
}
function ref(i){
 const n=NOTES[i];try{
  const ac=window._refAC||(window._refAC=new(window.AudioContext||window.webkitAudioContext)());
  if(ac.state==="suspended")ac.resume();
  const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=n.freq;
  g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.2,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.7);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.75);
 }catch(e){console.error(e)}
}
function autoCorrelate(buf,sr){
 let rms=0;for(const v of buf)rms+=v*v;rms=Math.sqrt(rms/buf.length);if(rms<.008)return -1;
 let minLag=Math.floor(sr/1000),maxLag=Math.min(Math.floor(sr/80),buf.length-2),bestLag=-1,best=-1;
 for(let lag=minLag;lag<=maxLag;lag++){
  let sum=0,a2=0,b2=0;
  for(let i=0;i<buf.length-lag;i++){let a=buf[i],b=buf[i+lag];sum+=a*b;a2+=a*a;b2+=b*b}
  const c=sum/Math.sqrt((a2*b2)||1);
  if(c>best){best=c;bestLag=lag}
 }
 if(best<.45)return -1;
 const y1=bestLag>minLag?corrAt(buf,bestLag-1,sr):best;
 const y2=best;
 const y3=bestLag<maxLag?corrAt(buf,bestLag+1,sr):best;
 const delta=(y1-y3)/(2*(y1-2*y2+y3)||1);
 return sr/(bestLag+delta);
}
function corrAt(buf,lag){let s=0,a2=0,b2=0;for(let i=0;i<buf.length-lag;i++){const a=buf[i],b=buf[i+lag];s+=a*b;a2+=a*a;b2+=b*b}return s/Math.sqrt((a2*b2)||1)}
function centsFor(f,target){
 if(!f||!target)return Infinity;
 let x=f;
 while(x<target/Math.pow(2,1/12))x*=2;
 while(x>target*Math.pow(2,1/12))x/=2;
 return 1200*Math.log2(x/target);
}
function noteName(f){
 const names=["DO","DO#","RE","RE#","Mİ","FA","FA#","SOL","SOL#","LA","LA#","Sİ"];
 let m=Math.round(69+12*Math.log2(f/440));return names[((m%12)+12)%12];
}
function process(f){
 if(!started||locked||!f)return;
 const n=NOTES[current],cents=centsFor(f,n.freq);
 fill.style.bottom=(50+Math.max(-100,Math.min(100,cents))/2)+"%";
 const dn=noteName(f);hz.textContent=dn+" · "+Math.round(f)+" Hz";
 status.textContent=`HEDEF: ${n.display} • DUYULAN: ${dn}`;
 if(Math.abs(cents)<=TOLERANCE && performance.now()-lastHit>300){
  lastHit=performance.now();locked=true;status.textContent=`HEDEF: ${n.display} • DUYULAN: ${dn} ✓`;status.className="pitch-status correct";
  collect();
 }
}
function loop(){
 if(!analyser)return;
 const buf=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(buf);
 const f=autoCorrelate(buf,ctx.sampleRate);
 if(f>0)process(f);else{hz.textContent="—";fill.style.bottom="50%"}
 raf=requestAnimationFrame(loop);
}
async function mic(){
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("getUserMedia yok");
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
  ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  analyser=ctx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0;
  source=ctx.createMediaStreamSource(stream);source.connect(analyser);
  $("micBtn").textContent="🎤 Mikrofon Açık";$("micBtn").classList.add("active");loop();
 }catch(e){console.error(e);started=false;$("startBtn").disabled=false;alert("Mikrofon izni verilmedi veya tarayıcı mikrofonu açamadı.");}
}
function stop(){
 if(raf)cancelAnimationFrame(raf);raf=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
 if(ctx)ctx.close().catch(()=>{});ctx=null;analyser=null;source=null;$("micBtn").textContent="🎤 Mikrofon";$("micBtn").classList.remove("active");
}
function collect(){
 const arp=isArpeggioMethod();
 const coin=document.querySelector(`.coin[data-index="${current}"]`);

 if(arp && coin && coin.style.display!=="none"){
   coin.classList.add("collected");
   coins++;
   $("coinCount").textContent=coins;
 }

 combo++;
 score += arp ? 100+combo*10 : 50+combo*5;
 $("score").textContent=score;
 $("combo").textContent=combo;

 catToStep(current);

 setTimeout(()=>{
   seqPos++;
   if(seqPos<playSequence.length){
     setTarget(playSequence[seqPos]);
   }else{
     started=false;
     stop();
     status.textContent="🎉 EGZERSİZ TAMAMLANDI!";
     status.className="pitch-status correct";
     $("startBtn").disabled=false;
   }
 },450);
}

function reset(){
 stop();
 current=0;
 direction=1;
 coins=0;
 score=0;
 combo=0;
 started=false;
 locked=false;
 buildSequence();

 $("coinCount").textContent=0;
 $("score").textContent=0;
 $("combo").textContent=0;

 startPosition();
 setTarget(playSequence[0]);
 $("startBtn").disabled=false;
 $("instruction").textContent="Başla'ya bas ve hedef notayı söyle.";
}

document.querySelectorAll(".step").forEach(s=>s.addEventListener("click",()=>ref(+s.dataset.index)));
document.querySelectorAll(".coin").forEach(c=>c.addEventListener("click",e=>{e.stopPropagation();ref(+c.dataset.index)}));
$("startBtn").addEventListener("click",async()=>{method=$("methodSelect").value;reset();started=true;$("startBtn").disabled=true;$("instruction").textContent="Mikrofon açık. DO sesini söyle.";await mic()});
$("micBtn").addEventListener("click",async()=>{if(stream)stop();else{started=true;await mic()}});
$("resetBtn").addEventListener("click",reset);
window.addEventListener("resize",()=>{if(started&&current>=0&&locked===false){}});
$("methodSelect").addEventListener("change",()=>{
 method=$("methodSelect").value;
 reset();
});
method=$("methodSelect").value;
buildSequence();
startPosition();
setTarget(playSequence[0]);
