<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOCALY – Nota Merdiveni</title>
<style>
*{box-sizing:border-box}
:root{
  --nav:#071326;--panel:#0a1730;--gold:#ffd43b;--white:#fff;
}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#69c9f5;color:#fff}
body{overflow-x:hidden}
button{font:inherit}
.app{min-height:100vh;background:
 radial-gradient(circle at 10% 22%,#fff 0 2px,transparent 3px),
 radial-gradient(circle at 72% 12%,#fff 0 2px,transparent 3px),
 linear-gradient(#5bc5f2 0%,#9de4fb 52%,#65c9e7 100%);position:relative}
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;background:#ffffffb8;border-radius:999px;filter:blur(1px)}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud.a{width:260px;height:55px;left:6%;top:17%}.cloud.a:before{width:100px;height:100px;left:45px;top:-42px}.cloud.a:after{width:75px;height:75px;left:135px;top:-30px}
.cloud.b{width:310px;height:60px;right:8%;top:13%}.cloud.b:before{width:115px;height:115px;left:70px;top:-55px}.cloud.b:after{width:85px;height:85px;left:170px;top:-35px}
.island{position:absolute;background:#6d4d38;border-radius:45% 55% 30% 30%;box-shadow:inset 0 12px #69b83e,0 20px 35px #28708c55}
.island.one{width:210px;height:110px;left:17%;top:25%;transform:rotate(-4deg)}
.island.two{width:175px;height:90px;right:13%;top:29%;transform:rotate(5deg)}
.castle{position:absolute;color:#8e72c9;text-shadow:0 3px #65448e}
.castle.one{left:22%;top:18%;font-size:80px}.castle.two{right:16%;top:27%;font-size:65px}

.hud{position:relative;z-index:10;height:94px;background:linear-gradient(#09152b,#071326);border-bottom:4px solid #233c67;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 28px;box-shadow:0 5px 20px #001a3855}
.logo{font-size:28px;font-weight:1000;color:#ffd43b;text-shadow:0 3px #8b5b00;letter-spacing:.5px}
.logo small{display:block;font-size:12px;color:#fff;letter-spacing:2px;text-shadow:none}
.chars{display:flex;gap:6px;padding:5px 10px;border-radius:40px;background:#101d38;border:2px solid #35527f}
.char-btn{border:0;border-radius:30px;padding:7px 18px;background:transparent;color:#fff;font-weight:900;cursor:pointer}
.char-btn.active{background:#20a9ee;box-shadow:inset 0 -4px #0878bd,0 0 14px #23b8ff88}
.char-btn.maya.active{background:#8c4ee8;box-shadow:inset 0 -4px #6332b0,0 0 14px #9c65ff88}
.hud-right{justify-self:end;display:flex;gap:14px;align-items:center}
.stat{min-width:100px;padding:8px 16px;border-radius:28px;background:#101d38;border:2px solid #35527f;text-align:center;font-size:20px;font-weight:900}
.stat.coin{color:#ffd43b}.stat.life{color:#ff6373}.gear{font-size:26px}

.world-wrap{position:relative;z-index:2;max-width:1540px;margin:auto;padding:14px}
.world{position:relative;height:720px;border-radius:30px;border:4px solid #173a69;overflow:hidden;background:
 radial-gradient(circle at 75% 26%,#fff8 0 2px,transparent 3px),
 radial-gradient(circle at 56% 18%,#fff8 0 2px,transparent 3px),
 linear-gradient(180deg,#63c9f2 0%,#b5ecff 54%,#78d5e8 100%);
box-shadow:0 12px 40px #063b6155}
.hill{position:absolute;bottom:-100px;border-radius:50% 50% 0 0;background:#63bf70;filter:drop-shadow(0 -8px #4d9f62)}
.hill.h1{left:-8%;width:58%;height:280px}.hill.h2{right:-10%;width:55%;height:250px;background:#55b56d}
.ground{position:absolute;left:-5%;right:-5%;bottom:-55px;height:150px;background:linear-gradient(#5fc85f,#319b55);border-radius:50% 50% 0 0;border-top:8px solid #8be47b}

.info{position:absolute;left:18px;top:18px;z-index:30;background:#071326ee;border:2px solid #35527f;border-radius:18px;padding:15px 18px;width:160px;box-shadow:0 8px 18px #00152c55}
.info strong{color:#43e58a;font-size:18px}.info .score{margin-top:12px;color:#ffd43b;font-size:27px;font-weight:1000}.info small{color:#c8d4e7}.combo{margin-top:7px;font-weight:900;color:#ff9e2c}

.pitch{position:absolute;right:18px;top:16px;z-index:35;width:235px;height:72px;padding:8px 12px;border-radius:18px;background:#071326ed;border:2px solid #35527f;display:grid;grid-template-columns:92px 1fr 52px;align-items:center;gap:10px;box-shadow:0 8px 18px #00152c55}
.pitch h3{margin:0;color:#c8d5ff;font-size:11px;white-space:nowrap}
.meter{position:relative;margin:0;width:100%;height:18px;border:2px solid #435d85;border-radius:12px;background:linear-gradient(90deg,#18385a,#0a1931);overflow:hidden}
.meter-zone{position:absolute;top:2px;bottom:2px;left:42%;width:16%;border-radius:8px;background:#22c55e55;border:1px solid #4ade80}
.needle{position:absolute;top:1px;bottom:1px;left:50%;width:5px;border-radius:4px;background:#fff;box-shadow:0 0 10px #fff;transform:translateX(-50%);transition:left .05s}
.pitch-state{margin:0;font-size:11px;font-weight:1000;color:#ffd43b;text-align:center}.pitch-state.ok{color:#4ade80}.heard{position:absolute;right:12px;bottom:5px;font-size:10px;color:#8fa6c8}

.ladder{position:absolute;left:205px;right:180px;top:92px;bottom:88px}
.step{position:absolute;width:132px;height:78px;border:4px solid #ffffffbb;border-radius:13px 13px 8px 8px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 0 #07132655,inset 0 4px #fff7;transition:.16s;z-index:5}
.step:hover{filter:brightness(1.1);transform:translateY(-3px)}
.step.active{filter:brightness(1.12);box-shadow:0 10px 0 #07132655,0 0 0 4px #fff7,0 0 28px #ffe04b;transform:translateY(-4px)}
.s0{left:0;bottom:0;background:#ef4444}.s1{left:115px;bottom:52px;background:#f97316}.s2{left:230px;bottom:104px;background:#f3bd16}.s3{left:345px;bottom:156px;background:#31c861}.s4{left:460px;bottom:208px;background:#18a7e4}.s5{left:575px;bottom:260px;background:#6467e8}.s6{left:690px;bottom:312px;background:#cf42e7}.s7{left:805px;bottom:364px;background:#ef4444}
.note{font-size:24px;font-weight:1000;text-shadow:0 3px 2px #0007}
.hand{position:absolute;left:50%;bottom:-62px;transform:translateX(-50%);font-size:38px;filter:drop-shadow(0 3px 2px #0006);pointer-events:none}
.coin{position:absolute;left:50%;top:-56px;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;border:3px solid #fff4a8;background:radial-gradient(circle at 32% 28%,#fff8ad,#ffd43b 48%,#d88b00);box-shadow:0 0 0 5px #ffe66a33,0 0 25px #ffd43b;display:flex;align-items:center;justify-content:center;font-size:23px;cursor:pointer;animation:float 1.2s ease-in-out infinite}
.coin.off{opacity:.15;filter:grayscale(1);box-shadow:none}
.coin.taken{animation:take .45s forwards}
@keyframes float{50%{transform:translate(-50%,-8px)}}@keyframes take{to{transform:translate(-50%,-70px) scale(1.6);opacity:0}}

.start{position:absolute;left:-115px;bottom:-4px;width:92px;height:72px;border-radius:12px;background:#153151;border:3px solid #54769f;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 8px #07132655}
.start:after{content:"BAŞLA";position:absolute;top:-30px;background:#173252;padding:4px 10px;border-radius:7px;font-size:11px;font-weight:1000}
.cat{position:absolute;z-index:20;width:86px;height:86px;left:-104px;bottom:-2px;transition:left .30s cubic-bezier(.2,.9,.2,1),bottom .30s cubic-bezier(.2,.9,.2,1);filter:drop-shadow(0 12px 6px #0007);pointer-events:none}
.cat.jump{animation:jump .38s ease-out}@keyframes jump{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-55px) rotate(-5deg) scale(1.08)}65%{transform:translateY(-25px) rotate(5deg) scale(1.04)}100%{transform:translateY(0) rotate(0)}}
.cat svg{width:100%;height:100%}.cat-body{fill:#f8fafc;stroke:#a9b9ce;stroke-width:3}.cat-eye{fill:#28aef0;stroke:#17233b;stroke-width:2}.cat.maya .cat-body{fill:#141725;stroke:#3b435d}.cat.maya .cat-eye{fill:#ffd43b}

.bottom{position:absolute;left:22px;right:22px;bottom:10px;z-index:50;height:68px;min-height:68px;border-radius:18px;background:#071326ee;border:2px solid #35527f;display:grid;grid-template-columns:140px 1fr 210px;align-items:center;padding:6px 14px;gap:12px;box-shadow:0 8px 20px #00152c55}
.how{display:flex;align-items:center;gap:8px;color:#cbd8e9;font-size:10px}.how b{font-size:10px}.mic-icon{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#873be9;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 14px #9b55ff88}
.target{text-align:center;line-height:1}.target small{display:block;color:#a8b5ca;font-weight:900;font-size:9px}.target strong{display:inline-block;color:#ff76e6;font-size:27px;line-height:28px;text-shadow:0 2px #6b2f82}.target-hand{display:inline-block;font-size:17px;margin-left:4px}
.actions{text-align:center}.mic{border:0;border-radius:10px;padding:8px 14px;background:#e63335;color:#fff;font-weight:1000;font-size:11px;cursor:pointer}.mic.on{background:#b91c1c}.hint{margin-top:3px;color:#b9c7dc;font-size:10px}
.controls{position:relative;z-index:4;display:flex;justify-content:center;gap:12px;margin-top:10px}.controls button{border:0;border-radius:12px;padding:12px 24px;background:#ffd43b;color:#111;font-weight:1000;cursor:pointer}.controls button:disabled{opacity:.55}

@media(max-width:900px){
 .hud{height:auto;grid-template-columns:1fr;gap:7px;justify-items:center}.logo{font-size:21px}.hud-right{justify-self:center}.world{height:650px}.info{transform:scale(.78);transform-origin:top left}.pitch{right:10px;top:10px;transform:scale(.78);transform-origin:top right}.ladder{left:90px;right:auto;width:1000px;transform:scale(.72);transform-origin:left bottom}.bottom{grid-template-columns:1fr 1fr;height:62px;min-height:62px;padding:5px 10px}.how{display:none}.actions{grid-column:2}.target{grid-column:1}.world-wrap{padding:7px}
}
</style>
</head>
<body>
<div class="app">
<div class="sky"><div class="cloud a"></div><div class="cloud b"></div><div class="island one"></div><div class="island two"></div><div class="castle one">🏰</div><div class="castle two">🏰</div></div>

<header class="hud">
  <div class="logo">NOTA MERDİVENİ<small>VOCALY ACADEMY</small></div>
  <div class="chars">
    <button id="lokiBtn" class="char-btn active">🐱 LOKİ</button>
    <button id="mayaBtn" class="char-btn maya">🐈‍⬛ MAYA</button>
  </div>
  <div class="hud-right">
    <div class="stat coin">🪙 <span id="coinCount">0</span></div>
    <div class="stat life">❤️ <span id="lives">3</span></div>
    <div class="gear">⚙️</div>
  </div>
</header>

<main class="world-wrap">
<section class="world">
  <div class="hill h1"></div><div class="hill h2"></div><div class="ground"></div>

  <div class="info">
    <strong>SEVİYE 1</strong><br><small>Do – Do'</small>
    <div class="score">⭐ <span id="score">0</span></div>
    <div class="combo">🔥 Zincir <span id="combo">0</span></div>
  </div>

  <div id="ladder" class="ladder">
    <div class="start">🐾</div>

    <div class="step s0" data-index="0"><div class="note">DO</div><div class="hand">✊</div><button class="coin" data-index="0">🪙</button></div>
    <div class="step s1" data-index="1"><div class="note">RE</div><div class="hand">🤚</div><button class="coin" data-index="1">🪙</button></div>
    <div class="step s2" data-index="2"><div class="note">Mİ</div><div class="hand">🫳</div><button class="coin" data-index="2">🪙</button></div>
    <div class="step s3" data-index="3"><div class="note">FA</div><div class="hand">👇</div><button class="coin" data-index="3">🪙</button></div>
    <div class="step s4" data-index="4"><div class="note">SOL</div><div class="hand">✋</div><button class="coin" data-index="4">🪙</button></div>
    <div class="step s5" data-index="5"><div class="note">LA</div><div class="hand">🫴</div><button class="coin" data-index="5">🪙</button></div>
    <div class="step s6" data-index="6"><div class="note">Sİ</div><div class="hand">☝️</div><button class="coin" data-index="6">🪙</button></div>
    <div class="step s7" data-index="7"><div class="note">DO'</div><div class="hand">✊</div><button class="coin" data-index="7">🪙</button></div>

    <div id="cat" class="cat loki">
      <svg viewBox="0 0 100 100">
        <path class="cat-body" d="M27 39L22 17L39 27Q50 22 61 27L78 17L73 40Q82 51 78 67Q73 84 50 84Q27 84 22 67Q18 51 27 39Z"/>
        <circle class="cat-eye" cx="38" cy="49" r="5"/><circle class="cat-eye" cx="62" cy="49" r="5"/>
        <path d="M45 61Q50 65 55 61M50 58L50 64M38 61L17 57M38 66L17 67M62 61L83 57M62 66L83 67" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <aside class="pitch">
    <h3>PITCH GÖSTERGESİ</h3>
    <div class="meter"><div class="meter-zone"></div><div id="needle" class="needle"></div></div>
    <div id="pitchState" class="pitch-state">HAZIR</div>
    <div id="heard" class="heard">—</div>
  </aside>

  <section class="bottom">
    <div class="how"><div class="mic-icon">🎤</div><div><b>NASIL OYNANIR?</b><br>Hedef notayı doğru söylediğinde kedi zıplar ve coin'i toplar.</div></div>
    <div class="target"><small>HEDEF NOTA</small><strong id="targetNote">DO</strong><div id="targetHand" class="target-hand">✊</div></div>
    <div class="actions"><button id="micBtn" class="mic">🎤 MİKROFON AÇ</button><div id="hint" class="hint">Başla'ya bas ve DO sesini söyle.</div></div>
  </section>
</section>
<div class="controls"><button id="startBtn">▶ BAŞLA</button><button id="resetBtn">↻ YENİDEN</button></div>
</main>
</div>

<script>
(()=>{
"use strict";
const NOTES=[
 {name:"DO",display:"DO",freq:261.63,hand:"✊"},
 {name:"RE",display:"RE",freq:293.66,hand:"🤚"},
 {name:"MI",display:"Mİ",freq:329.63,hand:"🫳"},
 {name:"FA",display:"FA",freq:349.23,hand:"👇"},
 {name:"SOL",display:"SOL",freq:392,hand:"✋"},
 {name:"LA",display:"LA",freq:440,hand:"🫴"},
 {name:"SI",display:"Sİ",freq:493.88,hand:"☝️"},
 {name:"DO2",display:"DO'",freq:523.25,hand:"✊"}
];
const TOL=30;
let current=0,direction=1,coins=0,score=0,combo=0,lives=3,started=false,locked=false;
let stream=null,ctx=null,analyser=null,source=null,raf=null,lastHit=0;

const $=id=>document.getElementById(id);
const ladder=$("ladder"),cat=$("cat");

function setTarget(i){
 current=Math.max(0,Math.min(7,i));
 locked=false;
 const n=NOTES[current];
 $("targetNote").textContent=n.display;
 $("targetHand").textContent=n.hand;
 $("pitchState").textContent="HAZIR";
 $("pitchState").className="pitch-state";
 $("heard").textContent="—";
 document.querySelectorAll(".step").forEach((s,k)=>s.classList.toggle("active",k===current));
 document.querySelectorAll(".coin").forEach((c,k)=>c.classList.toggle("off",k!==current));
 $("hint").textContent=`${n.display} sesini söyle.`;
}

/* REFERANS SES SADECE SES VERİR.
   ÖNEMLİ: Burada current, target, coin veya kedi HİÇ değişmez. */
function referenceSound(i){
 const n=NOTES[i];
 try{
   const AC=window.AudioContext||window.webkitAudioContext;
   const ac=window._refAC||(window._refAC=new AC());
   if(ac.state==="suspended")ac.resume();
   const o=ac.createOscillator(),g=ac.createGain();
   o.type="sine";o.frequency.value=n.freq;
   g.gain.setValueAtTime(.0001,ac.currentTime);
   g.gain.exponentialRampToValueAtTime(.18,ac.currentTime+.025);
   g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.65);
   o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.7);
 }catch(e){console.error(e)}
}

function moveCatTo(i){
 const step=document.querySelector(`.step[data-index="${i}"]`);
 if(!step)return;
 const x=step.offsetLeft+(step.offsetWidth-cat.offsetWidth)/2;
 const bottom=ladder.clientHeight-step.offsetTop-step.offsetHeight+3;
 cat.style.left=Math.round(x)+"px";
 cat.style.bottom=Math.round(bottom)+"px";
 cat.classList.remove("jump");
 void cat.offsetWidth;
 cat.classList.add("jump");
}

function startCat(){cat.style.left="-104px";cat.style.bottom="-2px"}

function corrAt(buf,lag){
 let s=0,a2=0,b2=0;
 for(let i=0;i<buf.length-lag;i++){const a=buf[i],b=buf[i+lag];s+=a*b;a2+=a*a;b2+=b*b}
 return s/Math.sqrt((a2*b2)||1)
}
function autoCorrelate(buf,sr){
 let rms=0;for(const v of buf)rms+=v*v;
 rms=Math.sqrt(rms/buf.length);if(rms<.008)return -1;
 const minLag=Math.floor(sr/1000),maxLag=Math.min(Math.floor(sr/75),buf.length-2);
 let bestLag=-1,best=-1;
 for(let lag=minLag;lag<=maxLag;lag++){
   let c=corrAt(buf,lag);
   if(c>best){best=c;bestLag=lag}
 }
 if(best<.38)return -1;
 const y1=bestLag>minLag?corrAt(buf,bestLag-1):best;
 const y2=best;
 const y3=bestLag<maxLag?corrAt(buf,bestLag+1):best;
 const d=(y1-y3)/(2*(y1-2*y2+y3)||1);
 return sr/(bestLag+d);
}
function centsFor(f,target){
 let x=f;
 while(x<target/Math.pow(2,1/12))x*=2;
 while(x>target*Math.pow(2,1/12))x/=2;
 return 1200*Math.log2(x/target);
}
function noteName(f){
 const names=["DO","DO#","RE","RE#","Mİ","FA","FA#","SOL","SOL#","LA","LA#","Sİ"];
 const m=Math.round(69+12*Math.log2(f/440));
 return names[((m%12)+12)%12];
}
function processPitch(f){
 if(!started||locked||!f)return;
 const n=NOTES[current];
 const cents=centsFor(f,n.freq);
 const dn=noteName(f);
 const pos=Math.max(5,Math.min(95,50+cents/2));
 $("needle").style.top=pos+"%";
 $("heard").textContent=`${dn} · ${Math.round(f)} Hz`;
 $("pitchState").textContent=`HEDEF: ${n.display} • DUYULAN: ${dn}`;
 if(Math.abs(cents)<=TOL && performance.now()-lastHit>650){
   lastHit=performance.now();
   locked=true;
   $("pitchState").textContent=`DOĞRU! ${n.display} ✓`;
   $("pitchState").className="pitch-state ok";
   collectCurrent();
 }
}
function pitchLoop(){
 if(!analyser)return;
 const buf=new Float32Array(analyser.fftSize);
 analyser.getFloatTimeDomainData(buf);
 const f=autoCorrelate(buf,ctx.sampleRate);
 if(f>0)processPitch(f); else $("heard").textContent="Ses bekleniyor…";
 raf=requestAnimationFrame(pitchLoop);
}
async function openMic(){
 try{
   stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
   const AC=window.AudioContext||window.webkitAudioContext;
   ctx=new AC();await ctx.resume();
   analyser=ctx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0;
   source=ctx.createMediaStreamSource(stream);source.connect(analyser);
   $("micBtn").textContent="🎤 MİKROFON AÇIK";$("micBtn").classList.add("on");
   pitchLoop();
 }catch(e){
   console.error(e);started=false;$("startBtn").disabled=false;
   alert("Mikrofon izni verilmedi veya tarayıcı mikrofonu açamadı.");
 }
}
function stopMic(){
 if(raf)cancelAnimationFrame(raf);raf=null;
 if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
 if(ctx)ctx.close().catch(()=>{});ctx=null;analyser=null;source=null;
 $("micBtn").textContent="🎤 MİKROFON AÇ";$("micBtn").classList.remove("on");
}
function collectCurrent(){
 const coin=document.querySelector(`.coin[data-index="${current}"]`);
 if(coin){coin.classList.remove("off");coin.classList.add("taken")}
 coins++;combo++;score+=100+combo*10;
 $("coinCount").textContent=coins;$("score").textContent=score;$("combo").textContent=combo;
 /* KEDİ SADECE DOĞRU PITCH SONRASINDA BURADAN HAREKET EDER. */
 moveCatTo(current);
 setTimeout(()=>{
   if(direction===1&&current<7)setTarget(current+1);
   else if(direction===1){direction=-1;setTarget(6)}
   else if(direction===-1&&current>0)setTarget(current-1);
   else{
     started=false;stopMic();
     $("pitchState").textContent="🎉 TAMAMLANDI!";
     $("pitchState").className="pitch-state ok";
     $("startBtn").disabled=false;
   }
 },380);
}
function resetGame(){
 stopMic();current=0;direction=1;coins=0;score=0;combo=0;lives=3;started=false;locked=false;
 $("coinCount").textContent=0;$("score").textContent=0;$("combo").textContent=0;$("lives").textContent=3;
 document.querySelectorAll(".coin").forEach(c=>{c.classList.remove("taken");c.classList.remove("off")});
 startCat();setTarget(0);$("startBtn").disabled=false;
}

document.querySelectorAll(".step").forEach(step=>{
 step.addEventListener("click",()=>{
   /* Referans sese basmak kediyi ASLA hareket ettirmez. */
   referenceSound(+step.dataset.index);
 });
});
document.querySelectorAll(".coin").forEach(coin=>{
 coin.addEventListener("click",e=>{
   e.stopPropagation();
