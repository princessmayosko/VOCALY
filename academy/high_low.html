<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>İnce - Kalın Ses Avı | VOCALY Akademi</title>

    <link rel="stylesheet" href="css/high_low.css">

</head>

<body>

<header class="topbar">

    <a href="index.html" class="backButton">
        ← Akademiye Dön
    </a>

    <div class="titleArea">

        <h1>🎼 İnce - Kalın Ses Avı</h1>

        <p>Dinle, karar ver ve puan kazan!</p>

    </div>

</header>

<main class="gameContainer">

    <!-- Üst Bilgiler -->

    <section class="gameStatus">

        <div class="statusCard">

            <span>Soru</span>

            <h2 id="questionNumber">
                1 / 10
            </h2>

        </div>

        <div class="statusCard">

            <span>Puan</span>

            <h2 id="score">
                0
            </h2>

        </div>

    </section>

    <!-- İlerleme -->

    <section class="progressSection">

        <div class="progressBar">

            <div
                id="progressFill"
                class="progressFill">

            </div>

        </div>

    </section>

    <!-- Ses -->

    <section class="listenArea">

        <button
            id="playButton"
            class="playButton">

            🔊

            <span>Sesi Dinle</span>

        </button>

    </section>

    <!-- Cevap -->

    <section class="answerArea">

        <button
            id="thinButton"
            class="answerButton thin">

            🎵

            <span>İNCE</span>

        </button>

        <button
            id="thickButton"
            class="answerButton thick">

            🥁

            <span>KALIN</span>

        </button>

    </section>

    <!-- Geri Bildirim -->

    <section
        id="feedback"
        class="feedback">

    </section>

    <!-- Sonuç -->

    <section
        id="resultScreen"
        class="resultScreen hidden">

        <h2>

            🎉 Tebrikler

        </h2>

        <h3>

            Oyun Tamamlandı

        </h3>

        <p>

            Toplam Puan

        </p>

        <h1 id="finalScore">

            0

        </h1>

        <p id="earnedXP">

            +0 XP

        </p>

        <div class="resultButtons">

            <button
                id="restartButton">

                Tekrar Oyna

            </button>

            <a
                href="index.html">

                Akademiye Dön

            </a>

        </div>

    </section>

    <!-- Açılır Bilgi -->

    <section class="infoBox">

        <button
            id="toggleInfo"
            class="infoHeader">

            ℹ️ Etkinlik Bilgileri

            <span id="infoArrow">

                ▼

            </span>

        </button>

        <div
            id="infoContent"
            class="infoContent">

            <div class="infoItem">

                <h3>

                    🎯 Hedef Kazanım

                </h3>

                <p id="hedefKazanim">

                </p>

            </div>

            <div class="infoItem">

                <h3>

                    📚 Programdaki Konumu

                </h3>

                <p id="programKonumu">

                </p>

            </div>

            <div class="infoItem">

                <h3>

                    🧩 CIPP Boyutları

                </h3>

                <p id="cipp">

                </p>

            </div>

            <div class="infoItem">

                <h3>

                    📈 Beklenen Öğrenme Çıktıları

                </h3>

                <ul id="learningOutcomes">

                </ul>

            </div>

        </div>

    </section>

</main>

<script src="js/student.js"></script>

<script src="js/high_low.js"></script>

</body>

</html>
