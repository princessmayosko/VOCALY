<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vocaly — Air Mouse Kumanda</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#050708;color:#eef2f1;font-family:Arial,sans-serif}
main{width:min(560px,100%);padding:26px 20px 40px;margin:auto}h1{letter-spacing:6px}.sub{color:#789092;font-size:10px;letter-spacing:2px}
.card{margin-top:18px;padding:18px;border:1px solid #334042;border-radius:16px;background:#101617}
input{width:100%;height:50px;background:#080b0c;color:white;border:1px solid #384447;border-radius:10px;padding:0 14px;font-size:15px}
button{width:100%;height:50px;border:0;border-radius:10px;background:#e5c88e;color:#111;font-weight:700;margin-top:10px}
.status{margin-top:13px;padding:13px;border-radius:10px;background:#171d1e;font-size:12px;line-height:1.6}
.ok{color:#8ee6b1}.wait{color:#e5c88e}.bad{color:#ff9b9b}
.help{margin-top:14px;color:#78888a;font-size:11px;line-height:1.7}
</style>
</head>
<body><main>
<h1>VOCALY</h1><div class="sub">KONDUKTÖR • TELEFON AIR MOUSE</div>
<div class="card">
<input id="target" placeholder="Bilgisayarın kodunu gir">
<button id="connect">BİLGİSAYARA BAĞLAN</button>
<button id="sensor" disabled>SENSÖRÜ BAŞLAT</button>
<button id="cal" disabled>NÖTRÜ KALİBRE ET</button>
<div id="status" class="status"><span class="wait">● HAZIRLANIYOR…</span></div>
<div class="help">
Kalibrasyondan sonra telefonu <b>fiziksel olarak</b> sağa-sola ve yukarı-aşağı hareket ettir.
Telefonu kendi ekseninde döndürmek hedeflenmez.
<br><br>
İlk testte hareketi küçük ve kısa yap. Amaç serbest “mouse benzeri” kontrolü oturtmak.
</div>
</div>
</main>
<script>
let peer=new Peer(),conn=null,last=0,calibrating=false;
let neutralBeta=0,neutralGamma=0,haveNeutral=false;
const target=document.getElementById('target'),statusEl=document.getElementById('status'),sensor=document.getElementById('sensor'),cal=document.getElementById('cal');

peer.on('open',()=>{statusEl.innerHTML='<span class="ok">● HAZIR</span><br>Bilgisayar kodunu gir.'});
peer.on('error',e=>statusEl.innerHTML='<span class="bad">● PeerJS: '+e.type+'</span>');

document.getElementById('connect').onclick=()=>{
 const id=target.value.trim(); if(!id)return;
 conn=peer.connect(id,{reliable:false});
 statusEl.innerHTML='<span class="wait">● BAĞLANIYOR…</span>';
 conn.on('open',()=>{
   statusEl.innerHTML='<span class="ok">● BİLGİSAYAR BAĞLANDI</span><br>Şimdi sensörü başlat.';
   sensor.disabled=false;
 });
 conn.on('error',e=>statusEl.innerHTML='<span class="bad">● Bağlantı hatası</span><br>'+e.message);
};

sensor.onclick=async()=>{
 if(!window.isSecureContext){statusEl.innerHTML='<span class="bad">● HTTPS gerekli.</span>';return}
 try{
  if(typeof DeviceOrientationEvent==='undefined')throw new Error('Telefon yön sensörü desteklenmiyor');
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
   const p=await DeviceOrientationEvent.requestPermission();
   if(p!=='granted')throw new Error('Sensör izni verilmedi');
  }
  window.addEventListener('deviceorientation',onOrientation,true);
  cal.disabled=false;
  statusEl.innerHTML='<span class="ok">● SENSÖR AKTİF</span><br>Telefonu ekranı yukarı bakacak şekilde tut. Önce NÖTRÜ KALİBRE ET.';
 }catch(e){statusEl.innerHTML='<span class="bad">● '+e.message+'</span>'}
};

cal.onclick=()=>{
 neutralBeta=null; neutralGamma=null; haveNeutral=false; calibrating=true;
 statusEl.innerHTML='<span class="wait">● NÖTR KALİBRASYON…</span><br>Telefonu normal tut ve 1 saniye hiç oynatma.';
 setTimeout(()=>{
   if(neutralBeta!==null && neutralGamma!==null){
     haveNeutral=true;
     statusEl.innerHTML='<span class="ok">● KALİBRE EDİLDİ</span><br>Artık telefonu küçük açılarla yatır. Düzleştirince el durur.';
   } else {
     statusEl.innerHTML='<span class="bad">● Kalibrasyon verisi alınamadı.</span><br>Telefonu düz tutup tekrar dene.';
   }
   calibrating=false;
 },1000);
};

function angleDiff(a,b){
 let d=a-b;
 while(d>180)d-=360;
 while(d<-180)d+=360;
 return d;
}

function mouseVelocity(offset,maxAngle=22,maxSpeed=16){
 const dead=2.0;
 const sign=Math.sign(offset);
 const mag=Math.abs(offset);
 if(mag<=dead)return 0;
 const n=Math.min(1,(mag-dead)/(maxAngle-dead));
 // Daha küçük eğimlerde hassas, daha büyük eğimlerde hızlı: analog mouse hissi.
 const curved=n*n*0.75+n*0.25;
 return sign*curved*maxSpeed;
}

function onOrientation(e){
 if(e.beta==null || e.gamma==null)return;
 const beta=Number(e.beta), gamma=Number(e.gamma);
 if(!Number.isFinite(beta)||!Number.isFinite(gamma))return;

 if(calibrating){
   // 1 saniyelik nötr ortalaması: drift birikmez çünkü mutlak açıdan hız üretiyoruz.
   if(neutralBeta===null)neutralBeta=beta; else neutralBeta=neutralBeta*0.9+beta*0.1;
   if(neutralGamma===null)neutralGamma=gamma; else neutralGamma=neutralGamma*0.9+gamma*0.1;
   return;
 }
 if(!haveNeutral || !conn?.open)return;
 const now=performance.now();
 if(now-last<25)return;
 last=now;

 const dxAngle=angleDiff(gamma,neutralGamma);
 const dyAngle=angleDiff(beta,neutralBeta);

 // Telefon ekranı yukarı bakarken:
 // gamma = sağ/sol eğim, beta = yukarı/aşağı eğim.
 // İleri-geri/alpha kullanılmıyor. Z ekseni tamamen yok sayılıyor.
 const dx=mouseVelocity(dxAngle,22,18);
 const dy=-mouseVelocity(dyAngle,22,18);

 conn.send({dx,dy,t:Date.now()});
}

</script>
</body>
</html>
