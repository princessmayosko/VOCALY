<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vocaly — Telefon Kumanda</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#050708;color:#eef2f1;font-family:Arial,sans-serif}
main{width:min(560px,100%);padding:26px 20px 40px;margin:auto}h1{letter-spacing:6px}.sub{color:#789092;font-size:10px;letter-spacing:2px}
.card{margin-top:18px;padding:18px;border:1px solid #334042;border-radius:16px;background:#101617}
input{width:100%;height:50px;background:#080b0c;color:white;border:1px solid #384447;border-radius:10px;padding:0 14px;font-size:15px}
button{width:100%;height:50px;border:0;border-radius:10px;background:#e5c88e;color:#111;font-weight:700;margin-top:10px}
.status{margin-top:13px;padding:13px;border-radius:10px;background:#171d1e;font-size:12px;line-height:1.6}
.ok{color:#8ee6b1}.wait{color:#e5c88e}.bad{color:#ff9b9b}
</style>
</head>
<body><main>
<h1>VOCALY</h1><div class="sub">KONDUKTÖR • SERBEST HAREKET KUMANDA</div>
<div class="card">
<input id="target" placeholder="Bilgisayar kodunu gir">
<button id="connect">BİLGİSAYARA BAĞLAN</button>
<button id="sensor" disabled>SENSÖRÜ BAŞLAT</button>
<div id="status" class="status"><span class="wait">● HAZIRLANIYOR…</span></div>
</div>
</main>
<script>
let peer=new Peer(),conn=null,last=0;
const target=document.getElementById('target'),statusEl=document.getElementById('status'),sensor=document.getElementById('sensor');
peer.on('open',()=>statusEl.innerHTML='<span class="ok">● HAZIR</span><br>Bilgisayar kodunu gir.');
peer.on('error',e=>statusEl.innerHTML='<span class="bad">● PeerJS hatası: '+e.type+'</span>');

document.getElementById('connect').onclick=()=>{
 const id=target.value.trim(); if(!id)return;
 conn=peer.connect(id,{reliable:false});
 statusEl.innerHTML='<span class="wait">● BAĞLANIYOR…</span>';
 conn.on('open',()=>{statusEl.innerHTML='<span class="ok">● BİLGİSAYAR BAĞLANDI</span><br>Şimdi sensörü başlat.';sensor.disabled=false});
 conn.on('error',e=>statusEl.innerHTML='<span class="bad">● Bağlantı hatası</span><br>'+e.message);
};

window.addEventListener('deviceorientation',e=>{
  if(Number.isFinite(e.beta)) window._beta=e.beta;
  if(Number.isFinite(e.gamma)) window._gamma=e.gamma;
},true);

sensor.onclick=async()=>{
 if(!window.isSecureContext){statusEl.innerHTML='<span class="bad">● HTTPS gerekli.</span>';return}
 if(typeof DeviceMotionEvent==='undefined'){statusEl.innerHTML='<span class="bad">● DeviceMotion desteklenmiyor.</span>';return}
 try{
  if(typeof DeviceMotionEvent.requestPermission==='function'){
   const p=await DeviceMotionEvent.requestPermission();
   if(p!=='granted')throw new Error('Sensör izni verilmedi');
  }
  window.addEventListener('devicemotion',e=>{
    /*
      v5: X/Y'yi telefonun EĞİMİNDEN değil gerçek hareket ivmesinden üret.
      Bazı Android tarayıcıları acceleration.x/y içine yerçekimi etkisini
      yeterince temiz aktarmayabiliyor. Bu yüzden accelerationIncludingGravity
      + beta/gamma ile yerçekimi bileşenini matematiksel olarak çıkarıyoruz.
      Orientation burada KONTROL olarak kullanılmıyor; sadece gravity compensation.
    */
    const a=e.acceleration;
    const ag=e.accelerationIncludingGravity;
    const beta=Number(window._beta);
    const gamma=Number(window._gamma);

    let ax=Number(a && a.x), ay=Number(a && a.y), az=Number(a && a.z);

    if(!Number.isFinite(ax)||!Number.isFinite(ay)){
      if(!ag || !Number.isFinite(beta)||!Number.isFinite(gamma)){
        statusEl.innerHTML='<span class="bad">● Hareket sensörü verisi eksik.</span><br>Telefonun ivme sensörü okunamadı.';
        return;
      }

      const rad=Math.PI/180;
      const b=beta*rad, g=gamma*rad;
      const G=9.80665;

      // Cihaz eksenlerindeki yerçekimi bileşenleri.
      const gx=-G*Math.sin(g);
      const gy= G*Math.sin(b);
      const gz= G*Math.cos(b)*Math.cos(g);

      ax=Number(ag.x)-gx;
      ay=Number(ag.y)-gy;
      az=Number(ag.z)-gz;
    }

    const now=performance.now();
    if(conn?.open && now-last>=33){
      last=now;
      conn.send({type:'motion',ax,ay,az,t:Date.now()});
    }
  },true);
  statusEl.innerHTML='<span class="ok">● SERBEST HAREKET SENSÖRÜ AKTİF</span><br>Telefonu sağa-sola / yukarı-aşağı fiziksel olarak hareket ettir.';
 }catch(e){statusEl.innerHTML='<span class="bad">● '+e.message+'</span>'}
};
</script>
</body></html>
