<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Vocaly Defter Core v1</title>
<style>
body { background:#111; color:white; font-family:Arial; padding:20px; }
button { padding:10px 14px; margin:5px; }
.note { padding:6px; margin:4px; background:#222; border-radius:6px; }
.good { color:#4caf50; }
.bad { color:#ff5252; }
</style>
</head>
<body>

<h2>🎼 Vocaly Defter – Core v1</h2>

<div>
  Ölçü:
  <select id="meter">
    <option value="2/4">2/4</option>
    <option value="3/4">3/4</option>
    <option value="4/4" selected>4/4</option>
  </select>

  Nota:
  <select id="duration">
    <option value="1">Dörtlük</option>
    <option value="0.5">Sekizlik</option>
    <option value="0.25">Onaltılık</option>
  </select>

  <button onclick="play()">▶ Çal</button>
  <button onclick="clearNotes()">Temizle</button>
</div>

<hr>

<div id="notes"></div>

<hr>

<div id="status"></div>

<script>
// ====== DATA MOTOR ======

let notes = [];

function addNote(pitch) {
  const duration = parseFloat(document.getElementById("duration").value);

  const total = notes.reduce((a,n)=>a+n.duration,0);
  const capacity = getMeasureCapacity();

  if (total + duration > capacity) {
    setStatus("Ölçü dolu!", true);
    return;
  }

  notes.push({
    pitch,
    duration
  });

  render();
}

function clearNotes(){
  notes = [];
  render();
}

// ====== RİTİM MOTOR ======

function getMeasureCapacity(){
  const val = document.getElementById("meter").value;
  const [top,bottom] = val.split("/").map(Number);
  return top * (4 / bottom);
}

// ====== SES MOTOR ======

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx = new AudioCtx();

function playTone(freq, duration){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.frequency.value = freq;
  osc.type = "triangle";

  osc.connect(gain);
  gain.connect(ctx.destination);

  gain.gain.setValueAtTime(0.3, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

  osc.start();
  osc.stop(ctx.currentTime + duration);
}

// Nota frekansları (DO DOĞRU!)
const noteFreq = {
  "C4":261.63,
  "D4":293.66,
  "E4":329.63,
  "F4":349.23,
  "G4":392.00,
  "A4":440.00,
  "B4":493.88,
  "C5":523.25
};

// ====== ÇALMA ======

function play(){
  let t = ctx.currentTime;
  const tempo = 120;
  const beat = 60/tempo;

  notes.forEach(n=>{
    playTone(noteFreq[n.pitch], n.duration * beat);
    t += n.duration * beat;
  });
}

// ====== GÖRSEL ======

function render(){
  const div = document.getElementById("notes");
  div.innerHTML = "";

  notes.forEach(n=>{
    const el = document.createElement("div");
    el.className = "note";
    el.textContent = n.pitch + " (" + n.duration + ")";
    div.appendChild(el);
  });

  checkMeasure();
}

// ====== ÖLÇÜ KONTROL ======

function checkMeasure(){
  const total = notes.reduce((a,n)=>a+n.duration,0);
  const capacity = getMeasureCapacity();

  if (total === capacity) {
    setStatus("Ölçü TAMAM", false);
  } else if (total < capacity) {
    setStatus("Eksik", true);
  } else {
    setStatus("TAŞTI", true);
  }
}

function setStatus(msg, bad){
  const s = document.getElementById("status");
  s.innerHTML = msg;
  s.className = bad ? "bad" : "good";
}

// ====== PİYANO ======

const keys = ["C4","D4","E4","F4","G4","A4","B4","C5"];

keys.forEach(k=>{
  const b = document.createElement("button");
  b.textContent = k;
  b.onclick = ()=>addNote(k);
  document.body.appendChild(b);
});

</script>
</body>
</html>
